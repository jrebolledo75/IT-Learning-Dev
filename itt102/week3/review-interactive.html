<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT102 Week 3 Review Center</title><style>body{font-family:system-ui;background:#f5f7fb;color:#171334;margin:0}.w{max-width:1000px;margin:auto;padding:18px}.h,.p{background:white;border:1px solid #ddd6eb;border-radius:18px;padding:20px;margin-bottom:14px}.h{background:linear-gradient(120deg,#2456a6,#4b3670);color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button,a{padding:11px 14px;border:1px solid #ddd6eb;border-radius:10px;background:white;font-weight:800;cursor:pointer;text-decoration:none;color:#171334}.q{border:1px solid #ddd6eb;padding:14px;border-radius:12px;margin:9px 0}.ans{display:none;background:#eef8f4;padding:10px;border-radius:8px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class=w><div class=h><b>NCC · ITT102 · WEEK 3</b><h1>🎯 Review Center</h1><p>Physical networking, switches/routers, TCP vs UDP, addressing, DHCP, wall infrastructure, and troubleshooting.</p></div><div class=tabs><button onclick="show('study')">📘 Study Guide</button><button onclick="show('flash')">🧠 Flashcards</button><button onclick="show('quiz')">📝 Practice</button><button onclick="show('ready')">🚀 Readiness</button></div><div class=p id=app></div><a href="mission-ready.html">← Network Wall Challenge</a></div><script>
const A=document.getElementById('app'),cards=[['Switch','Forwards LAN frames primarily using MAC addresses.'],['Router','Connects networks and serves as a default gateway.'],['Keystone jack','Wall-side termination point for structured cabling.'],['Patch panel','Closet-side organization/termination for horizontal cable runs.'],['TCP','Connection-oriented transport emphasizing reliable ordered delivery.'],['UDP','Connectionless transport with lower overhead, often favored when timeliness matters.'],['DHCP','Automatically provides client IP configuration.'],['Default gateway','The router address a host uses to reach other networks.'],['Cable tester','Verifies continuity/wire-map after termination.'],['no shutdown','Cisco IOS command that administratively enables an interface.']];let i=0;
function show(x){({study,flash,quiz,ready}[x])()}function study(){A.innerHTML='<h2>Study Guide</h2><div class=grid><div class=q><b>Physical path</b><p>Endpoint → wall jack/keystone → horizontal cable → patch panel → patch cable → switch → router.</p></div><div class=q><b>LAN configuration</b><p>Know IP address, /24 mask, default gateway, DHCP vs static, and secure Wi-Fi.</p></div><div class=q><b>TCP vs UDP</b><p>Choose based on reliability/error checking versus speed/timeliness requirements.</p></div><div class=q><b>Troubleshooting</b><p>Check physical/link evidence first, then IP configuration, gateway, DHCP/DNS, and connectivity tests.</p></div></div>'}function flash(){let c=cards[i];A.innerHTML=`<h2>Flashcards</h2><div class=q onclick="this.querySelector('.ans').style.display='block'"><h3>${c[0]}</h3><p>Tap to reveal</p><div class=ans>${c[1]}</div></div><button onclick="i=(i+cards.length-1)%cards.length;flash()">←</button> ${i+1}/${cards.length} <button onclick="i=(i+1)%cards.length;flash()">→</button>`}
const Q=[['A new wall run has no link light. Best first check?',['DNS','Cable/jack/port','Application settings'],1],['Which device connects LAN devices and learns MAC addresses?',['Switch','Router','Modem'],0],['Which setting is required to reach a different subnet?',['Default gateway','SSID only','Patch panel'],0],['Which transport emphasizes reliable ordered delivery?',['UDP','TCP','ARP'],1],['What verifies a new termination?',['Cable tester','DNS server','Browser'],0]];let qi=0,score=0;function quiz(){let q=Q[qi];A.innerHTML=`<h2>Practice Quiz · ${qi+1}/${Q.length}</h2><div class=q><h3>${q[0]}</h3>${q[1].map((x,n)=>`<button onclick="answer(${n})">${x}</button>`).join(' ')}</div><p>Score: ${score}</p>`}function answer(n){if(n==Q[qi][2])score++;qi++;if(qi<Q.length)quiz();else A.innerHTML=`<h2>${score}/${Q.length}</h2><p>${score>=4?'Mission Ready — strong result.':'Review the Study Guide and try again.'}</p><button onclick="qi=0;score=0;quiz()">Replay</button>`}function ready(){A.innerHTML='<h2>Mission Readiness</h2><p>Can you identify the wall tools, trace the physical path, explain switch vs router, terminate/test a jack, configure a LAN, compare TCP/UDP, and troubleshoot from evidence?</p><div class=q><b>Final technician prompt:</b><p>A user has no connectivity. Explain the order in which you would check endpoint, cable, wall jack, patch panel, switch, IP configuration, gateway, and services—and what evidence each check gives you.</p></div>'}study();</script></body></html>
