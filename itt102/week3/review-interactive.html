<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT102 Week 3 Review Center</title><style>
:root{--ink:#171334;--p:#4b3670;--b:#2456a6;--t:#0e8998;--bg:#f5f7fb;--line:#ddd6eb}*{box-sizing:border-box}body{font-family:system-ui,Arial;background:var(--bg);color:var(--ink);margin:0}.w{max-width:1050px;margin:auto;padding:18px}.hero,.p{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#0e8998,#2456a6,#4b3670);color:white}.hero h1{margin:.2rem 0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tabs button,.btn{padding:12px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:850;cursor:pointer}.card{min-height:300px;border:2px solid var(--line);border-radius:22px;padding:28px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#fff,#f2eef8);cursor:pointer}.card .icon{font-size:4rem}.card h2{font-size:2rem;margin:.3rem}.answer{background:#eaf8f3;border-radius:14px;padding:16px;margin-top:12px}.controls{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:12px}.kahoot{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kahoot button{min-height:105px;border:0;border-radius:15px;color:white;font-size:1.05rem;font-weight:900;padding:16px;cursor:pointer}.kahoot button:nth-child(1){background:#c83d3d}.kahoot button:nth-child(2){background:#2465b4}.kahoot button:nth-child(3){background:#c18b13}.kahoot button:nth-child(4){background:#25855e}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.meter{height:12px;background:#e9e5f0;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:#4b3670}.result{text-align:center;padding:25px}.result strong{font-size:3rem}.small{color:#6b6476}.study{display:grid;grid-template-columns:1fr 1fr;gap:10px}.study div{padding:15px;border:1px solid var(--line);border-radius:13px}.back{text-decoration:none;color:var(--p);font-weight:850}@media(max-width:700px){.tabs{grid-template-columns:1fr 1fr}.kahoot,.study{grid-template-columns:1fr}}
</style></head><body><div class=w><div class=hero><b>NCC · ITT102 · WEEK 3</b><h1>🎮 Network Wall Review Arena</h1><p>Fast practice, visual flashcards, randomized questions, instant feedback, streaks, and replay — inspired by the energy of a classroom game show.</p></div><div class=tabs><button onclick="study()">📘 Study</button><button onclick="flash()">🧠 Flashcards</button><button onclick="startGame()">⚡ Challenge</button><button onclick="ready()">🚀 Readiness</button></div><div class=p id=app></div><a class=back href="mission-ready.html">← Network Wall Challenge</a></div><script>
const A=document.getElementById('app');const cards=[
['🔀','Switch','I learn MAC addresses and forward frames inside a LAN. What am I?','Switches primarily connect devices within the LAN and forward frames using MAC-address information.'],['🌐','Router','I am usually the host’s doorway to another network.','The router LAN address serves as the default gateway for clients.'],['🧩','Keystone Jack','I terminate the horizontal cable at the wall outlet.','The keystone is the workstation-side termination point in the structured cabling path.'],['🎛️','Patch Panel','I organize horizontal runs in the network closet.','Patch panels provide an organized termination point before short patch cables connect to the switch.'],['🧪','Cable Tester','Use me after termination before blaming DHCP.','A tester verifies continuity/wire map and helps establish whether the physical run is sound.'],['📦','DHCP','I automatically lease IP configuration to clients.','DHCP reduces manual addressing and uses a defined address pool.'],['🚪','Default Gateway','I am required when the destination is outside the local subnet.','The default gateway is the router interface a host sends remote-network traffic toward.'],['📨','TCP','Choose me when reliable, ordered delivery matters.','TCP is connection-oriented and emphasizes reliable ordered delivery.'],['⚡','UDP','Choose me when low overhead/timeliness matters more than retransmission.','UDP is connectionless and has lower overhead.'],['⌨️','no shutdown','On Cisco IOS, I bring an administratively disabled interface up.','After configuring an interface, no shutdown enables it administratively.']];let ci=0,reveal=false;
function flash(){let c=cards[ci];A.innerHTML=`<div class=topline><h2>🧠 Technician Flashcards</h2><b>${ci+1}/${cards.length}</b></div><div class=card onclick="reveal=true;flash()"><div><div class=icon>${c[0]}</div><div class=small>${reveal?'ANSWER':'WHO / WHAT AM I?'}</div><h2>${reveal?c[1]:c[2]}</h2>${reveal?`<div class=answer>${c[3]}</div>`:'<p>Tap the card to reveal the answer.</p>'}</div></div><div class=controls><button class=btn onclick="event.stopPropagation();ci=(ci+cards.length-1)%cards.length;reveal=false;flash()">← Previous</button><button class=btn onclick="event.stopPropagation();ci=(ci+1)%cards.length;reveal=false;flash()">Next →</button><button class=btn onclick="event.stopPropagation();cards.sort(()=>Math.random()-.5);ci=0;reveal=false;flash()">🔀 Shuffle</button></div>`}
const bank=[
['A new wall run has no link light. What should you investigate first?',['DNS server','Cable, jack, tester, and switch port','Browser cache','DHCP lease time'],1,'Start with physical/link evidence before changing higher-layer services.'],['Which device normally learns MAC addresses and forwards frames inside the LAN?',['Router','Switch','Patch panel','Keystone'],1,'That is the switch’s LAN role.'],['A PC can reach local devices but not another subnet. Which setting is most important?',['Default gateway','SSID name','Patch panel label','T568B color only'],0,'Remote-network traffic needs the default gateway.'],['Which transport emphasizes reliable, ordered delivery?',['UDP','ARP','TCP','ICMP'],2,'TCP provides connection-oriented reliable ordered delivery.'],['What should verify a newly terminated cable run?',['Cable tester','DNS lookup','Web browser','DHCP reservation'],0,'Test the physical termination/wire map.'],['Which component is the closet-side termination point for horizontal cabling?',['Router','Patch panel','Laptop NIC','Access point'],1,'The patch panel organizes and terminates horizontal runs in the closet.'],['Why place a static technician laptop outside the DHCP pool?',['To avoid address conflicts','To disable routing','To make Wi-Fi open','To change T568B'],0,'Keeping static addresses outside the dynamic pool prevents accidental duplicate assignments.'],['Which Wi-Fi choice is appropriate for this Week 3 lab?',['Open','WEP','WPA2/WPA3','No security'],2,'Use modern WPA2/WPA3 security rather than WEP or Open.'],['A Cisco router interface has the correct IP but remains administratively down. What command helps?',['ping','no shutdown','nslookup','ipconfig'],1,'no shutdown administratively enables the interface.'],['Which order best traces the physical path from a workstation?',['Laptop → wall jack → horizontal cable → patch panel → switch → router','Laptop → router → wall jack → patch panel','Switch → laptop → router → keystone','Router → DNS → patch panel → laptop'],0,'Trace the structured cabling from endpoint toward the network closet and gateway.'],['A client receives an address automatically from a configured pool. Which service did that?',['DNS','DHCP','TCP','ARP'],1,'DHCP leases client IP configuration.'],['What does a /24 IPv4 network use as its dotted-decimal subnet mask?',['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.255'],2,'/24 corresponds to 255.255.255.0.']];let game=[],qi=0,score=0,streak=0,best=0,locked=false;
function startGame(){game=[...bank].sort(()=>Math.random()-.5).slice(0,10);qi=0;score=0;streak=0;best=0;locked=false;gameQ()}
function gameQ(){let q=game[qi];A.innerHTML=`<div class=topline><b>⚡ QUESTION ${qi+1}/${game.length}</b><b>Score ${score} · 🔥 ${streak}</b></div><div class=meter><span style="width:${qi/game.length*100}%"></span></div><h2>${q[0]}</h2><div class=kahoot>${q[1].map((x,n)=>`<button onclick="pick(${n},this)">${['▲','◆','●','■'][n]} ${x}</button>`).join('')}</div><div id=feedback></div>`}
function pick(n,b){if(locked)return;locked=true;let q=game[qi],ok=n==q[2];if(ok){score+=100+streak*20;streak++;best=Math.max(best,streak)}else streak=0;[...b.parentNode.children].forEach((x,i)=>{x.disabled=true;if(i==q[2])x.style.outline='5px solid #152'});feedback.innerHTML=`<div class=answer><b>${ok?'✅ Correct!':'❌ Not quite.'}</b> ${q[3]}<br><br><button class=btn onclick="nextQ()">${qi+1<game.length?'Next Question →':'See Results 🏆'}</button></div>`}
function nextQ(){qi++;locked=false;if(qi<game.length)gameQ();else results()}
function results(){let pct=Math.round(score/(1000)*100);A.innerHTML=`<div class=result><div style="font-size:4rem">${score>=800?'🏆':score>=600?'🥈':'🧰'}</div><h2>Challenge Complete</h2><strong>${score}</strong><p>points · best streak 🔥 ${best}</p><p>${score>=800?'Mission Ready — excellent network-wall recall.':score>=600?'Near Mastery — one more run can strengthen recall.':'Return to flashcards/study, then replay the challenge.'}</p><button class=btn onclick=startGame()>🔁 Play Again</button><button class=btn onclick=flash()>🧠 Review Flashcards</button></div>`}
function study(){A.innerHTML='<h2>📘 Rapid Study Guide</h2><div class=study><div><b>Physical path</b><p>Endpoint → keystone/wall jack → horizontal cable → patch panel → patch cable → switch → router.</p></div><div><b>Termination</b><p>Follow the required T568B pin order and verify the wire map with a cable tester.</p></div><div><b>LAN addressing</b><p>Know IP, /24 mask, gateway, DHCP pool, and why static addresses should not collide with dynamic leases.</p></div><div><b>Switch vs Router</b><p>Switches connect LAN devices; routers connect networks and act as gateways.</p></div><div><b>TCP vs UDP</b><p>TCP emphasizes reliable ordered delivery; UDP emphasizes low overhead/timeliness.</p></div><div><b>Troubleshooting</b><p>Use evidence: physical/link first, then IP/mask/gateway, then DHCP/DNS and application services.</p></div></div>'}
function ready(){A.innerHTML='<h2>🚀 Mission Readiness Check</h2><p>Before the physical wall lab, explain these without guessing:</p><div class=study><div>🧰 Identify the wall-lab tools and state what each does.</div><div>🧱 Trace the complete structured-cabling path.</div><div>🔧 Explain why termination must be tested before IP troubleshooting.</div><div>🌐 Configure gateway, /24 mask, DHCP, static IP, and Wi-Fi security.</div><div>🔀 Explain switch versus router.</div><div>🚨 Defend your troubleshooting order using evidence.</div></div><p><b>Target:</b> score 800+ in the Challenge, then complete the Network Wall mission.</p>'}flash();
</script></body></html>
