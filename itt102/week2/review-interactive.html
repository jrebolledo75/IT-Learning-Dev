<!doctype html><html><head><title>ITT102 W2 Review</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#173b70,#4b2b82);color:white;padding:30px;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 4px 16px #0001}.btn{display:inline-block;background:#273c75;color:white;padding:11px 16px;border:0;border-radius:9px;text-decoration:none;cursor:pointer}.ok{color:#087f5b;font-weight:bold}.bad{color:#c92a2a;font-weight:bold}.drop{min-height:46px;border:2px dashed #8795a1;border-radius:9px;padding:8px;margin:6px;background:#fafcff}.chip{display:inline-block;padding:9px 12px;margin:5px;background:#e9eef9;border-radius:8px;cursor:grab}.wire{display:block;margin:5px;padding:9px;border-radius:7px;background:#eef2f7;cursor:grab}.tabs button{margin:4px}.hidden{display:none}.q{padding:14px;background:#fff;border-radius:12px;margin:12px 0}.progress{height:14px;background:#dde3ec;border-radius:8px;overflow:hidden}.bar{height:100%;background:#2f9e44;width:0}.score{font-size:1.2em;font-weight:bold}.jeo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.jeo button{padding:14px 4px;background:#243b7a;color:#ffd43b;border:0;border-radius:6px}.pin{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center;margin:6px 0} @media(max-width:650px){.jeo{grid-template-columns:repeat(2,1fr)}</style></head><body><div class="wrap"><a href="index.html">← Week 2 Home</a><div class="hero"><h1>🏆 ITT102 Week 2 Review Center</h1><p>Networking • Cabling • Ports • Cloud • Virtualization</p></div><div class="tabs"><button class="btn" onclick="show('flash')">Flashcards</button><button class="btn" onclick="show('jeo')">Jeopardy</button><button class="btn" onclick="show('quiz')">Practice Quiz</button><button class="btn" onclick="show('ready')">Readiness</button></div>
<section id="flash" class="card"><h2>🃏 Flashcards</h2><div id="fc" class="q"></div><button class="btn" onclick="flip()">Flip</button> <button class="btn" onclick="nextCard()">Next</button></section>
<section id="jeo" class="card hidden"><h2>🎮 Jeopardy</h2><p>Click a value. Answer aloud before revealing the answer.</p><div id="jb" class="jeo"></div><div id="jclue" class="q">Choose a clue.</div></section>
<section id="quiz" class="card hidden"><h2>📝 Randomized Practice Quiz</h2><div id="quizbox"></div><button class="btn" onclick="grade()">Grade Quiz</button><p id="grade" class="score"></p></section>
<section id="ready" class="card hidden"><h2>✅ Readiness Check</h2><label><input type=checkbox> I can explain IP address, DNS, router, and Wi-Fi in plain language.</label><br><label><input type=checkbox> I can match common protocols to ports.</label><br><label><input type=checkbox> I can place T-568B conductors in pins 1–8.</label><br><label><input type=checkbox> I can explain SaaS, PaaS, and IaaS.</label><br><label><input type=checkbox> I can distinguish edge, serverless, multi/hybrid cloud, and containers.</label><br><label><input type=checkbox> I am ready to build and test a physical CAT6 cable.</label></section></div>
<script>
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
let cards=[['IP address','A numerical address used to identify a device on an IP network.'],['DNS','Translates human-friendly names into IP addresses.'],['Router','Forwards traffic between different networks.'],['Switch','Connects devices within a local network.'],['DHCP','Automatically supplies IP configuration to clients.'],['HTTP / HTTPS','Web traffic: ports 80 / 443.'],['SSH','Secure remote command-line access: port 22.'],['SMTP / IMAP','Email sending / mailbox access: ports 25 / 143.'],['T-568B','Pins 1–8: W/O, O, W/G, B, W/B, G, W/Br, Br.'],['SaaS','Provider hosts software; users access the application over the internet.'],['PaaS','Cloud platform for developing, deploying, and managing applications.'],['IaaS','Virtualized servers, storage, and networking delivered over the internet.'],['Edge computing','Moves processing closer to devices to reduce latency.'],['Serverless computing','Run code without managing servers directly; resources scale as needed.'],['Kubernetes','Container orchestration for deployment, scaling, and management.']];let ci=0,back=0;function fc(){document.getElementById('fc').innerHTML='<h3>'+cards[ci][back?1:0]+'</h3><p>Card '+(ci+1)+' of '+cards.length+'</p>'}function flip(){back=1-back;fc()}function nextCard(){ci=(ci+1)%cards.length;back=0;fc()}fc();
let clues=[['Basics 100','What service translates names to IP addresses?','DNS'],['Basics 200','What device forwards traffic between networks?','Router'],['Ports 100','HTTPS','443'],['Ports 200','DNS','53'],['Ports 300','SSH','22'],['Cabling 100','Name the wiring standard practiced in this lab.','T-568B'],['Cabling 200','What connector is terminated on the CAT6 cable?','RJ45'],['Cloud 100','Hosted software accessed over the internet.','SaaS'],['Cloud 200','Processing closer to devices to reduce latency.','Edge computing'],['Cloud 300','Platform that orchestrates containers.','Kubernetes'],['Support 100','Best first goal when speaking with a nontechnical customer?','Explain clearly without unnecessary jargon'],['Support 200','Wi-Fi connected but sites fail: does connected Wi-Fi prove internet access?','No']];document.getElementById('jb').innerHTML=clues.map((c,i)=>`<button onclick="clue(${i})">${c[0]}</button>`).join('');function clue(i){let c=clues[i];document.getElementById('jclue').innerHTML='<b>'+c[1]+'</b><br><button class=btn onclick="this.parentElement.innerHTML+='<p class=ok>Answer: '+c[2].replaceAll("'","\'")+'</p>'">Reveal</button>'}
let bank=[['Which service resolves website names to IP addresses?',['DNS','DHCP','SSH','SMTP'],0,'DNS performs name resolution.'],['Which port is HTTPS?',['22','53','80','443'],3,'HTTPS commonly uses TCP 443.'],['Which port is SSH?',['22','25','53','143'],0,'SSH commonly uses TCP 22.'],['Which service automatically assigns client IP configuration?',['DNS','DHCP','IMAP','HTTP'],1,'DHCP supplies addressing configuration.'],['Which device connects devices inside a LAN?',['Switch','DNS server','ISP','Browser'],0,'A switch connects local network devices.'],['Which device routes traffic between networks?',['Switch','Router','RJ45','Cable tester'],1,'Routers forward traffic between networks.'],['What is the first T-568B conductor?',['White/Green','White/Orange','Blue','Brown'],1,'T-568B begins White/Orange.'],['What is pin 6 in T-568B?',['Green','Blue','Orange','White/Brown'],0,'Pin 6 is Green.'],['Which cloud model provides hosted software applications?',['IaaS','PaaS','SaaS','LAN'],2,'SaaS delivers software as a service.'],['Which cloud model provides virtual servers, storage, and networking?',['IaaS','SaaS','DNS','SMTP'],0,'IaaS provides virtualized infrastructure.'],['Which trend moves computation closer to devices?',['Serverless','Edge computing','SaaS','FinOps'],1,'Edge computing reduces latency by processing nearer the source.'],['Which platform automates deployment and scaling of containerized applications?',['Kubernetes','IMAP','RJ45','DNS'],0,'Kubernetes orchestrates containers.'],['A customer says Wi-Fi is connected but the internet fails. Best response?',['Use more acronyms','Explain Wi-Fi connection and internet access are separate, then troubleshoot','Replace the PC immediately','Tell them to call the ISP'],1,'Clear explanation plus structured troubleshooting is technician-friendly.'],['Which pair is email-related in this week’s material?',['SMTP and IMAP','DNS and DHCP','HTTP and SSH','RJ45 and CAT6'],0,'SMTP sends mail; IMAP accesses mailboxes.'],['What should happen after the digital cable simulator?',['Nothing','Physical CAT6 build and cable tester verification','Only take a screenshot','Skip the lab'],1,'The simulator prepares students for the assessed hands-on task.']];let chosen=[];function makeQuiz(){chosen=[...bank].sort(()=>Math.random()-.5).slice(0,10);document.getElementById('quizbox').innerHTML=chosen.map((q,i)=>`<div class=q><b>${i+1}. ${q[0]}</b><br>${q[1].map((a,j)=>`<label><input type=radio name=q${i} value=${j}> ${a}</label><br>`).join('')}<span id=f${i}></span></div>`).join('')}makeQuiz();function grade(){let n=0;chosen.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');let f=document.getElementById('f'+i);if(x&&+x.value==q[2]){n++;f.className='ok';f.textContent=' Correct. '+q[3]}else{f.className='bad';f.textContent=' Review: '+q[3]}});document.getElementById('grade').textContent='Score: '+n+'/10 ('+(n*10)+'%)';}
</script></body></html>
