<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT103 Final Exam Mastery Review 2.0</title><style>
:root{--bg:#f6f4fa;--panel:#fff;--panel2:#f1edf7;--line:#e1daed;--text:#241c38;--muted:#756d89;--purple:#4b3670;--teal:#0e8998;--orange:#f2720f;--green:#168657;--red:#c6423f;--shadow:0 8px 24px rgba(36,28,56,.08)}
body.dark{--bg:#17131f;--panel:#221c2d;--panel2:#2c2439;--line:#413650;--text:#f8f5ff;--muted:#b8aec8;--purple:#8e73bb;--teal:#38b6c4;--orange:#ff9b4a;--green:#48c78e;--red:#ff7772}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,Segoe UI,Arial,sans-serif}.app{max-width:1200px;margin:auto;padding:24px}.top,.row{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{height:34px}.brand .tech{height:29px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted)}h2,h3{color:var(--text)}.muted{color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,input{font:inherit}.btn{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:var(--purple);color:#fff}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.active{background:var(--teal)!important;color:#fff!important}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer}.card:hover{border-color:var(--teal);transform:translateY(-1px)}.metric{font-size:31px;font-weight:800;color:var(--teal)}.bar{height:9px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--teal))}.tag{font-size:12px;padding:4px 9px;border-radius:99px;background:#fde7d3;color:#a84c05}.question{font-size:19px;font-weight:700;line-height:1.45;margin:16px 0}.opts{display:grid;gap:10px}.opt{padding:13px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer}.opt.correct{border-color:var(--green);background:rgba(22,134,87,.14)}.opt.wrong{border-color:var(--red);background:rgba(198,66,63,.14)}.explain{margin-top:14px;padding:14px;border-left:4px solid var(--purple);background:var(--panel2);border-radius:8px}.exam-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:15px}.exam-nav button{padding:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px}.exam-nav .done{background:var(--teal);color:#fff}.flash{min-height:220px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:700;background:var(--panel2);border-radius:14px;padding:30px;cursor:pointer}.lab-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.lab-screen{min-height:300px;background:#111827;color:#e5e7eb;border-radius:12px;padding:18px;font-family:Consolas,monospace}.tree button{display:block;background:none;border:0;color:#bde4e8;padding:7px;text-align:left;cursor:pointer}.glossary input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);margin-bottom:12px}.footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:650px){.app{padding:14px}.title h1{font-size:22px}}

 CPU moves from one process to another in multitasking, this is known as","opts":["a stack access","synchronization","a context switch","interprocess communication","timer interrupt"],"correct":2,"missed":false,"domain":"Processes, Threads & Scheduling","explain":"The course answer is <b>a context switch</b>. Track process states, CPU scheduling, interrupts, and shared resources."},{"source":"Chapter 6","qnum":20,"q":"In order to distribute a single program across multiple processors, which of the following techniques do we need to use?","opts":["networked programming","message passing","parallel programming","pre-emptive multitasking","operating system system calls"],"correct":2,"missed":false,"domain":"Processes, Threads & Scheduling","explain":"The course answer is <b>parallel programming</b>. Track process states, CPU scheduling, interrupts, and shared resources."},{"source":"Chapter 6","qnum":21,"q":"The last step in the boot process before the user can use the system is to","opts":["test the CPU","it varies from computer to computer","test memory","load the operating system","initialize the operating system"],"correct":4,"missed":false,"domain":"Processes, Threads & Scheduling","explain":"The course answer is <b>initialize the operating system</b>. Track process states, CPU scheduling, interrupts, and shared resources."},{"source":"Chapter 6","qnum":28,"q":"In batch processing, the shortest job first scheduling algorithm","opts":["is the fairest strategy","is the easiest to implement","is the only form of batch processing that permits interactivity","results in the highest average wait time","results in the lowest average wait time"],"correct":4,"missed":false,"domain":"Processes, Threads & Scheduling","explain":"The course answer is <b>results in the lowest average wait time</b>. Track process states, CPU scheduling, interrupts, and shared resources."},{"source":"Chapter 6","qnum":29,"q":"When a running application makes a request of the operating system, it ashed"],"correct":1,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>A program accessed a page not in memory</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Final Exam","qnum":58,"q":"Which memory management strategy allows processes to use more memory than physically available?","opts":["Paging","Swapping","Overlaying","Virtual memory","Segmentation"],"correct":3,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>Virtual memory</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Final Exam","qnum":60,"q":"What is the term for moving inactive memory pages to disk?","opts":["Page Fault","Segmentation","Thrashing","Swapping","Fragmentation"],"correct":3,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>Swapping</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Final Exam","qnum":69,"q":"What is thrashing in memory management?","opts":["Constant swapping that slows performance","Saving unused pages","Efficient memory usage","Locking memory to prevent access","Memory alignment"],"correct":0,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>Constant swapping that slows performance</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Final Exam","qnum":75,"q":"Which memory management method divides memory into fixed-sized blocks?","opts":["Virtual memory","Swapping","Partitioning","Paging","Segmentation"],"correct":3,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>Paging</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":2,"q":"Before we had virtual memory, operating systems would place entire processes in memory. Upon a process completing, it would be removed from memory. If a new process were loaded into its place that was smaller in size, it would create","opts":["a page fault","an internal fragment","a memory violation","an external fragment","a memory compaction"],"correct":1,"missed":true,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>an internal fragment</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":3,"q":"Which of the following situations would not cause an interrupt?","opts":["All of the above would cause an interrupt","Page fault arises","Program run-time error","Timer elapses","Disk drive error arises"],"correct":0,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>All of the above would cause an interrupt</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":7,"q":"In a computer that uses virtual memory, the frame size is 1KB. How large is a program frame?","opts":["512B","4KB","2KB","1KB"],"correct":3,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>1KB</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":8,"q":"The CPU generates a(n) ___ address which is then translated into a(n) _ address.","opts":["physical, virtual","effective, relative","dynamic, static","logical/virtual, physical"],"correct":3,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>logical/virtual, physical</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":10,"q":"In virtual memory, a program is divided into fixed-sized __ and memory is divided into fixed-sized ____.","opts":["Pages, Segments","Frames, Pages","Blocks, Partitions","Pages, Frames","Segments, Blocks"],"correct":3,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>Pages, Frames</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":15,"q":"Page stealing is a technique whereby","opts":["the paging supervisor fetches multiple pages at a time when one needs to be swapped in, anticipating future swaps","the CPU idles while page swapping takes place","the CPU is allowed to continue executing in spite of a page fault","thrashing arises","the paging supervisor discards one or more pages to free up frames for future swaps"],"correct":4,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>the paging supervisor discards one or more pages to free up frames for future swaps</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":16,"q":"Which of the following is the best choice for a page to replace when we must replace a page in memory and memory is full?","opts":["the unmodified page least recently used","any modified page","the page least recently used","it could be any of these","the oldest page in memory"],"correct":0,"missed":false,"domain":"Memory & Virtual Memory","explain":"The course answer is <b>the unmodified page least recently used</b>. Remember that programs use pages, physical memory uses frames, and address translation connects virtual to physical memory."},{"source":"Chapter 6","qnum":23,"q":"A page fault arises when","opts":["deadlock arises","a requested page is not in memory","a C const save=()=>localStorage.setItem('itt103V2',JSON.stringify(store));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function header(){return `<div class="top"><div class="brand"><img src="${NCC}" alt="Northwest Career College logo"><img class="tech" src="${TECH}" alt="IT Technician Program icon"><div class="title"><h1>ITT103 Final Exam Mastery Review 2.0</h1><p>Official final-exam concepts, adaptive practice, flashcards, Windows administration labs, and exam simulation.</p></div></div><button class="btn secondary" onclick="toggleDark()">${document.body.classList.contains('dark')?'Light':'Dark'} Mode</button></div><div class="nav">${[['dashboard','Dashboard'],['sessions','Study Sessions'],['examSetup','Exam Simulator'],['adaptive','Adaptive Review'],['flash','Flashcards'],['labs','Interactive Labs'],['glossary','Glossary']].map(x=>`<button class="btn ${state.view===x[0]?'active secondary':'secondary'}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function render(){let h=header();if(state.view==='dashboard')h+=dashboard();if(state.view==='sessions')h+=sessionList();if(state.view==='study')h+=study();if(state.view==='examSetup')h+=examSetup();if(state.view==='exam')h+=exam();if(state.view==='examResult')h+=examResult();if(state.view==='adaptive')h+=adaptive();if(state.view==='flash')h+=flash();if(state.view==='labs')h+=labs();if(state.view==='glossary')h+=glossary();document.getElementById('app').innerHTML=h+'<div class="footer">Built from the supplied ITT103 final exam and Chapters 6, 7, and 12 quizzes. Progress is stored locally in this browser.</div>'}
function go(v){state.view=v;state.answered=false;render()}function toggleDark(){document.body.classList.toggle('dark');store.dark=document.body.classList.contains('dark');save();render()}
function dashboard(){let last=store.attempts.at(-1), mastered=Object.values(store.mastery).filter(x=>x>=.8).length;return `<div class="grid"><div class="panel"><div class="metric">${bank.length}</div><b>Instructor-aligned questions</b><p class="muted">75 final-exam questions plus 30 questions each from Chapters 6, 7, and 12.</p></div><div class="panel"><div class="metric">${store.attempts.length}</div><b>Exam attempts</b><p class="muted">${last?'Latest score: '+last.score+'%':'No simulated exam completed yet.'}</p></div><div class="panel"><div class="metric">${mastered}/10</div><b>Mastered domains</b><p class="muted">A domain is mastered at 80% or higher.</p></div><div class="panel"><div class="metric">${store.answered||0}</div><b>Questions practiced</b><p class="muted">Across study sessions.</p></div></div><div class="panel" style="margin-top:14px"><h2>Readiness recommendation</h2><p>${weakestText()}</p><button class="btn primary" onclick="go('adaptive')">Start Adaptive Review</button></div>`}
function weakestText(){let a=sessions.map(s=>[s.title,store.mastery[s.id]??0]).sort((x,y)=>x[1]-y[1]);return a[0][1]===0?'Start with the orange priority sessions, which contain questions missed in the supplied assessments.':`Your lowest current mastery is <b>${a[0][0]}</b> at ${Math.round(a[0][1]*100)}%.`}
function sessionList(){return `<div class="grid">${sessions.map((s,i)=>`<div class="card" onclick="openSession(${i})"><div class="row"><b>Session ${i+1}</b>${s.hot?'<span class="tag">Priority</span>':''}</div><h3>${s.title}</h3><p class="muted">${s.blurb}</p><p><b>${s.items.length} questions</b></p><div class="bar"><span style="width:${Math.round((store.mastery[s.id]||0)*100)}%"></span></div></div>`).join('')}</div>`}
function openSession(i){state.session=i;state.index=0;state.score=0;state.total=0;state.view='study';state.answered=false;render()}
function study(){let s=sessions[state.session],q=s.items[state.index];return `<div class="panel"><div class="row"><div><span class="tag">${q.source}${q.missed?' · Priority Review':''}</span><h2>${s.title}</h2></div><b>${state.index+1}/${s.items.length}</b></div><div class="bar"><span style="width:${(state.index/s.items.length)*100}%"></span></div><div class="question">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${state.answered?(i===q.correct?'correct':i===state.selected?'wrong':''):''}" ${state.answered?'disabled':''} onclick="answerStudy(${i})">${o}</button>`).join('')}</div>${state.answered?`<div class="explain"><b>${state.selected===q.correct?'Correct.':'Review:'}</b> ${q.explain}</div><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="nextStudy()">${state.index===s.items.length-1?'Finish':'Next'} →</button></div>`:''}</div>`}
function answerStudy(i){if(state.answered)return;state.answered=true;state.selected=i;state.total++;store.answered=(store.answered||0)+1;if(i===sessions[state.session].items[state.index].correct)state.score++;save();render()}function nextStudy(){let s=sessions[state.session];if(state.index<s.items.length-1){state.index++;state.answered=false;state.selected=null;render()}else{store.mastery[s.id]=state.total?state.score/state.total:0;save();state.view='sessions';render()}}
function examSetup(){return `<div class="panel"><h2>Final Exam Simulator</h2><p class="muted">Randomized course questions. Answers are hidden until submission.</p><label>Questions <select id="count"><option>30</option><option selected>50</option><option>75</option><option>100</option></select></label> <label>Time <select id="mins"><option>30</option><option selected>60</option><option>90</option></select> minutes</label> <button class="btn primary" onclick="startExam()">Start Exam</button></div>`}
function startExam(){let n=+document.getElementById('count').value;state.exam=shuffle(bank).slice(0,Math.min(n,bank.length));state.examAnswers={};state.examIndex=0;state.examStart=Date.now();state.examMinutes=+document.getElementById('mins').value;state.view='exam';render();clearInterval(window.timer);window.timer=setInterval(()=>{let t=document.getElementById('timer');if(t)t.textContent=timeLeft()},1000)}function timeLeft(){let left=Math.max(0,state.examMinutes*60-Math.floor((Date.now()-state.examStart)/1000));if(left===0&&state.view==='exam')submitExam();return `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}
function exam(){let q=state.exam[state.examIndex],sel=state.examAnswers[state.examIndex];return `<div class="panel"><div class="row"><b>${q.domain}</b><b id="timer">${timeLeft()}</b></div><div class="question">${state.examIndex+1}. ${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${sel===i?'correct':''}" onclick="pickExam(${i})">${o}</button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn secondary" onclick="moveExam(-1)">← Previous</button><button class="btn primary" onclick="${state.examIndex===state.exam.length-1?'submitExam()':'moveExam(1)'}">${state.examIndex===state.exam.length-1?'Submit Exam':'Next →'}</button></div><div class="exam-nav">${state.exam.map((_,i)=>`<button class="${state.examAnswers[i]!==undefined?'done':''}" onclick="state.examIndex=${i};render()">${i+1}</button>`).join('')}</div></div>`}
function pickExam(i){state.examAnswers[state.examIndex]=i;render()}function moveExam(d){state.examIndex=Math.max(0,Math.min(state.exam.length-1,state.examIndex+d));render()}function submitExam(){clearInterval(window.timer);let correct=0,by={};state.exam.forEach((q,i)=>{by[q.sessionId]??={c:0,t:0};by[q.sessionId].t++;if(state.examAnswers[i]===q.correct){correct++;by[q.sessionId].c++}});Object.entries(by).forEach(([id,v])=>store.mastery[id]=v.c/v.t);let pct=Math.round(correct/state.exam.length*100);store.attempts.push({date:new Date().toLocaleString(),score:pct,correct,total:state.exam.length});save();state.examResultData={pct,correct};state.view='examResult';render()}
function examResult(){let r=state.examResultData;return `<div class="panel" style="text-align:center"><div class="metric">${r.pct}%</div><h2>${r.pct>=70?'Passing performance':'More review recommended'}</h2><p>${r.correct} of ${state.exam.length} correct.</p><button class="btn primary" onclick="go('adaptive')">Review Weak Areas</button> <button class="btn secondary" onclick="exportCSV()">Export Results</button></div>`}
function adaptive(){let weak=sessions.slice().sort((a,b)=>(store.mastery[a.id]||0)-(store.mastery[b.id]||0)).slice(0,3);return `<div class="panel"><h2>Adaptive Review Plan</h2><p class="muted">Focus on the three lowest-scoring domains. Priority items from missed source questions appear inside their sessions.</p><div class="grid">${weak.map(s=>`<div class="card" onclick="openSession(${sessions.indexOf(s)})"><h3>${s.title}</h3><div class="metric">${Math.round((store.mastery[s.id]||0)*100)}%</div><p class="muted">Current mastery · ${s.items.filter(x=>x.missed).length} priority items</p></div>`).join('')}</div></div>`}
function flash(){let q=bank[state.flashIndex%bank.length];return `<div class="panel"><div class="row"><h2>Flashcards</h2><b>${state.flashIndex+1}/${bank.length}</b></div><div class="flash" onclick="state.flashBack=!state.flashBack;render()">${state.flashBack?`<div><div style="color:var(--teal)">${q.opts[q.correct]}</div><p class="muted" style="font-size:14px">${q.explain}</p></div>`:q.q}</div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="state.flashIndex=Math.max(0,state.flashIndex-1);state.flashBack=false;render()">←</button><button class="btn primary" onclick="state.flashIndex=(state.flashIndex+1)%bank.length;state.flashBack=false;render()">Next →</button></div></div>`}
const labData={task:{title:'Task Manager Simulator',tabs:['Processes','Performance','Startup','Users','Details','Services'],text:{Processes:'View running applications and resource use.',Performance:'Monitor CPU, memory, disk, network, and GPU performance.',Startup:'Enable or disable startup applications.',Users:'View signed-in users and their resource use.',Details:'Change process priority and inspect detailed process information.',Services:'View services and whether they are running or stopped.'}},registry:{title:'Registry Hive Explorer',tabs:['HKEY_CLASSES_ROOT','HKEY_CURRENT_USER','HKEY_LOCAL_MACHINE','HKEY_USERS','HKEY_CURRENT_CONFIG'],text:{HKEY_CLASSES_ROOT:'File associations and COM class registrations.',HKEY_CURRENT_USER:'Settings for the currently active user profile.',HKEY_LOCAL_MACHINE:'Computer-wide hardware and software settings.',HKEY_USERS:'Profiles for all loaded users.',HKEY_CURRENT_CONFIG:'Current hardware profile information.'}},event:{title:'Event Viewer Severity Lab',tabs:['Information','Warning','Error','Critical'],text:{Information:'A normal operation or successful event.',Warning:'A potential issue that may require attention.',Error:'A significant problem that affected an operation.',Critical:'A serious operating-system failure or crash.'}},device:{title:'Device Manager Actions',tabs:['Update Driver','Roll Back Driver','Disable Device','Uninstall Device','Properties'],text:{'Update Driver':'Search for or install a newer device driver.','Roll Back Driver':'Return to the previously installed driver.','Disable Device':'Stop Windows from using the device without removing it.','Uninstall Device':'Remove the device and its driver association.','Properties':'View status, driver, details, events, and resource information.'}}};
function labs(){let l=labData[state.lab];return `<div class="panel"><div class="row"><h2>Interactive Windows Labs</h2><select onchange="state.lab=this.value;render()"><option value="task" ${state.lab==='task'?'selected':''}>Task Manager</option><option value="registry" ${state.lab==='registry'?'selected':''}>Registry</option><option value="event" ${state.lab==='event'?'selected':''}>Event Viewer</option><option value="device" ${state.lab==='device'?'selected':''}>Device Manager</option></select></div><h3>${l.title}</h3><div class="lab-tabs">${l.tabs.map(t=>`<button class="btn secondary" onclick="document.getElementById('labText').innerHTML='<h3>${t.replaceAll("'","&#39;")}</h3><p>${l.text[t].replaceAll("'","&#39;")}</p>'">${t}</button>`).join('')}</div><div id="labText" class="lab-screen"><h3>Select an item</h3><p>Explore each tab or administrative action to reinforce the quiz concepts.</p></div></div>`}
const terms={EULA:'End User License Agreement that defines software-use restrictions.',Freeware:'Copyrighted software distributed without charge.',Shareware:'Software available to try before paying for full features.',Patch:'A small update that fixes bugs or security issues.',NTFS:'The default Windows internal-drive file system, with journaling and permissions.',Page:'A fixed-size block of a program in virtual memory.',Frame:'A fixed-size block of physical memory.',PageFault:'An interrupt that occurs when a requested page is not currently in memory.',Thread:'An execution path within a process that shares program code.',DocumentRoot:'The Apache directory that stores the website content.',Cookie:'Client-side data used to preserve state across HTTP requests.',Projection:'Selecting particular database columns.',Slicing:'Reducing an OLAP cube by selecting one value from a dimension.',Handle:'A process reference to a resource such as a file or registry key.',HKEY_CURRENT_USER:'Registry hive containing settings for the active user.'};
function glossary(){return `<div class="panel glossary"><h2>Searchable Glossary</h2><input placeholder="Search terms" oninput="filterGloss(this.value)"><div id="glist">${Object.entries(terms).map(([k,v])=>`<div class="card" data-term="${(k+' '+v).toLowerCase()}"><b>${k}</b><p>${v}</p></div>`).join('')}</div></div>`}function filterGloss(v){document.querySelectorAll('#glist .card').forEach(x=>x.style.display=x.dataset.term.includes(v.toLowerCase())?'block':'none')}function exportCSV(){let a=store.attempts.at(-1),csv=`Date,Score,Correct,Total
"${a.date}",${a.score},${a.correct},${a.total}`;let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='ITT103_V2_Exam_Result.csv';x.click();URL.revokeObjectURL(u)}
render();</script></body></html>
