  <g transform="translate(45)"><rect width="34" height="330" rx="6" fill="#2a8e9d" stroke="#76d2da" stroke-width="3"/><rect x="12" y="25" width="10" height="280" fill="#152029"/><rect x="8" y="155" width="18" height="14" fill="#eef5f7"/></g>
  <g transform="translate(90)"><rect width="34" height="330" rx="6" fill="url(#slot)" stroke="#8d9ba4" stroke-width="3"/><rect x="12" y="25" width="10" height="280" fill="#32414b"/><rect x="8" y="155" width="18" height="14" fill="#152029"/></g>
  <g transform="translate(135)"><rect width="34" height="330" rx="6" fill="#2a8e9d" stroke="#76d2da" stroke-width="3"/><rect x="12" y="25" width="10" height="280" fill="#152029"/><rect x="8" y="155" width="18" height="14" fill="#eef5f7"/></g>
</g>
<!-- 24 pin ATX -->
<g transform="translate(1040 520)"><rect width="74" height="160" rx="8" fill="#11181d" stroke="#83919a" stroke-width="3"/><g fill="#e8edf0"> 
<rect x="10" y="10" width="22" height="18"/><rect x="40" y="10" width="22" height="18"/><rect x="10" y="34" width="22" height="18"/><rect x="40" y="34" width="22" height="18"/><rect x="10" y="58" width="22" height="18"/><rect x="40" y="58" width="22" height="18"/><rect x="10" y="82" width="22" height="18"/><rect x="40" y="82" width="22" height="18"/><rect x="10" y="106" width="22" height="18"/><rect x="40" y="106" width="22" height="18"/><rect x="10" y="130" width="22" height="18"/><rect x="40" y="130" width="22" height="18"/>
</g></g>
