<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Modern educational ATX motherboard</title>
<desc id="desc">A clean top-down vector motherboard illustration showing CPU socket, memory slots, expansion slots, chipset heatsinks, power connectors, storage connectors, headers, CMOS battery, and rear I/O.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2f7"/><stop offset="1" stop-color="#dfe7ef"/></linearGradient>
  <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17232d"/><stop offset="1" stop-color="#0b141b"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset=".5" stop-color="#aebbc7"/><stop offset="1" stop-color="#6d7d8b"/></linearGradient>
  <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2aa0ae"/><stop offset="1" stop-color="#14515d"/></linearGradient>
  <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9fafb"/><stop offset="1" stop-color="#cfd7df"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1520" flood-opacity=".25"/></filter>
  <pattern id="traces" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M0 22h16l6-6h23M22 45V30l7-7V0" fill="none" stroke="#2b5660" stroke-width="2" opacity=".35"/></pattern>
</defs>
<rect width="1200" height="820" fill="url(#bg)"/>
<rect x="55" y="45" width="1090" height="720" rx="28" fill="url(#pcb)" filter="url(#shadow)"/>
<rect x="55" y="45" width="1090" height="720" rx="28" fill="url(#traces)"/>
<!-- screw holes -->
<g fill="#d9e3eb" stroke="#61727f" stroke-width="5">
<circle cx="82" cy="72" r="10"/><circle cx="1118" cy="72" r="10"/><circle cx="82" cy="738" r="10"/><circle cx="1118" cy="738" r="10"/><circle cx="585" cy="72" r="9"/><circle cx="585" cy="738" r="9"/>
</g>
<!-- rear I/O block -->
<g transform="translate(75 125)">
  <rect width="130" height="400" rx="12" fill="#263742" stroke="#718492" stroke-width="4"/>
  <rect x="16" y="18" width="98" height="50" rx="8" fill="url(#metal)"/><rect x="16" y="82" width="98" height="44" rx="8" fill="#286a8a"/>
  <g fill="#111b23"><rect x="28" y="92" width="31" height="24" rx="3"/><rect x="70" y="92" width="31" height="24" rx="3"/></g>
  <rect x="16" y="142" width="98" height="58" rx="8" fill="url(#metal)"/><rect x="28" y="154" width="74" height="34" rx="4" fill="#172a34"/>
  <rect x="16" y="214" width="98" height="44" rx="8" fill="#238d9c"/><g fill="#101a20"><rect x="29" y="225" width="30" height="22" rx="3"/><rect x="70" y="225" width="30" height="22" rx="3"/></g>
  <rect x="16" y="273" width="98" height="48" rx="8" fill="url(#metal)"/><rect x="31" y="284" width="68" height="25" rx="4" fill="#202a30"/>
  <g><circle cx="39" cy="354" r="12" fill="#6ecb68"/><circle cx="65" cy="354" r="12" fill="#69a9e6"/><circle cx="91" cy="354" r="12" fill="#e86a81"/></g>
</g>
<!-- CPU power -->
<g transform="translate(845 72)"><rect width="170" height="52" rx="8" fill="#151b20" stroke="#73818b" stroke-width="3"/><g fill="#ecf1f4"> <rect x="10" y="11" width="30" height="30" rx="3"/><rect x="50" y="11" width="30" height="30" rx="3"/><rect x="90" y="11" width="30" height="30" rx="3"/><rect x="130" y="11" width="30" height="30" rx="3"/></g></g>
