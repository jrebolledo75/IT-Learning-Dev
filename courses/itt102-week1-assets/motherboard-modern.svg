  <rect x="24" y="24" width="197" height="197" rx="12" fill="#cbd5dc" stroke="#778793" stroke-width="5"/>
  <rect x="48" y="48" width="149" height="149" rx="8" fill="#ebeff2" stroke="#8997a1" stroke-width="3"/>
  <g stroke="#a6b1b8" stroke-width="2" opacity=".8"><path d="M65 55v135M85 55v135M105 55v135M125 55v135M145 55v135M165 55v135M185 55v135"/><path d="M55 65h135M55 85h135M55 105h135M55 125h135M55 145h135M55 165h135M55 185h135"/></g>
