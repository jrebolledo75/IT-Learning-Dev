<!-- M2 slots decorative -->
<g transform="translate(380 505)"><rect width="280" height="24" rx="5" fill="#18272f" stroke="#537580" stroke-width="3"/><circle cx="255" cy="12" r="5" fill="#d4c062"/><rect x="12" y="7" width="36" height="10" fill="#e9ddac"/></g>
