<g transform="translate(610 545)"><circle r="52" fill="url(#metal)" stroke="#ecf2f5" stroke-width="5"/><circle r="36" fill="#c5d0d8" stroke="#7a8994" stroke-width="3"/><path d="M-18 0h36M0-18v36" stroke="#83919a" stroke-width="4"/></g>
