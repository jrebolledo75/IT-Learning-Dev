<g transform="translate(350 360)"><rect width="170" height="30" rx="8" fill="#e7edf1" stroke="#8d9aa3" stroke-width="3"/><rect x="18" y="9" width="118" height="12" fill="#293741"/><rect x="144" y="3" width="12" height="24" fill="#293741"/></g>
