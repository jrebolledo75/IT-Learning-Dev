<g transform="translate(310 440)"><rect width="470" height="38" rx="8" fill="#238e9d" stroke="#77d6dd" stroke-width="4"/><rect x="18" y="11" width="390" height="16" fill="#17232c"/><rect x="420" y="4" width="18" height="30" fill="#f0f4f6"/><rect x="446" y="6" width="18" height="26" fill="#17232c"/></g>
