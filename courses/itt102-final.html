const bank=sessions.flatMap(s=>s.items.filter(x=>x.type==='mc').map(x=>({...x,domain:s.title,sessionId:s.id})));
let store=JSON.parse(localStorage.getItem('itt102v2')||'{"attempts":[],"mastery":{},"bookmarks":[],"notes":{},"dark":false}');if(store.dark)document.body.classList.add('dark');
let state={view:'dashboard',session:null,index:0,answered:false,selected:null,score:0,total:0,exam:[],examAnswers:{},examIndex:0,examStart:0,flashIndex:0,flashBack:false};
const save=()=>localStorage.setItem('itt102v2',JSON.stringify(store));const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function header(){return `<div class="top"><div class="brand"><img src="${NCC}"><img class="tech" src="${TECH}"><div class="title"><h1>ITT102 Final Exam Mastery Review 2.0</h1><p>Official final-exam concepts, adaptive practice, flashcards, and exam simulation.</p></div></div><button class="btn secondary" onclick="toggleDark()">${document.body.classList.contains('dark')?'Light':'Dark'} Mode</button></div><div class="nav">${[['dashboard','Dashboard'],['sessions','Study Sessions'],['examSetup','Exam Simulator'],['adaptive','Adaptive Review'],['flash','Flashcards'],['glossary','Glossary']].map(x=>`<button class="btn ${state.view===x[0]?'active secondary':'secondary'}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function render(){let h=header();if(state.view==='dashboard')h+=dashboard();if(state.view==='sessions')h+=sessionList();if(state.view==='study')h+=study();if(state.view==='examSetup')h+=examSetup();if(state.view==='exam')h+=exam();if(state.view==='examResult')h+=examResult();if(state.view==='adaptive')h+=adaptive();if(state.view==='flash')h+=flash();if(state.view==='glossary')h+=glossary();document.getElementById('app').innerHTML=h+'<div class="footer">Progress is stored locally in this browser.</div>'}
function go(v){state.view=v;state.answered=false;render()}function toggleDark(){document.body.classList.toggle('dark');store.dark=document.body.classList.contains('dark');save();render()}
function dashboard(){const attempts=store.attempts.length,last=attempts?store.attempts.at(-1):null;const mastered=Object.values(store.mastery).filter(x=>x>=.8).length;return `<div class="grid"><div class="panel"><div class="metric">${bank.length}</div><b>Official & course-aligned questions</b><p class="muted">Includes AI, cloud, architecture, networking, and remediation.</p></div><div class="panel"><div class="metric">${attempts}</div><b>Exam attempts</b><p class="muted">${last?'Latest score: '+last.score+'%':'No simulated exam completed yet.'}</p></div><div class="panel"><div class="metric">${mastered}</div><b>Mastered domains</b><p class="muted">Domains reaching at least 80% accuracy.</p></div></div><div class="panel" style="margin-top:14px"><h2>Recommended next step</h2><p>${weakestText()}</p><button class="btn primary" onclick="go('adaptive')">Start Adaptive Review</button></div>`}
function weakestText(){const arr=sessions.map(s=>[s.title,store.mastery[s.id]??0]).sort((a,b)=>a[1]-b[1]);return arr[0][1]===0?'Begin with AI & Cloud Computing, then continue through the sessions in order.':`Your lowest current mastery is <b>${arr[0][0]}</b> at ${Math.round(arr[0][1]*100)}%.`}
function sessionList(){return `<div class="grid">${sessions.map((s,i)=>`<div class="card" onclick="openSession(${i})"><div class="row"><b>Session ${i+1}</b>${s.hot?'<span class="tag">Priority</span>':''}</div><h3>${s.title}</h3><p class="muted">${s.blurb}</p><div class="bar"><span style="width:${Math.round((store.mastery[s.id]||0)*100)}%"></span></div></div>`).join('')}</div>`}
function openSession(i){state.session=i;state.index=0;state.score=0;state.total=0;state.view='study';state.answered=false;render()}
function study(){const s=sessions[state.session],q=s.items[state.index];if(!q)return '';return `<div class="panel"><div class="row"><div><span class="tag">${q.kicker||'Study'}</span><h2>${s.title}</h2></div><b>${state.index+1}/${s.items.length}</b></div><div class="bar"><span style="width:${(state.index/s.items.length)*100}%"></span></div><div class="question">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${state.answered?(i===q.correct?'correct':i===state.selected?'wrong':''):''}" ${state.answered?'disabled':''} onclick="answerStudy(${i})">${o}</button>`).join('')}</div>${state.answered?`<div class="explain"><b>${state.selected===q.correct?'Correct.':'Review:'}</b> ${q.explain}</div><div style="margin-top:14px;text-align:right"><button class="btn primary" onclick="nextStudy()">${state.index===s.items.length-1?'Finish':'Next'} →</button></div>`:''}</div>`}
function answerStudy(i){if(state.answered)return;state.answered=true;state.selected=i;state.total++;if(i===sessions[state.session].items[state.index].correct)state.score++;render()}
function nextStudy(){const s=sessions[state.session];if(state.index<s.items.length-1){state.index++;state.answered=false;state.selected=null;render()}else{store.mastery[s.id]=state.total?state.score/state.total:0;save();state.view='sessions';render()}}
function examSetup(){return `<div class="panel"><h2>Final Exam Simulator</h2><p class="muted">Randomized questions with a 60-minute timer. Answers are revealed only after submission.</p><label>Number of questions <select id="count"><option>25</option><option>50</option><option selected>75</option></select></label> <button class="btn primary" onclick="startExam()">Start Exam</button></div>`}
function startExam(){const n=+document.getElementById('count').value;state.exam=shuffle(bank).slice(0,Math.min(n,bank.length));state.examAnswers={};state.examIndex=0;state.examStart=Date.now();state.view='exam';render();timer=setInterval(()=>{const t=document.getElementById('timer');if(t)t.textContent=timeLeft()()},1000)}
function timeLeft(){const left=Math.max(0,3600-Math.floor((Date.now()-state.examStart)/1000));return `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}
function exam(){const q=state.exam[state.examIndex],sel=state.examAnswers[state.examIndex];return `<div class="panel"><div class="row"><b>${q.domain}</b><b id="timer">${timeLeft()}</b></div><div class="question">${state.examIndex+1}. ${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${sel===i?'correct':''}" onclick="pickExam(${i})">${o}</button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn secondary" onclick="moveExam(-1)">← Previous</button><button class="btn primary" onclick="${state.examIndex===state.exam.length-1?'submitExam()':'moveExam(1)'}">${state.examIndex===state.exam.length-1?'Submit Exam':'Next →'}</button></div><div class="exam-nav">${state.exam.map((_,i)=>`<button class="${state.examAnswers[i]!==undefined?'done':''}" onclick="state.examIndex=${i};render()">${i+1}</button>`).join('')}</div></div>`}
function pickExam(i){state.examAnswers[state.examIndex]=i;render()}function moveExam(d){state.examIndex=Math.max(0,Math.min(state.exam.length-1,state.examIndex+d));render()}
function submitExam(){let correct=0,by={};state.exam.forEach((q,i)=>{by[q.sessionId]??={c:0,t:0};by[q.sessionId].t++;if(state.examAnswers[i]===q.correct){correct++;by[q.sessionId].c++}});Object.entries(by).forEach(([id,v])=>store.mastery[id]=v.c/v.t);const pct=Math.round(correct/state.exam.length*100);store.attempts.push({date:new Date().toLocaleString(),score:pct,correct,total:state.exam.length});save();state.examResultData={pct,correct};state.view='examResult';render()}
function examResult(){const r=state.examResultData;return `<div class="panel" style="text-align:center"><div class="metric">${r.pct}%</div><h2>${r.pct>=70?'Passing performance':'More review recommended'}</h2><p>${r.correct} of ${state.exam.length} correct.</p><button class="btn primary" onclick="go('adaptive')">Review Weak Areas</button> <button class="btn secondary" onclick="exportCSV()">Export Results</button></div>`}
function adaptive(){const weak=sessions.slice().sort((a,b)=>(store.mastery[a.id]||0)-(store.mastery[b.id]||0)).slice(0,3);return `<div class="panel"><h2>Adaptive Review Plan</h2><p class="muted">Focus on your three lowest-scoring domains.</p><div class="grid">${weak.map(s=>`<div class="card" onclick="openSession(${sessions.indexOf(s)})"><h3>${s.title}</h3><div class="metric">${Math.round((store.mastery[s.id]||0)*100)}%</div><p class="muted">Current mastery</p></div>`).join('')}</div></div>`}
function flash(){const q=bank[state.flashIndex%bank.length];return `<div class="panel"><div class="row"><h2>Flashcards</h2><b>${state.flashIndex+1}/${bank.length}</b></div><div class="flash" onclick="state.flashBack=!state.flashBack;render()">${state.flashBack?`<div><div style="color:var(--teal)">${q.opts[q.correct]}</div><p class="muted" style="font-size:14px">${q.explain}</p></div>`:q.q}</div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="state.flashIndex=Math.max(0,state.flashIndex-1);state.flashBack=false;render()">←</button><button class="btn primary" onclick="state.flashIndex=(state.flashIndex+1)%bank.length;state.flashBack=false;render()">Next →</button></div></div>`}
const terms={AIaaS:'Artificial Intelligence as a Service: cloud-delivered AI capabilities.',FinOps:'A collaborative practice for managing and optimizing cloud costs.',DevSecOps:'Integration of security into development and operations.',Kubernetes:'A platform for orchestrating containerized applications.',Docker:'A platform for packaging applications in containers.',Cache:'Fast memory located close to the CPU.',ALU:'The CPU component that performs arithmetic and logical operations.',TCP:'A reliable, connection-oriented transport protocol.',DNS:'The service that translates domain names into IP addresses.',NAT:'Translation between internal and external IP addresses.',Edge:'Computing performed close to devices or sensors.'};
function glossary(){return `<div class="panel glossary"><h2>Searchable Glossary</h2><input placeholder="Search terms" oninput="filterGloss(this.value)"><div id="glist">${Object.entries(terms).map(([k,v])=>`<div class="card" data-term="${(k+' '+v).toLowerCase()}"><b>${k}</b><p>${v}</p></div>`).join('')}</div></div>`}function filterGloss(v){document.querySelectorAll('#glist .card').forEach(x=>x.style.display=x.dataset.term.includes(v.toLowerCase())?'block':'none')}
function exportCSV(){const a=store.attempts.at(-1);const csv=`Date,Score,Correct,Total\n"${a.date}",${a.score},${a.correct},${a.total}`;const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='ITT102_V2_Exam_Result.csv';x.click();URL.revokeObjectURL(u)}
render();
</script></body></html>
