<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT102 Week 1 Interactive Review</title><style>
:root{--bg:#f6f4fa;--card:#fff;--soft:#f0ecf7;--line:#ded7eb;--ink:#171130;--muted:#716988;--purple:#4b3670;--teal:#0e8998;--orange:#f2720f;--green:#1d8c5b;--red:#c23b45;--shadow:0 12px 35px #281b4514}body.dark{--bg:#15111d;--card:#211a2b;--soft:#2b2337;--line:#403451;--ink:#f6f1ff;--muted:#b8adc8;--purple:#9479c2;--teal:#46c2cb;--orange:#ff9d52;--shadow:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif}.app{max-width:1240px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:17px 20px;border-radius:16px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:13px}.brand img{height:36px;object-fit:contain}.brand .itt{height:31px}.brand h1{font-size:27px;margin:0}.brand p{margin:4px 0 0;color:var(--muted)}button{font:inherit}.btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:750;cursor:pointer}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav .active{background:var(--teal);color:white;border-color:var(--teal)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.6fr .8fr;gap:14px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--teal)}h2{margin:.35rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:16px}.metric{font-size:32px;font-weight:900;color:var(--teal)}.muted{color:var(--muted)}.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--purple),var(--teal))}.lesson details{border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--soft);margin:9px 0}.lesson summary{cursor:pointer;font-weight:800}.lab-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1fr);gap:16px}.image-stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;min-height:400px}.image-stage img{width:100%;height:auto;display:block}.drop{position:absolute;border:2px dashed var(--orange);background:#fff9;color:#281b45;border-radius:7px;min-width:36px;min-height:28px;display:grid;place-items:center;font-size:11px;font-weight:900;transform:translate(-50%,-50%)}.drop.ok{background:#dff7e8;border-color:var(--green)}.drop.bad{animation:shake .25s}.tokens{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}.token{padding:9px 11px;border:1px solid var(--line);background:var(--soft);border-radius:8px;cursor:grab;font-weight:700}.token.used{opacity:.35;pointer-events:none}.feedback{margin-top:12px;border-left:4px solid var(--teal);padding:12px;background:var(--soft);border-radius:8px}.storage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.storage-card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.storage-card img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:8px}.storage-card select{width:100%;padding:8px;margin-top:8px}.q{font-size:20px;font-weight:800;line-height:1.45;margin:16px 0}.opts{display:grid;gap:9px}.opt{text-align:left;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);cursor:pointer}.opt.correct{border-color:var(--green);background:#def4e8;color:#183b2b}.opt.wrong{border-color:var(--red);background:#fae1e4;color:#5a1720}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{padding:4px 9px;background:#fde8d7;color:#a14a08;border-radius:999px;font-size:12px;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}@keyframes shake{25%{transform:translate(-54%,-50%)}75%{transform:translate(-46%,-50%)}}@media(max-width:760px){.hero,.lab-layout{grid-template-columns:1fr}.brand h1{font-size:21px}.app{padding:10px}.drop{min-width:31px}}
</style></head><body><div class="app" id="app"></div><script>
const NCC='../assets/ncc-logo.png',ITT='../assets/itt-logo.png',A='itt102-week1-assets/';
const quiz=[["A branch-and-link instruction which branches to the operating system is known as a(n)", ["Jump", "Trap", "Return", "Interrupt", "Privileged jump"], 1, "A trap transfers control to operating-system code and changes the processor into privileged mode."], ["A processor with a longer pipeline will generally have a ______ system clock when compared to a processor with a shorter pipeline.", ["Slower", "Faster"], 1, "More, shorter stages can support a faster clock, although pipeline hazards still affect performance."], ["In order to compare processor performances, architects will test the processors on", ["Integer programs only", "A benchmark suite of programs", "A single program", "Floating point programs only", "An unloaded system"], 1, "A benchmark suite samples several workloads and gives a more meaningful comparison."], ["If an item is being sought in the L1 cache and not found, the time it takes to retrieve it from the remainder of the memory hierarchy is known as the", ["Miss penalty", "Virtual access time", "Random access time", "Access time", "Effective access time"], 0, "The miss penalty is the added time required after a cache miss."], ["The default is that the next instruction to be fetched will be the ______ instruction in the program.", ["Last", "Next sequential", "Current", "Previous"], 1, "The program counter normally advances to the next sequential instruction unless a branch changes it."], ["The result of a branch instruction impacts", ["Program counter", "Memory", "Could be any of these", "Data registers", "Instruction register"], 0, "A branch changes the program counter so fetching continues at another address."], ["Which of these instructions is a placeholder instruction which does nothing?", ["None of these, every instruction does something", "Halt", "Clear", "No-op", "Jump"], 1, "Course-key answer: Halt. This item is marked for priority review because the chapter text also discusses a no-op as an instruction whose execution does nothing."], ["Which computer is considered the first electronic, general-purpose computer?", ["Apple I", "IBM PC", "ENIAC", "Analytical Engine", "Turing\u2019s code breaking computer"], 2, "ENIAC is identified in the course material as the first electronic, general-purpose computer."], ["Arrays in a program promote which type of locality of reference?", ["Incremental", "Temporal", "Sequential", "Spatial", "Array"], 3, "Array elements occupy neighboring memory locations, promoting spatial locality."], ["Which technology was used during the first generation of computers?", ["Microprocessors", "Transistors", "Vacuum tubes", "Integrated circuits", "Magnetic core memory"], 2, "First-generation computers used vacuum tubes."], ["While executing, a program is placed where?", ["Chip", "Memory", "Instruction", "All of the above", "Address", "Value"], 1, "Executable instructions and data are loaded into memory for CPU access."], ["Which addressing mode utilizes a pointer to the datum?", ["Register", "Indirect", "Direct", "Immediate", "All of these"], 1, "Indirect addressing references the address of a pointer to the datum."], ["The high-level instruction if x > 0 then y = 1 requires", ["A conditional branch to the then clause and an unconditional branch around it", "A conditional branch to branch around the then clause", "A conditional branch to the then clause", "An unconditional branch to skip the then clause", "An unconditional branch to skip the instruction after the then clause"], 1, "The condition can branch around the then clause when it is false."], ["Which architectural technique provides multiple, parallel pipelines?", ["Instruction prefetching", "GPU", "Superpipeline", "Superscalar", "Compiler scheduling"], 3, "A superscalar processor includes multiple pipelines so more than one instruction can advance in parallel."], ["Which component of the CPU controls when each step of the fetch-execute cycle takes place?", ["Control unit", "Control bus", "System clock", "Status flags", "Arithmetic-logic unit"], 0, "Course-key answer: Control unit. The control unit manages the cycle; clock pulses regulate stage timing."], ["Who is considered the world\u2019s first programmer?", ["Blaise Pascal", "Charles Babbage", "John Napier", "Ada Lovelace", "Joseph Marie Jacquard"], 3, "Ada Lovelace wrote an algorithm intended for Babbage\u2019s Analytical Engine."], ["Pentium and iCore processors fall into which processor type?", ["RISC", "CISC"], 1, "Intel x86-family processors are categorized as CISC in the course material."], ["The minicomputer was introduced in which generation?", ["Before the first", "4th", "3rd", "1st", "2nd"], 2, "The quiz identifies minicomputers with the third generation."], ["Interrupt requests from devices back to the CPU are carried over which bus?", ["Interrupt", "Local", "Address", "Control", "Data"], 3, "The control bus carries control signals and device status or interrupt requests."], ["Load R1, 500(R2) loads into R1", ["The value stored at memory location 500 + R2", "The value 500", "The value resulting from 500 + R2", "The value stored in R2", "The value stored at memory location 500"], 0, "Base-displacement addressing adds the displacement 500 to the address in R2, then loads the value stored there."], ["When a datum is referenced by a pointer, which addressing mode is used?", ["Register", "Indirect", "Register Indirect", "Could be either Indirect or Register Indirect", "Direct"], 3, "A pointer may be kept in memory or in a register, producing indirect or register-indirect addressing."], ["Miniaturization refers to", ["The world getting smaller through Internet communication", "Lower cost each generation", "Smaller circuitry on a chip allowing more circuits every year or two", "None of these", "Computers becoming smaller each generation"], 2, "Miniaturization describes shrinking circuitry so more circuits fit on a chip."], ["Which architectural technique can help avoid pipeline stalls?", ["Compiler scheduling", "Superpipelining", "Superscalar pipelining", "Branch speculation", "All of the above"], 0, "Course-key answer: Compiler scheduling. It rearranges independent instructions to reduce hazards."], ["In which decade were RISC processors first produced?", ["1980s", "1990s", "2010s", "2000s", "1970s"], 0, "The course quiz places early RISC production in the 1980s."], ["What does Load A, Add #1, Store A do?", ["Stores the accumulator in A", "Stores A+1 in B", "Stores the value of A plus 1 back into A", "Moves 1 into A", "Places A into the accumulator only"], 2, "The sequence loads A, increments it by one, then stores the result back in A."], ["The observation that transistor counts on a chip increase dramatically every couple of years is", ["Law of Diminishing Return", "Moore\u2019s Law", "Theory of Computation", "Locality of reference", "FIFO"], 1, "Moore\u2019s Law describes the historical growth in transistor density."], ["Signals such as memory read, ready?, and output travel over the", ["Could be any", "Address bus", "Local bus", "Control bus", "Data bus"], 3, "Commands and status signals use the control bus."], ["Which bus is unidirectional?", ["All three", "Data", "Both address and control", "Control", "Address"], 4, "Addresses originate in the CPU and travel outward, so the address bus is unidirectional."], ["Early computational devices from the 1600s through the 1800s operated by", ["Switches", "Pendulums", "Rotating gears", "Water flowing", "Strings"], 2, "Mechanical calculators used gears."], ["If a processor has a single data register, it is usually called the", ["Register", "Accumulator", "Program Counter", "Instruction Register", "Data Register"], 1, "The accumulator is the implied register in accumulator-based processors."]];
const lessons=[
['Computer organization','CPU, memory, input/output, and the bus form the core computer system. Programs and their data are loaded into memory so the CPU can process them.'],
['CPU components','The control unit manages the fetch-execute cycle, the ALU performs arithmetic and logic, and registers provide very fast short-term storage.'],
['Fetch-execute cycle','Fetch the instruction, decode it, fetch operands, execute it, and store the result when needed. The program counter tracks the next instruction and the instruction register holds the current one.'],
['Buses','The address bus carries addresses and is unidirectional. The data bus carries instructions and data in both directions. The control bus carries commands, status, and interrupts.'],
['Memory hierarchy','Registers and cache are fastest and smallest, DRAM is larger and slower, and virtual memory uses storage as an extension of main memory. A hit finds an item at a level; a miss adds a miss penalty.'],
['Locality and cache','Sequential locality follows nearby instructions, temporal locality reuses items, and spatial locality accesses neighboring addresses such as array elements.'],
['Pipelining','An instruction-level pipeline overlaps fetch-execute stages. Superscalar design provides multiple parallel pipelines, while compiler scheduling can reduce stalls.'],
['Computer evolution','The chapter moves from mechanical devices and vacuum-tube computers through transistors, integrated circuits, microprocessors, RISC/CISC, multicore systems, and miniaturization.']];
const mobo=[['cpu','CPU / Heatsink'],['memory','Memory (DIMM Slots)'],['gpu','Video Card'],['m2','M.2 Socket'],['pciex16','PCI Express x16'],['cmos','CMOS Battery'],['atx','ATX Power Connector'],['sata','SATA Connectors'],['pch','Platform Controller Hub'],['pcie','PCIe Slot'],['io','Back I/O Panel']];
const mpos={cpu:[51,29],memory:[75,30],gpu:[38,56],m2:[42,48],pciex16:[39,77],cmos:[50,68],atx:[86,37],sata:[91,64],pch:[71,65],pcie:[31,55],io:[8,24]};
const rear=[['PSU',52,15],['Fan Vent',71,45],['MB Video',28,45],['USB 2.0',19,37],['USB 3',20,60],['NIC',31,65],['MB Audio',22,75],['GPU',39,88],['Audio Card',34,95]];
const storage=[['image2.png','Mini SD Card'],['image1.png','M.2 NVMe'],['image3.png','PCIe SSD'],['image6.png','SD Card'],['image4.png','MicroSD Card'],['image5.png','2.5-inch SSD'],['image7.png','3.5-inch HDD']];
let store=JSON.parse(localStorage.getItem('ncc_itt102_w1')||'{"view":"home","quizCorrect":0,"quizDone":0,"labs":{}}');let qi=0,answered=false;
function save(){localStorage.setItem('ncc_itt102_w1',JSON.stringify(store))}function go(v){store.view=v;save();render()}function header(){return `<header class="top"><div class="brand"><img src="${NCC}"><img class="itt" src="${ITT}"><div><h1>ITT102 Week 1 Interactive Review</h1><p>CPU, memory, motherboard, rear panel, storage devices, and Chapter 2 mastery.</p></div></div><button class="btn" onclick="document.body.classList.toggle('dark')">◐ Theme</button></header><nav class="nav">${[['home','Dashboard'],['learn','Learn'],['mobo','Motherboard Lab'],['rear','Rear Panel'],['storage','Storage'],['mission','Mission Ready'],['quiz','Adaptive Quiz']].map(x=>`<button class="btn ${store.view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}
function home(){let pct=store.quizDone?Math.round(store.quizCorrect/store.quizDone*100):0;return `<section class="hero"><div class="panel"><div class="eyebrow">WEEK 1 · CHAPTER 2</div><h2>Build understanding before the final exam.</h2><p>This experience combines the assigned CPU and memory chapter, the official Chapter 2 quiz, the motherboard worksheet, the rear-panel activity, and the storage-device activity.</p><button class="btn primary" onclick="go('learn')">Begin Week 1 Review</button></div><div class="panel"><div class="metric">${pct}%</div><b>Current quiz accuracy</b><p class="muted">${store.quizDone} official questions attempted.</p><div class="progress"><span style="width:${pct}%"></span></div></div></section><section class="grid" style="margin-top:14px">${[['8','Concept lessons'],['11','Motherboard labels'],['9','Rear-panel targets'],['7','Storage devices'],['30','Official quiz questions']].map(x=>`<div class="card"><div class="metric">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</section>`}
function learn(){return `<div class="panel lesson"><div class="eyebrow">CONCEPT REVIEW</div><h2>Chapter 2 in focused sections</h2><p class="muted">Open each section, read the explanation, and connect it to the lab activities.</p>${lessons.map((x,i)=>`<details><summary>${i+1}. ${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div>`}
function lab(title,img,zones,items){return `<div class="panel"><div class="row"><div><div class="eyebrow">DRAG OR TAP TO MATCH</div><h2>${title}</h2></div><button class="btn" onclick="render()">Reset view</button></div><div class="lab-layout"><div class="image-stage"><img src="${A+img}">${zones.map(z=>`<div class="drop" data-answer="${z[0]}" style="left:${z[1]}%;top:${z[2]}%" onclick="dropSelected(this)">${z[0].length<=2?z[0]:'?'}</div>`).join('')}</div><div><p class="muted">Drag a label to the matching target. On touch devices, tap a label and then tap a target.</p><div class="tokens">${items.map(x=>`<button class="token" draggable="true" data-value="${x[0]}" onclick="selectToken(this)" ondragstart="event.dataTransfer.setData('text/plain',this.dataset.value)">${x[1]}</button>`).join('')}</div><div id="labFeedback" class="feedback">Choose a label to begin.</div></div></div></div>`}
function moboLab(){return lab('ASUS Z97 Virtual Motherboard Lab','motherboard-asus-z97.png',mobo.map(x=>[x[0],...mpos[x[0]]]),mobo)}
function rearLab(){return lab('Desktop Rear Panel Connectors','rear-panel.png',rear.map(x=>[x[0],x[1],x[2]]),rear.map(x=>[x[0],x[0]]))}
let selected=null;function selectToken(el){selected=el.dataset.value;document.querySelectorAll('.token').forEach(x=>x.style.outline='');el.style.outline='3px solid var(--orange)'}function dropSelected(zone){if(!selected)return;checkDrop(zone,selected)}
function checkDrop(zone,val){let f=document.getElementById('labFeedback');if(zone.dataset.answer===val){zone.classList.add('ok');zone.textContent='✓';document.querySelector(`.token[data-value="${CSS.escape(val)}"]`)?.classList.add('used');f.innerHTML='<b>Correct.</b> The component is matched to its location.';selected=null}else{zone.classList.add('bad');setTimeout(()=>zone.classList.remove('bad'),300);f.innerHTML='<b>Try again.</b> Compare the component function and physical connector shape.'}}
document.addEventListener('dragover',e=>{if(e.target.classList.contains('drop'))e.preventDefault()});document.addEventListener('drop',e=>{if(e.target.classList.contains('drop')){e.preventDefault();checkDrop(e.target,e.dataTransfer.getData('text/plain'))}});
function storageLab(){let opts=['Select device',...storage.map(x=>x[1])];return `<div class="panel"><div class="eyebrow">IMAGE IDENTIFICATION</div><h2>Internal & External Storage Devices</h2><p class="muted">Identify every device, then check your work.</p><div class="storage-grid">${storage.map((x,i)=>`<div class="storage-card"><img src="${A+x[0]}"><select data-answer="${x[1]}">${opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}</div><div class="row" style="margin-top:14px"><div id="storageFeedback" class="muted">Seven devices are included.</div><button class="btn teal" onclick="checkStorage()">Check Answers</button></div></div>`}
function checkStorage(){let c=0;document.querySelectorAll('.storage-card select').forEach(s=>{let ok=s.value===s.dataset.answer;s.style.borderColor=ok?'var(--green)':'var(--red)';if(ok)c++});document.getElementById('storageFeedback').innerHTML=`<b>${c}/7 correct.</b> Review form factor and connector type for missed devices.`;store.labs.storage=c;save()}
function quizView(){let q=quiz[qi];return `<div class="panel"><div class="row"><div><span class="badge">Official Chapter 2 Quiz</span><h2>Question ${qi+1} of ${quiz.length}</h2></div><b>${store.quizCorrect}/${store.quizDone} correct</b></div><div class="progress"><span style="width:${(qi/quiz.length)*100}%"></span></div><div class="q">${q[0]}</div><div class="opts">${q[1].map((o,i)=>`<button class="opt" onclick="answer(${i},this)">${o}</button>`).join('')}</div><div id="explain"></div></div>`}
function answer(i,el){if(answered)return;answered=true;let q=quiz[qi],ok=i===q[2];store.quizDone++;if(ok)store.quizCorrect++;save();document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add('correct');else if(j===i)x.classList.add('wrong')});document.getElementById('explain').innerHTML=`<div class="feedback"><b>${ok?'Correct.':'Review this concept.'}</b> ${q[3]}</div><div style="text-align:right;margin-top:12px"><button class="btn primary" onclick="nextQ()">${qi===quiz.length-1?'Finish':'Next'} →</button></div>`}
function nextQ(){answered=false;if(qi<quiz.length-1)qi++;else qi=0;render()}

function missionReady(){return `<div class="panel" style="padding:0;overflow:hidden"><div style="padding:18px 20px;border-bottom:1px solid var(--line)"><div class="eyebrow">MISSION READY™ · PAIR ACTIVITY</div><h2>Six-Step Troubleshooting Lab</h2><p class="muted">Work in pairs, assign technician roles, complete all six troubleshooting steps, save your work, and print or save the completed report as a PDF.</p></div><iframe title="Mission Ready Pair Troubleshooting Activity" src="itt102-week1-mission-ready.html" style="width:100%;height:76vh;min-height:720px;border:0;background:white"></iframe></div>`}
function render(){let body=store.view==='home'?home():store.view==='learn'?learn():store.view==='mobo'?moboLab():store.view==='rear'?rearLab():store.view==='storage'?storageLab():store.view==='mission'?missionReady():quizView();document.getElementById('app').innerHTML=header()+body+'<div class="footer">NCC IT Learning Hub Professional Edition · Week 1 progress is stored locally in this browser.</div>'}
render();
</script></body></html>
