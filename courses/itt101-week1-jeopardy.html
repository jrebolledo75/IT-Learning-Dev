<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT101 Week 1 Jeopardy</title><style>
:root{--navy:#111942;--purple:#4b3670;--teal:#0f8fa1;--gold:#f4b73b;--bg:#f5f3f9;--ink:#182033;--line:#ddd6e8;--ok:#15815a;--bad:#b83b34}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:1400px;margin:auto;padding:16px}header{display:flex;align-items:center;gap:14px;background:white;border:1px solid var(--line);border-radius:16px;padding:16px}header img{object-fit:contain}header .ncc{width:34px;height:44px}header .itt{width:34px;height:34px}h1{margin:0;color:var(--navy)}header p{margin:4px 0 0;color:#685d78}.toolbar,.teams{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:var(--purple);color:#fff;font-weight:800;cursor:pointer}button.alt{background:#fff;color:var(--purple);border:1px solid var(--purple)}button.gold{background:var(--gold);color:#1f1a0b}button.teal{background:var(--teal)}.team{background:white;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:7px;align-items:center}.team input{width:120px;border:1px solid var(--line);border-radius:7px;padding:7px}.score{font-size:1.25rem;font-weight:900;min-width:70px;text-align:center;color:var(--navy)}.board{display:grid;grid-template-columns:repeat(6,minmax(135px,1fr));gap:7px;background:var(--navy);padding:8px;border-radius:14px;overflow:auto}.cat{min-height:72px;display:grid;place-items:center;text-align:center;background:#34236b;color:white;padding:8px;font-weight:900;text-transform:uppercase}.clue{min-height:88px;background:#132e83;color:var(--gold);font-size:1.65rem;font-weight:900;border-radius:3px}.clue.used{background:#27314f;color:#7d8396;cursor:not-allowed}.modal{position:fixed;inset:0;background:rgba(10,10,30,.78);display:none;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}.card{width:min(850px,96vw);background:white;border-radius:18px;padding:24px;text-align:center}.value{color:var(--teal);font-weight:900}.question{font-size:clamp(1.4rem,4vw,2.35rem);line-height:1.3;margin:22px 0}.answer{display:none;background:#eaf8f4;border-left:5px solid var(--ok);padding:14px;border-radius:9px;font-size:1.2rem}.answer.show{display:block}.modal-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}.timer{font-size:1.5rem;font-weight:900;color:var(--bad)}.daily{display:none;color:#8a5800;background:#fff4d7;padding:8px;border-radius:999px;font-weight:900}.daily.show{display:inline-block}.final{margin-top:14px;background:white;border:1px solid var(--line);border-radius:14px;padding:16px}@media(max-width:900px){.board{grid-template-columns:repeat(6,150px)}}@media print{.toolbar,.teams,.final{display:none}}
</style></head><body><div class="shell"><header><img class="ncc" src="../assets/ncc-logo.png" alt="NCC logo"><img class="itt" src="../assets/itt-logo.png" alt="ITT icon"><div><h1>ITT101 Week 1 Jeopardy Challenge</h1><p>NCC App · Canvas · Information Technology · History · Evolution · IT Concepts</p></div></header><div class="toolbar"><button class="alt" id="back">← Return to Week 1</button><button class="teal" id="reset">Reset Game</button><button class="gold" id="finalBtn">Final Jeopardy</button><span class="timer" id="timer">30</span><button class="alt" id="startTimer">Start Timer</button></div><div class="teams" id="teams"></div><div class="board" id="board"></div><section class="final"><strong>Classroom mode:</strong> Select a clue, let a team respond, reveal the answer, then award or deduct points. Team names and scores remain in this browser during the game.</section></div><div class="modal" id="modal"><div class="card"><span class="daily" id="daily">DAILY DOUBLE</span><div class="value" id="value"></div><div class="question" id="question"></div><div class="answer" id="answer"></div><div class="modal-actions"><button class="teal" id="reveal">Reveal Answer</button><button class="alt" id="close">Return to Board</button></div><div class="modal-actions" id="award"></div></div></div><script>
const bank={"NCC App!": [[200, "What does NCC mean?", "Northwest Career College."], [400, "Mention at least five features from the NCC App.", "Examples: call-out notifications, class schedule, attendance, IT support, student assistance, parking, employee directory, Student Portal, and Canvas."], [600, "What information is displayed on NCC's Digital ID?", "Student ID number, program and shift, NCC student email, and links for Canvas and the Student Portal."], [800, "How can students access Google Chrome?", "Sign in to Google Chrome using the NCC email address."], [1000, "How can you access the Student Portal?", "Log in to the NCC App and select Portal from My Resources."]], "Canvas": [[200, "What can students do in Canvas?", "Complete coursework, submit assignments, study materials, take tests, and check grades."], [400, "How is grading categorized?", "Syllabus, modules, discussion boards, homework, exams and quizzes, lab activities, participation, and professionalism."], [600, "How can students request tutoring or MUH?", "In Canvas, select the course, open Modules, and choose \u201cBook Your Academic Support Session.\u201d"], [800, "What is ProctorU?", "A proctoring service set up in Week 3 and used for final exams to uphold academic integrity."], [1000, "Why does NCC use Turnitin?", "To evaluate originality and confirm what the student knows."]], "Information Technology": [[200, "What is information technology?", "The use of computer systems or devices to access and work with information."], [400, "Mention five IT fields.", "Examples: cybersecurity, network administration, system administration, database administration, software development, web development, and technical support."], [600, "Which CompTIA certification in this course never expires?", "CompTIA Tech+."], [800, "How many modules are included in the IT program?", "ITT101 through ITT107, plus externship."], [1000, "How many hours does the externship require?", "180 hours."]], "History of IT": [[200, "Which was the first known computing tool?", "The abacus, circa 2400 BC."], [400, "Who invented the Difference Engine and conceptualized the Analytical Engine?", "Charles Babbage."], [600, "What does GUI mean?", "Graphical User Interface."], [800, "Why is Ada Lovelace recognized?", "She developed the first published algorithm intended for a machine, predating modern programming."], [1000, "What does the Latin word computare mean in this course material?", "Programmable machine / to compute."]], "Evolution of IT": [[200, "What is artificial intelligence?", "Technology that simulates or replicates human cognitive abilities such as learning, recognizing patterns, and making decisions."], [400, "Mention three emerging technologies.", "Artificial intelligence, quantum computing, and cybersecurity."], [600, "How is AI classified in the course presentation?", "Narrow AI, general AI, and superintelligent AI."], [800, "What does quantum computing use?", "Qubits\u2014quantum bits."], [1000, "Why are qubits more powerful and complex than classical bits?", "A qubit can represent 0, 1, or a superposition of both states."]], "IT Concepts": [[200, "What is the computing cycle?", "The steps a computer follows to process data and produce results."], [400, "What are the four steps of the computing cycle?", "Input, processing, storage, and output."], [600, "Mention three input devices.", "Examples: keyboard, mouse, and microphone."], [800, "What is virtual memory?", "Storage space used as temporary extra memory when physical RAM is full."], [1000, "Mention common storage devices.", "Hard disk drives, solid-state drives, flash memory, and optical media such as CDs or Blu-ray discs."]]}; const cats=Object.keys(bank); let current=null, seconds=30, tick=null; const used=new Set(JSON.parse(localStorage.getItem('itt101-jeopardy-used')||'[]')); const teamState=JSON.parse(localStorage.getItem('itt101-jeopardy-teams')||'null')||[{name:'Team 1',score:0},{name:'Team 2',score:0},{name:'Team 3',score:0}];
const $=id=>document.getElementById(id); function save(){localStorage.setItem('itt101-jeopardy-used',JSON.stringify([...used]));localStorage.setItem('itt101-jeopardy-teams',JSON.stringify(teamState))}
function renderTeams(){$('teams').innerHTML='';teamState.forEach((t,i)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<input aria-label="Team ${i+1} name" value="${t.name}"><span class="score">${t.score}</span><button class="alt" data-i="${i}" data-d="-">−</button><button data-i="${i}" data-d="+">+</button>`;d.querySelector('input').onchange=e=>{t.name=e.target.value;save()};d.querySelectorAll('button').forEach(b=>b.onclick=()=>adjust(+b.dataset.i,b.dataset.d==='+'?current?.value||100:-(current?.value||100)));$('teams').appendChild(d)})}
function adjust(i,n){teamState[i].score+=n;save();renderTeams()}
function renderBoard(){$('board').innerHTML='';cats.forEach(c=>{let h=document.createElement('div');h.className='cat';h.textContent=c;$('board').appendChild(h)});for(let r=0;r<5;r++)cats.forEach((c,ci)=>{let item=bank[c][r],key=ci+'-'+r,b=document.createElement('button');b.className='clue'+(used.has(key)?' used':'');b.textContent='$'+item[0];b.disabled=used.has(key);b.onclick=()=>openClue(c,ci,r,item);$('board').appendChild(b)})}
function openClue(c,ci,r,item){current={key:ci+'-'+r,value:item[0]};used.add(current.key);save();renderBoard();$('value').textContent=c+' · $'+item[0];$('question').textContent=item[1];$('answer').textContent='Answer: '+item[2];$('answer').classList.remove('show');$('daily').classList.toggle('show',Math.random()<0.08);$('modal').classList.add('open');$('award').innerHTML='';teamState.forEach((t,i)=>{let plus=document.createElement('button');plus.textContent='Award '+t.name;plus.onclick=()=>adjust(i,current.value);let minus=document.createElement('button');minus.className='alt';minus.textContent='Deduct '+t.name;minus.onclick=()=>adjust(i,-current.value);$('award').append(plus,minus)});resetTimer()}
function resetTimer(){clearInterval(tick);seconds=30;$('timer').textContent=seconds}$('startTimer').onclick=()=>{clearInterval(tick);tick=setInterval(()=>{seconds--;$('timer').textContent=seconds;if(seconds<=0)clearInterval(tick)},1000)};$('reveal').onclick=()=>$('answer').classList.add('show');$('close').onclick=()=>{$('modal').classList.remove('open');clearInterval(tick)};$('back').onclick=()=>location.href='itt101-week1.html';$('reset').onclick=()=>{if(confirm('Reset all clues and team scores?')){used.clear();teamState.forEach(t=>t.score=0);save();renderBoard();renderTeams()}};$('finalBtn').onclick=()=>{current={value:1000};$('value').textContent='FINAL JEOPARDY · Digital Citizenship';$('question').textContent='A student receives an urgent message asking for a password through a link that resembles an NCC login page. Identify the threat and state the safest response.';$('answer').textContent='Answer: This is a phishing or credential-theft attempt. Do not open the link or provide credentials; verify through an official NCC channel and report the message.';$('answer').classList.remove('show');$('daily').classList.remove('show');$('modal').classList.add('open');$('award').innerHTML='';teamState.forEach((t,i)=>{let b=document.createElement('button');b.textContent='Award '+t.name;b.onclick=()=>adjust(i,1000);$('award').appendChild(b)});resetTimer()};renderTeams();renderBoard();
</script></body></html>
