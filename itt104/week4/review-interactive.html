<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT104 Week 3 Arena</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f1f8;color:#17132f}.w{max-width:950px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#2856a6,#4b3670);color:#fff;padding:28px;border-radius:22px}.q{background:#fff;border-radius:18px;padding:24px;margin-top:18px}.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}.a{padding:18px;border:0;border-radius:14px;color:#fff;font-weight:800;cursor:pointer}.a:nth-child(1){background:#b52c37}.a:nth-child(2){background:#2263aa}.a:nth-child(3){background:#b48313}.a:nth-child(4){background:#278050}.btn{background:#4b3670;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:650px){.ans{grid-template-columns:1fr}}</style></head><body><div class=w><div class=hero><b>🎯 ITT104 WEEK 3 · REVIEW ARENA</b><h1>Development & Testing Mastery Challenge</h1><p id=prog></p><p>Score: <b id=score>0</b> · Streak: <b id=streak>0</b></p></div><div class=q><h2 id=q></h2><div id=ans class=ans></div><p id=fb></p><button id=next class=btn style="display:none" onclick=nxt()>Next →</button></div></div><script>
const bank=[['Standard PowerShell cmdlet naming?','Verb-Noun',['Verb-Noun','Noun-Verb','Number-Noun','Adjective-Verb']],['What does -WhatIf do?','Preview without executing',['Preview without executing','Delete immediately','Encrypt','Start Windows']],['Which lists directory contents?','Get-ChildItem',['Get-ChildItem','Get-List','Show-Files','Display-Dir']],['Which character starts variables?','$',['$','@','%','#']],['What does | do?','Passes objects between cmdlets',['Passes objects between cmdlets','Comments code','Creates arrays','Stops Windows']],['Which parameter searches subdirectories?','-Recurse',['-Recurse','-Deep','-All','-Tree']],['Why use a flowchart?','Visualize logic before coding',['Visualize logic before coding','Replace testing','Install Python','Avoid decisions']],['What does ForEach-Object do?','Acts on each pipeline object',['Acts on each pipeline object','Deletes all objects','Creates BIOS','Stops all services']],['Which can test connectivity?','Test-Connection',['Test-Connection','Get-Date','Write-Host','New-Item']],['Why automate IT work?','Reduce repetitive work and errors',['Reduce repetitive work and errors','Increase clicking','Avoid verification','Hide output']],['What structure handles errors?','try/catch',['try/catch','echo/pause','dir/cd','array only']],['Which OS support PowerShell 7?','Windows, macOS, Linux',['Windows, macOS, Linux','Windows only','Linux only','macOS only']]];let qs=[...bank].sort(()=>Math.random()-.5).slice(0,10),i=0,s=0,st=0;function r(){let x=qs[i];prog.textContent=`Question ${i+1}/10`;q.textContent=x[0];ans.innerHTML=[...x[2]].sort(()=>Math.random()-.5).map((a,j)=>`<button class=a onclick="go('${a.replace(/'/g,"\\'")}')">${a}</button>`).join('');fb.textContent='';next.style.display='none'}function go(a){let x=qs[i],ok=a==x[1];if(ok){s+=100+st*20;st++}else st=0;score.textContent=s;streak.textContent=st;fb.textContent=ok?'✅ Correct!':'❌ Correct answer: '+x[1];next.style.display='inline-block';document.querySelectorAll('.a').forEach(b=>b.disabled=true)}function nxt(){i++;if(i<10)r();else{q.textContent='Mission complete!';ans.innerHTML='';fb.innerHTML=`Final score: <b>${s}</b>`;next.textContent='↻ Play Again';next.onclick=()=>location.reload()}}r();
</script></body></html>
