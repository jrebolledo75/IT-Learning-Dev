<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT104 Week 3 Study Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f3f8;color:#171334}.w{max-width:1080px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#2856a6,#4b3670);color:#fff;border-radius:22px;padding:25px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.tabs button,.btn{padding:12px;border:1px solid #ddd5e8;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.tabs .on{background:#4b3670;color:#fff}.panel{display:none;background:#fff;border:1px solid #ddd5e8;border-radius:18px;padding:22px;min-height:520px}.panel.on{display:block}.flash{min-height:260px;border:2px solid #ddd5e8;border-radius:18px;background:#faf9fc;display:grid;place-items:center;text-align:center;padding:26px;cursor:pointer}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer,.term,.target{padding:14px;border:1px solid #ddd5e8;border-radius:11px;background:#faf9fc}.answer{font-weight:800;cursor:pointer;text-align:left}.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.term{font-weight:800;cursor:grab}.term.sel{outline:3px solid #7b4ab5}.target.good{background:#eaf7ef}.target.bad{background:#fff0f0}.fb{margin-top:12px;padding:13px;border-radius:11px;background:#f0edf7}.code{background:#171c22;color:#baffbd;border-radius:12px;padding:16px;font-family:Consolas,monospace}@media(max-width:760px){.tabs{grid-template-columns:1fr 1fr}.answers,.match{grid-template-columns:1fr}}</style></head><body><div class=w><header class=hero><b>NCC · ITT104 · WEEK 3</b><h1>🎮 Development & Testing Study Center</h1><p>Flashcards · Random Quiz · Drag & Match · Command Builder · Review Arena</p></header><nav id=tabs class=tabs></nav><section id=flash class="panel on"></section><section id=quiz class=panel></section><section id=match class=panel></section><section id=builder class=panel></section><section id=arena class=panel></section><p><a class=btn href=index.html>← Week 3 Home</a></p></div><script>
const sec=[['flash','🃏 Flashcards'],['quiz','📝 Quick Quiz'],['match','🧩 Drag & Match'],['builder','⌨️ Command Builder'],['arena','🏆 Review Arena']];let cur='flash';function navd(){tabs.innerHTML=sec.map(s=>`<button class="${cur==s[0]?'on':''}" onclick="show('${s[0]}')">${s[1]}</button>`).join('')}function show(x){cur=x;document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));document.getElementById(x).classList.add('on');navd();({flash:drawF,quiz:resetQ,match:resetM,builder:resetB,arena:drawA}[x])()}function sh(a){return [...a].sort(()=>Math.random()-.5)}
const cards=[['Verb-Noun','PowerShell cmdlets use names such as Get-ChildItem.'],['Pipeline |','Passes objects between cmdlets.'],['-Recurse','Searches subdirectories.'],['$variable','PowerShell variables begin with $.'],['@()','Creates an array literal.'],['-WhatIf','Previews an action without executing it.'],['ForEach-Object','Acts on each object in a pipeline.'],['Get-Help','Shows cmdlet help and examples.'],['Test-Connection','Tests connectivity.'],['try/catch','Handles errors.']];let deck=sh(cards),fi=0,flip=false;function drawF(){let c=deck[fi];flash.innerHTML=`<h2>🃏 Flashcard Sprint</h2><p>${fi+1}/${deck.length}</p><div class=flash onclick="flip=!flip;drawF()"><div><h2>${c[0]}</h2><p>${flip?c[1]:'Explain it, then tap to reveal.'}</p></div></div><p><button class=btn onclick="fi=(fi+deck.length-1)%deck.length;flip=false;drawF()">←</button> <button class=btn onclick="deck=sh(cards);fi=0;flip=false;drawF()">🔀 Shuffle</button> <button class=btn onclick="fi=(fi+1)%deck.length;flip=false;drawF()">→</button></p>`}
const qb=[['Which verb retrieves information?','Get',['Get','Set','Move','Return']],['What does | do?','Passes objects',['Passes objects','Deletes files','Creates arrays','Starts Windows']],['Which parameter searches subdirectories?','-Recurse',['-Recurse','-Deep','-All','-Tree']],['Which command lists files?','Get-ChildItem',['Get-ChildItem','Get-List','Show-Files','Display-Dir']],['Why automate IT tasks?','Reduce repetitive work',['Reduce repetitive work','Increase clicking','Avoid testing','Hide output']],['Which symbol starts variables?','$',['$','@','%','#']]];let qs=[],qi=0,sc=0;function resetQ(){qs=sh(qb).slice(0,5);qi=0;sc=0;renderQ()}function renderQ(){let q=qs[qi];quiz.innerHTML=`<h2>📝 Quick Quiz</h2><p>Question ${qi+1}/5 · Score ${sc}</p><h2>${q[0]}</h2><div class=answers>${sh(q[2]).map(a=>`<button class=answer onclick="ansQ('${a.replace(/'/g,"\\'")}')">${a}</button>`).join('')}</div><div id=qfb class=fb>Choose an answer.</div>`}function ansQ(a){let q=qs[qi];if(a==q[1]){sc++;qfb.innerHTML='✅ Correct.'}else qfb.innerHTML='❌ Correct answer: '+q[1];setTimeout(()=>{qi++;if(qi<5)renderQ();else quiz.innerHTML=`<h2>Quiz Complete: ${sc}/5</h2><button class=btn onclick=resetQ()>↻ New Quiz</button>`},700)}
const mp=[['Get-ChildItem','Lists files/folders'],['-Recurse','Searches subdirectories'],['$env:','Environment variables'],['@()','Array literal'],['-WhatIf','Preview without execution'],['Get-Help','Help/examples']];let selected=null,matched=0;function resetM(){let p=sh(mp);matched=0;selected=null;match.innerHTML=`<h2>🧩 Drag & Match</h2><p>Tap a term then its definition.</p><div class=match><div id=terms></div><div id=targets></div></div><div id=mfb class=fb>Matches: 0/6</div>`;p.forEach(([t,d])=>terms.innerHTML+=`<div class=term data-t="${t}" onclick="sel(this)">${t}</div>`);sh(p).forEach(([t,d])=>targets.innerHTML+=`<div class=target data-t="${t}" onclick="mat(this)">${d}</div>`)}function sel(e){document.querySelectorAll('.term').forEach(x=>x.classList.remove('sel'));selected=e;e.classList.add('sel')}function mat(e){if(!selected)return;if(e.dataset.t==selected.dataset.t){e.classList.add('good');selected.remove();selected=null;matched++;mfb.innerHTML=`✅ Matches: ${matched}/6`}else{e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),500)}}
const bb=[['List files',['Get-ChildItem','dir','gci']],['Show environment variables',['Get-ChildItem env:']],['Test 8.8.8.8',['Test-Connection 8.8.8.8']]];let bx;function resetB(){bx=bb[Math.floor(Math.random()*bb.length)];builder.innerHTML=`<h2>⌨️ Command Builder</h2><p>${bx[0]}</p><div class=code>PS C:\\Lab&gt;</div><p><input id=bi style="width:100%;padding:12px;border:1px solid #ddd5e8;border-radius:9px" placeholder="Type command"></p><button class=btn onclick=checkB()>Run</button> <button class=btn onclick=resetB()>🔀 New</button><div id=bfb class=fb>Build the command.</div>`}function checkB(){let v=bi.value.trim();bfb.innerHTML=bx[1].some(a=>a.toLowerCase()==v.toLowerCase())?'✅ Correct. Explain the expected output.':'❌ Check cmdlet or alias.'}function drawA(){arena.innerHTML=`<h2>🏆 Review Arena</h2><p>Finish with the randomized mastery challenge.</p><button class=btn onclick="location.href='review-interactive.html'">Launch Arena →</button>`}navd();drawF();
</script></body></html>
