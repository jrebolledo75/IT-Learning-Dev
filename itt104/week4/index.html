<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT104 Week 4 Final Mastery Review</title><style>
:root{--bg:#081120;--panel:#101d33;--panel2:#152641;--text:#eef6ff;--muted:#9fb0c8;--accent:#56d6ff;--good:#59d98e;--bad:#ff6b7a;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#07101e,#0b1830);color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:20px}.hero{padding:26px;border:1px solid #294363;border-radius:22px;background:linear-gradient(135deg,#10213c,#0d1a2d);box-shadow:0 18px 50px #0005}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.12em;font-size:.78rem}.hero h1{margin:.35rem 0;font-size:clamp(1.7rem,4vw,3rem)}.muted{color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #38577a;background:#142742;color:white;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.btn:hover,.btn.active{border-color:var(--accent);transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#1768a5,#1a8db2)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card,.panel{background:var(--panel);border:1px solid #294363;border-radius:18px;padding:18px;margin:12px 0}.stat{font-size:2rem;font-weight:900}.tag{display:inline-block;border:1px solid #3c5f85;border-radius:999px;padding:5px 9px;font-size:.78rem;color:#cfe9ff}.q{font-size:1.2rem;font-weight:800;margin:18px 0}.opts{display:grid;gap:10px}.opt{text-align:left}.opt.correct{border-color:var(--good);background:#123d31}.opt.wrong{border-color:var(--bad);background:#4a1d29}.confidence{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.confidence button{min-height:66px}.selected{outline:2px solid var(--gold)}.explain{margin-top:14px;padding:14px;border-left:4px solid var(--accent);background:#0b1729;border-radius:8px}.bar{height:10px;background:#0a1526;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#2bb8ff,#59d98e)}select,textarea,input{background:#0b1729;color:white;border:1px solid #38577a;border-radius:10px;padding:10px;width:100%}label{display:block;margin:10px 0}.result-good{color:var(--good)}.result-bad{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #294363;text-align:left}@media(max-width:650px){.confidence{grid-template-columns:1fr 1fr}.wrap{padding:12px}}@media print{body{background:white;color:black}.nav,.btn{display:none}.card,.panel,.hero{border:1px solid #aaa;background:white;color:black}.muted{color:#444}}
</style></head><body><div class="wrap"><div id="app"></div></div><script>const BANK=[{"domain": "Languages", "q": "What is the main purpose of a compiler?", "opts": ["Convert source code into machine/executable code", "Save code as text", "Interpret each line only at runtime", "Create a database"], "correct": 0, "explain": "A compiler translates source code into lower-level executable or machine code before execution."}, {"domain": "Languages", "q": "What does a runtime engine do in a bytecode-based environment?", "opts": ["Designs source code", "Interprets/translates bytecode for the machine", "Creates flowcharts", "Stores variables"], "correct": 1, "explain": "The runtime engine handles bytecode so it can execute on the specific machine."}, {"domain": "Languages", "q": "Why are compiled languages often chosen for resource-intensive programs?", "opts": ["They generally execute quickly and efficiently", "They cannot access hardware", "They are always easier to write", "They only work on the web"], "correct": 0, "explain": "Ahead-of-time translation can provide efficient execution for demanding workloads."}, {"domain": "Languages", "q": "Which is an advantage associated with interpreted languages in the Week 4 review?", "opts": ["Platform independence", "They always run faster than compiled code", "They require binary coding", "They cannot be scripted"], "correct": 0, "explain": "The review identifies platform independence as an advantage of interpreted languages."}, {"domain": "Languages", "q": "What is an interpreted language?", "opts": ["A language whose source instructions are executed through an interpreter at runtime", "A language used only for websites", "A language that must become binary ahead of time", "A hardware language"], "correct": 0, "explain": "Interpreted code is processed at runtime rather than being fully compiled ahead of time."}, {"domain": "Languages", "q": "Why can assembly language be efficient?", "opts": ["It allows direct access to hardware", "It is a high-level query language", "It always runs in a browser", "It uses only strings"], "correct": 0, "explain": "Assembly is close to machine operations and permits direct hardware-level control."}, {"domain": "Languages", "q": "What is the main purpose of a query language?", "opts": ["Retrieve or work with information in databases", "Create video games only", "Replace an operating system", "Draw flowcharts"], "correct": 0, "explain": "Query languages such as SQL are designed to request and manipulate database information."}, {"domain": "Languages", "q": "Which language in the Week 4 review requires compilation to executable code?", "opts": ["C++", "Python", "SQL", "Perl"], "correct": 0, "explain": "C++ is commonly compiled before execution."}, {"domain": "Languages", "q": "After a major hardware/OS change, which code is most likely to need rewriting?", "opts": ["Assembly language", "Interpreted language", "Query language", "Pseudocode"], "correct": 0, "explain": "Assembly is hardware-specific, so architecture changes can require rewriting."}, {"domain": "Languages", "q": "What is the key portability advantage of Java bytecode?", "opts": ["It can run anywhere a compatible JVM exists", "It is identical to machine code", "It never needs a runtime", "It only runs on one CPU"], "correct": 0, "explain": "Java bytecode is executed by the JVM, providing portability across systems with a JVM."}, {"domain": "Data & Logic", "q": "A variable named visits counts customer visits. Best data type?", "opts": ["Integer", "Boolean", "String", "Float"], "correct": 0, "explain": "A visit count is a whole-number quantity, so integer is appropriate."}, {"domain": "Data & Logic", "q": "A variable named loyalty stores whether a guest is a loyalty member. Best type?", "opts": ["Boolean", "Integer", "Float", "Character"], "correct": 0, "explain": "A yes/no state maps naturally to True/False Boolean values."}, {"domain": "Data & Logic", "q": "Which flowchart shape represents a decision?", "opts": ["Diamond", "Rectangle", "Oval", "Parallelogram"], "correct": 0, "explain": "A diamond represents a Yes/No or branching decision."}, {"domain": "Data & Logic", "q": "Who converts pseudocode into actual program code?", "opts": ["Programmer", "Compiler", "Assembler", "Interpreter"], "correct": 0, "explain": "Pseudocode is a planning representation; the programmer implements it in a real language."}, {"domain": "Data & Logic", "q": "Number of children is best stored as what type?", "opts": ["Integer", "Float", "Boolean", "String"], "correct": 0, "explain": "The number of children is a whole-number count."}, {"domain": "Data & Logic", "q": "In an Employee object, salary is data and GrantRaise() performs an action. Which is correct?", "opts": ["salary is an attribute; GrantRaise() is a method", "Both are methods", "Both are attributes", "salary is a method; GrantRaise() is an attribute"], "correct": 0, "explain": "Object data is represented by attributes; behavior is represented by methods."}, {"domain": "Data & Logic", "q": "What is a variable?", "opts": ["A container that holds data for later use", "A fixed value that can never change", "A type of loop", "A compiler"], "correct": 0, "explain": "Variables are named storage locations whose values may change."}, {"domain": "Data & Logic", "q": "Which is a character value?", "opts": ["'7'", "3.14", "False", "\"555-1212\""], "correct": 0, "explain": "A character stores one symbol; quotes around a single 7 represent a character in this example."}, {"domain": "Data & Logic", "q": "What is a floating-point number?", "opts": ["A number that can have decimal fractions", "A whole number only", "A Boolean value", "A single character"], "correct": 0, "explain": "Floating-point types represent values with fractional/decimal components."}, {"domain": "Data & Logic", "q": "Which is an integer?", "opts": ["23", "9.95", "4.1", "5.62"], "correct": 0, "explain": "23 is a whole number with no decimal fraction."}, {"domain": "Data & Logic", "q": "If a numeric-looking value is stored as a character, what is true?", "opts": ["You cannot directly perform numeric math on it as a number", "It automatically becomes an integer", "It is deleted", "It becomes Boolean"], "correct": 0, "explain": "A character is text-like data; conversion is needed before numeric arithmetic."}, {"domain": "Data & Logic", "q": "Which is a string?", "opts": ["Hello world", "@", "7", "$"], "correct": 0, "explain": "A string is a sequence of characters."}, {"domain": "Data & Logic", "q": "Which Boolean operator is True only when both conditions are True?", "opts": ["AND", "OR", "XOR", "NOT"], "correct": 0, "explain": "AND requires both operands/conditions to be true."}, {"domain": "Data & Logic", "q": "In the Week 4 pseudocode material, || represents:", "opts": ["Logical OR", "Logical AND", "Logical NOT", "Logical XOR"], "correct": 0, "explain": "Double vertical bars are used to represent logical OR in many programming contexts."}, {"domain": "Data & Logic", "q": "What is an array?", "opts": ["A structure that holds multiple values", "A single fixed constant", "A compiler", "A flowchart decision"], "correct": 0, "explain": "Arrays group multiple indexed values; the Week 4 material describes them as collections of values."}, {"domain": "Data & Logic", "q": "What does multidimensional array mean?", "opts": ["It can contain arrays within arrays", "It can hold only one value", "It is a function", "It cannot be indexed"], "correct": 0, "explain": "A multidimensional array organizes values across more than one dimension, often as arrays of arrays."}, {"domain": "Data & Logic", "q": "Which pseudocode construct repeats while a condition is true?", "opts": ["WHILE", "SEQUENCE", "CASE", "DISPLAY"], "correct": 0, "explain": "WHILE is a loop with its condition checked at the beginning."}, {"domain": "Data & Logic", "q": "Which pseudocode construct expresses a two-way decision?", "opts": ["IF-THEN-ELSE", "SEQUENCE", "PRINT", "FOR only"], "correct": 0, "explain": "IF-THEN-ELSE branches execution based on a condition."}, {"domain": "Data & Logic", "q": "Which flowchart shape represents input/output?", "opts": ["Parallelogram", "Diamond", "Rectangle", "Oval"], "correct": 0, "explain": "A parallelogram is the standard input/output symbol in the supplied Week 4 material."}, {"domain": "Data & Logic", "q": "Which flowchart shape represents start/end?", "opts": ["Oval", "Diamond", "Rectangle", "Arrow"], "correct": 0, "explain": "The Week 4 material uses an oval for the start or end of a program."}, {"domain": "Programming", "q": "In COBOL, which statement adds X and Y and stores the result in Z?", "opts": ["ADD X Y TO Z", "SUM X,Y = Z", "Z = ADD(X,Y)", "PLUS X Y Z"], "correct": 0, "explain": "The supplied ITT104 Jeopardy bank gives ADD X Y TO Z."}, {"domain": "Programming", "q": "Which is NOT an OOP feature in the supplied review?", "opts": ["Exception handling", "Encapsulation", "Inheritance", "Polymorphism"], "correct": 0, "explain": "Exception handling manages errors; it is not one of the core OOP features in this review."}, {"domain": "Programming", "q": "In C/Java, a = b = 1 means:", "opts": ["Both a and b are assigned 1", "Only a is assigned 1", "It compares a and b", "It is always a syntax error"], "correct": 0, "explain": "Chained assignment assigns 1 to b and then that value to a."}, {"domain": "Programming", "q": "Dividing by zero during execution is categorized in the supplied review as a:", "opts": ["Run-time error", "Comment", "Version-control error", "Flowchart error"], "correct": 0, "explain": "The failure occurs while the program runs, so the review categorizes it as a run-time error."}, {"domain": "Programming", "q": "What mechanism is used to handle/prevent program termination from runtime problems?", "opts": ["Exception handlers", "Goto statements", "Comments", "Constants"], "correct": 0, "explain": "Exception handling lets code respond to exceptional runtime conditions."}, {"domain": "Programming", "q": "In Perl, which symbols identify scalar and array variables?", "opts": ["$ for scalar, @ for array", "@ for scalar, $ for array", "# for scalar, % for array", "% for scalar, & for array"], "correct": 0, "explain": "The supplied Jeopardy review uses $ for scalar and @ for array."}, {"domain": "Programming", "q": "Which early language is associated with recursion and dynamic memory in the review?", "opts": ["LISP", "COBOL", "FORTRAN", "SQL"], "correct": 0, "explain": "The review identifies LISP with recursion and dynamic memory, features important to early AI work."}, {"domain": "Programming", "q": "Goto-heavy, tangled code is commonly called:", "opts": ["Spaghetti code", "Bytecode", "Pseudocode", "Object code"], "correct": 0, "explain": "Unstructured control flow dominated by goto statements is often described as spaghetti code."}, {"domain": "Programming", "q": "Subroutines primarily support which programming idea?", "opts": ["Modular programming", "Machine language", "Database normalization", "Binary encoding"], "correct": 0, "explain": "Subroutines divide a program into reusable, manageable modules."}, {"domain": "Programming", "q": "Avoiding goto in favor of clear sequence/selection/iteration is associated with:", "opts": ["Structured programming", "Assembly addressing", "Query processing", "Character encoding"], "correct": 0, "explain": "Structured programming emphasizes well-defined control structures instead of arbitrary jumps."}, {"domain": "Programming", "q": "Which language uses prefix notation in the supplied review?", "opts": ["LISP", "Java", "COBOL", "PowerShell"], "correct": 0, "explain": "The supplied Jeopardy review identifies LISP as a prefix-notation language."}, {"domain": "Programming", "q": "What kind of variable is used to reference linked-list nodes?", "opts": ["Pointer", "Boolean", "Float", "Constant"], "correct": 0, "explain": "Pointers/references connect nodes in linked data structures."}, {"domain": "PowerShell", "q": "PowerShell cmdlets that modify/set an item commonly begin with which verb?", "opts": ["Set", "Read", "Ask", "Print"], "correct": 0, "explain": "PowerShell uses standardized verb-noun naming; Set-* changes or configures values."}, {"domain": "PowerShell", "q": "What is a PowerShell switch statement for?", "opts": ["Comparing one expression against multiple values/cases", "Creating a file only", "Closing Windows", "Compiling C++"], "correct": 0, "explain": "switch selects among multiple branches based on an expression/value."}, {"domain": "PowerShell", "q": "Which command closes/removes a PowerShell remote session?", "opts": ["Remove-PSSession", "Get-PSSession", "New-PSSession", "Open-PSSession"], "correct": 0, "explain": "Remove-PSSession closes and removes a PowerShell session."}, {"domain": "PowerShell", "q": "What does ForEach-Object do?", "opts": ["Performs an action for each pipeline object", "Creates a database", "Compiles a script", "Starts BIOS"], "correct": 0, "explain": "ForEach-Object processes each object passed through the pipeline."}, {"domain": "PowerShell", "q": "Which cmdlet lists running processes?", "opts": ["Get-Process", "Get-Service", "Get-Command", "Set-Process"], "correct": 0, "explain": "Get-Process retrieves process information."}, {"domain": "PowerShell", "q": "Which cmdlet lists services?", "opts": ["Get-Service", "Get-Process", "Get-Content", "New-Item"], "correct": 0, "explain": "Get-Service retrieves service information."}, {"domain": "PowerShell", "q": "Which cmdlet copies an item?", "opts": ["Copy-Item", "Move-Item", "Set-Item", "Get-Item"], "correct": 0, "explain": "Copy-Item copies files or other provider items."}, {"domain": "PowerShell", "q": "Which cmdlet creates a new item such as a file or directory?", "opts": ["New-Item", "Get-Item", "Clear-Host", "Measure-Object"], "correct": 0, "explain": "New-Item creates a new item in a PowerShell provider."}, {"domain": "Linux", "q": "Which Linux command searches manual-page descriptions by keyword?", "opts": ["apropos", "touch", "pwd", "mkdir"], "correct": 0, "explain": "apropos searches command descriptions, useful when you know the task but not the command."}, {"domain": "Linux", "q": "Which Linux command creates an empty file?", "opts": ["touch", "cat", "grep", "ps"], "correct": 0, "explain": "touch creates a file if it does not exist and otherwise updates timestamps."}, {"domain": "Linux", "q": "Which ls option shows hidden files?", "opts": ["-a", "-r", "-s", "-p"], "correct": 0, "explain": "ls -a includes entries beginning with a dot."}, {"domain": "Linux", "q": "Which Linux directory exposes process/system information?", "opts": ["/proc", "/home", "/tmp", "/boot"], "correct": 0, "explain": "/proc is a virtual filesystem containing process and kernel information."}, {"domain": "Linux", "q": "In ls -l output, where is the file type indicated?", "opts": ["The first character", "The last character", "The file size column", "The owner name"], "correct": 0, "explain": "The first character of the mode field indicates file type."}, {"domain": "Application", "q": "A weekly restart should occur automatically with highest privileges. Which Windows tool directly supports this scheduled automation?", "opts": ["Task Scheduler", "Notepad", "Paint", "Device Manager"], "correct": 0, "explain": "The Week 4 lab uses Task Scheduler to define a weekly trigger and restart action."}, {"domain": "Application", "q": "Why add comments to code?", "opts": ["To make intent and behavior easier to understand and maintain", "To make variables immutable", "To compile faster automatically", "To replace testing"], "correct": 0, "explain": "Comments help the original programmer and coworkers understand code during updates and troubleshooting."}, {"domain": "Application", "q": "What is version control used for?", "opts": ["Tracking and managing changes to code", "Converting strings to integers", "Replacing a compiler", "Creating Boolean values"], "correct": 0, "explain": "Version control such as Git tracks code changes and supports collaboration/recovery."}];

const KEY='itt104Week4MasteryV1';let store=JSON.parse(localStorage.getItem(KEY)||'{"attempts":[],"reflections":{},"cold":[],"explain":[]}');let state={view:'dashboard',exam:[],i:0,answers:{},confidence:{},answered:false,selected:null,conf:null,start:0,filter:'All'};const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function header(){return `<div class="hero"><div class="eyebrow">NCC IT LEARNING HUB • ITT104 WEEK 4</div><h1>Final Mastery Review + Metacognition</h1><p class="muted">Programming Languages • Data Types • Logic • Linux • PowerShell • Automation • Final Readiness</p><div class="nav">${[['dashboard','Dashboard'],['cold','Cold Retrieval'],['examSetup','Random Mastery'],['flash','Flashcards'],['mission','Mission Ready'],['meta','Metacognition'],['report','Readiness Report']].map(x=>`<button class="btn ${state.view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function go(v){state.view=v;state.answered=false;render()}
function dashboard(){let a=store.attempts.at(-1),score=a?Math.round(a.score/a.total*100):0;return `<div class="grid"><div class="card"><span class="tag">Aligned Bank</span><div class="stat">${BANK.length}</div><div class="muted">source-aligned mastery questions</div></div><div class="card"><span class="tag">Latest Accuracy</span><div class="stat">${score||'—'}${a?'%':''}</div><div class="muted">from your latest random mastery run</div></div><div class="card"><span class="tag">Metacognition</span><div class="stat">4</div><div class="muted">Guessing → Unsure → Fairly Sure → Very Sure</div></div><div class="card"><span class="tag">Priority Signal</span><div class="stat">⚠️</div><div class="muted">Very Sure + Incorrect = misconception alert</div></div></div><div class="panel"><h2>Week 4 Mission</h2><p>Retrieve first. Predict your confidence. Apply the concept. Check the evidence. Explain your reasoning. Then decide what to study next.</p><button class="btn primary" onclick="go('cold')">Start Cold Retrieval →</button> <button class="btn" onclick="go('examSetup')">Launch Random Mastery</button></div>`}
const coldPrompts=['Without notes: name four programming language categories or examples and explain one difference.','Explain integer vs. float vs. string vs. Boolean using your own examples.','Draw or describe the flowchart symbols for Start/End, Input/Output, Process, and Decision.','Explain sequence, selection, and iteration without looking at notes.','Name three PowerShell cmdlets and state what each one does.','Explain one difference between scripting and programming or compiled and interpreted execution.'];
function cold(){return `<div class="panel"><span class="tag">RETRIEVAL BEFORE REVIEW</span><h2>Cold Retrieval</h2><p class="muted">Do not open notes yet. This measures what you can retrieve independently.</p>${coldPrompts.map((p,i)=>`<label><b>${i+1}. ${p}</b><textarea id="cold${i}" rows="3">${store.cold[i]||''}</textarea></label>`).join('')}<button class="btn primary" onclick="saveCold()">Save Retrieval</button></div>`}function saveCold(){store.cold=coldPrompts.map((_,i)=>document.getElementById('cold'+i).value);save();alert('Cold retrieval saved. Now compare your memory with the review activities.')}
function examSetup(){let domains=['All',...new Set(BANK.map(q=>q.domain))];return `<div class="panel"><h2>Random Final Mastery Simulator</h2><p class="muted">Question order and answer positions reshuffle every attempt. Choose confidence <b>before</b> answering.</p><div class="grid"><label>Question count<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option value="999">Full Bank (${BANK.length})</option></select></label><label>Topic<select id="domain">${domains.map(d=>`<option>${d}</option>`).join('')}</select></label></div><button class="btn primary" onclick="startExam()">Start Random Mastery →</button></div>`}
function startExam(){let d=document.getElementById('domain').value,n=+document.getElementById('count').value,pool=d==='All'?BANK:BANK.filter(q=>q.domain===d);state.exam=shuffle(pool).slice(0,Math.min(n,pool.length)).map(q=>{let pairs=q.opts.map((o,i)=>({o,ok:i===q.correct}));pairs=shuffle(pairs);return {...q,opts:pairs.map(x=>x.o),correct:pairs.findIndex(x=>x.ok)}});state.i=0;state.answers={};state.confidence={};state.answered=false;state.start=Date.now();state.view='exam';render()}
const confs=[['🎲','Guessing','I really do not know yet.'],['🤔','Unsure','I recognize it, but I am not confident.'],['👍','Fairly Sure','I think I know it and can explain most of my reasoning.'],['🎯','Very Sure','I know it and could explain it to someone else.']];
function exam(){let q=state.exam[state.i],sel=state.answers[state.i],cf=state.confidence[state.i];return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><span class="tag">${q.domain}</span><b>${state.i+1}/${state.exam.length}</b></div><div class="bar"><span style="width:${(state.i/state.exam.length)*100}%"></span></div><h3>1. Rate confidence before answering</h3><div class="confidence">${confs.map((c,i)=>`<button class="btn ${cf===i+1?'selected':''}" ${state.answered?'disabled':''} onclick="setConf(${i+1})"><b>${c[0]} ${c[1]}</b><br><small>${c[2]}</small></button>`).join('')}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="btn opt ${state.answered?(i===q.correct?'correct':i===sel?'wrong':''):''}" ${state.answered?'disabled':''} onclick="answer(${i})">${o}</button>`).join('')}</div>${state.answered?`<div class="explain"><b>${sel===q.correct?'Correct.':'Review this concept.'}</b> ${q.explain}<br><br><b>Metacognition:</b> You answered <b>${confs[cf-1][1]}</b>. ${cf===4&&sel!==q.correct?'<span class="result-bad">⚠️ High-confidence miss: treat this as a misconception alert.</span>':sel===q.correct&&cf<=2?'<span class="result-good">You knew more than your confidence suggested.</span>':''}</div><p><button class="btn primary" onclick="nextQ()">${state.i===state.exam.length-1?'Finish & Analyze':'Next Question →'}</button></p>`:''}</div>`}
function setConf(v){state.confidence[state.i]=v;render()}function answer(i){if(!state.confidence[state.i]){alert('Choose Guessing, Unsure, Fairly Sure, or Very Sure before answering.');return}state.answers[state.i]=i;state.answered=true;render()}function nextQ(){if(state.i<state.exam.length-1){state.i++;state.answered=false;render()}else finishExam()}
function finishExam(){let score=0,mis=[],weak={},cal=0;state.exam.forEach((q,i)=>{let ok=state.answers[i]===q.correct,cf=state.confidence[i];if(ok)score++;if((ok&&cf>=3)||(!ok&&cf<=2))cal++;if(!ok){weak[q.domain]=(weak[q.domain]||0)+1;if(cf===4)mis.push(q)}});store.attempts.push({date:new Date().toISOString(),score,total:state.exam.length,calibration:cal,misconceptions:mis.map(x=>x.q),weak});save();state.view='report';render()}
function flash(){let cards=shuffle(BANK).slice(0,20);return `<div class="panel"><h2>Rapid Retrieval Flashcards</h2><p class="muted">Say the answer aloud before revealing it.</p>${cards.map((q,i)=>`<details class="card"><summary><b>${i+1}. ${q.q}</b></summary><p>${q.opts[q.correct]}</p><p class="muted">${q.explain}</p></details>`).join('')}</div>`}
function mission(){return `<div class="panel"><h2>Mission Ready: Junior Software & Automation Technician</h2><div class="grid"><div class="card"><h3>🧩 Logic Architect</h3><p>A store discounts overstock and reorders low inventory. Sketch the flow with a decision diamond and explain the branches.</p></div><div class="card"><h3>⚙️ PowerShell Automation</h3><p>You need a weekly restart with highest privileges. Explain how Task Scheduler or PowerShell scheduled-task cmdlets solve the problem.</p></div><div class="card"><h3>🛡️ Cybersecurity Check</h3><p>Use PowerShell reasoning: which commands would you use to inspect processes, services, users, network connections, Defender, or event logs?</p></div><div class="card"><h3>🐍 Script It</h3><p>Design pseudocode for a script that asks for a name, validates input, and prints a greeting. Identify sequence, selection, variables, and data types.</p></div></div><label><b>Explain your strongest mission without notes. What evidence shows your solution works?</b><textarea id="missionRef" rows="5">${store.reflections.mission||''}</textarea></label><button class="btn primary" onclick="store.reflections.mission=document.getElementById('missionRef').value;save();alert('Mission reflection saved')">Save Mission Reflection</button></div>`}
function meta(){let r=store.reflections;return `<div class="panel"><h2>Metacognition Lab</h2><p class="muted">Monitoring = judging what you know. Control = deciding what to do next.</p>${[['learned','What are three things you learned or are excited about from ITT104?'],['questions','What questions do you still need clarified?'],['confident','Which concepts can you confidently explain without notes?'],['forget','Which concept are you most likely to forget, and when might that happen?'],['misconception','What is one answer you were confident about but discovered was wrong? What changed in your thinking?'],['next','What is your highest-priority topic, and what will you do in the next 20 minutes to strengthen it?'],['ownq','Write one question that would reveal whether someone truly understands an ITT104 concept.']].map(([k,p])=>`<label><b>${p}</b><textarea id="m_${k}" rows="3">${r[k]||''}</textarea></label>`).join('')}<button class="btn primary" onclick="saveMeta()">Save Metacognition Reflection</button></div>`}function saveMeta(){['learned','questions','confident','forget','misconception','next','ownq'].forEach(k=>store.reflections[k]=document.getElementById('m_'+k).value);save();alert('Metacognition reflection saved.')}
function report(){let a=store.attempts.at(-1);if(!a)return `<div class="panel"><h2>Readiness Report</h2><p>Complete a Random Mastery attempt to generate your report.</p><button class="btn primary" onclick="go('examSetup')">Start Assessment</button></div>`;let pct=Math.round(a.score/a.total*100),cal=Math.round(a.calibration/a.total*100),weak=Object.entries(a.weak).sort((a,b)=>b[1]-a[1]);return `<div class="panel"><h2>ITT104 Week 4 Readiness Report</h2><div class="grid"><div class="card"><div class="stat">${pct}%</div><b>Accuracy</b></div><div class="card"><div class="stat">${cal}%</div><b>Confidence Calibration</b></div><div class="card"><div class="stat">${a.misconceptions.length}</div><b>⚠️ Misconception Alerts</b></div><div class="card"><div class="stat">${a.total}</div><b>Questions Attempted</b></div></div><div class="card"><h3>Priority Weak Areas</h3>${weak.length?`<table><tr><th>Topic</th><th>Misses</th></tr>${weak.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`:'<p class="result-good">No misses in this attempt.</p>'}</div><div class="card"><h3>High-Confidence Misses</h3>${a.misconceptions.length?`<ul>${a.misconceptions.map(x=>`<li>${x}</li>`).join('')}</ul><p class="result-bad"><b>These deserve priority.</b> You were Very Sure, so review the reasoning—not only the correct answer.</p>`:'<p class="result-good">No Very Sure + Incorrect responses this attempt.</p>'}</div><div class="card"><h3>Readiness Interpretation</h3><p>${pct>=90?'Strong final-exam readiness. Focus on any high-confidence misses and explain weak topics aloud.':pct>=80?'Near mastery. Target the weak-area table, then run a new randomized set.':pct>=70?'Developing readiness. Use flashcards and Mission Ready before another simulator attempt.':'More retrieval and targeted practice recommended before the final.'}</p></div><button class="btn primary" onclick="go('examSetup')">Run Another Random Set</button> <button class="btn" onclick="go('meta')">Complete Reflection</button> <button class="btn" onclick="window.print()">Print Report</button></div>`}
function render(){document.getElementById('app').innerHTML=header()+({dashboard,cold,examSetup,exam,flash,mission,meta,report}[state.view]||dashboard)()+`<p class="muted" style="text-align:center;padding:20px">NCC IT Learning Hub • ITT104 Week 4 Final Mastery Review • Progress saved locally on this device</p>`}render();
</script></body></html>
