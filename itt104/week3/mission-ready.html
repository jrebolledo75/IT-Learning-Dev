<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT104 Week 3 Mission</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f3f8;color:#171334}.w{max-width:1180px;margin:auto;padding:16px}.hero{background:linear-gradient(120deg,#2856a6,#4b3670);color:#fff;padding:25px;border-radius:22px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.nav button,.btn{padding:12px;border:1px solid #ddd5e8;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.nav .on{background:#4b3670;color:#fff}.panel{background:#fff;border:1px solid #ddd5e8;border-radius:18px;padding:22px;min-height:560px}.choice{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:2px solid #ddd5e8;border-radius:11px;background:#fff;font-weight:700;cursor:pointer}.good{border-color:#14805e!important;background:#edf9f4!important}.bad{border-color:#b64040!important;background:#fff1f1!important}.scenario,.fb{padding:14px;border-radius:12px}.scenario{background:#f6f8ff;border-left:6px solid #2856a6}.fb{background:#f0edf7;margin-top:12px}.terminal,.code{background:#171c22;color:#baffbd;border-radius:13px;padding:16px;font-family:Consolas,monospace;white-space:pre-wrap}.row{display:flex;gap:8px;margin-top:10px}.row input,textarea{flex:1;padding:11px;border:1px solid #ddd5e8;border-radius:9px;font-family:Consolas,monospace}.bottom{display:flex;justify-content:space-between;margin-top:14px}.bottom a{text-decoration:none;font-weight:800;color:#4b3670}@media(max-width:900px){.nav{grid-template-columns:1fr 1fr}.row{flex-direction:column}}</style></head><body><div class=w><header class=hero><b>NCC · ITT104 · WEEK 3</b><h1>🧪 Development & Testing Command Center</h1><p>Retrieve → Plan → Build → Run → Debug → Explain → Verify</p></header><nav id=nav class=nav></nav><main id=app class=panel></main><div class=bottom><a href=index.html>← Week 3 Home</a><a href=review.html>🎮 Study Center</a></div></div><script>
const st=[['logic','🧠 Logic Lab'],['trans','🔄 Script Translator'],['ps','💻 PowerShell Console'],['auto','⚙️ Automation Mission'],['debug','🐞 Debug Lab'],['build','🛠️ Build Challenge']];let cur='logic',app=document.getElementById('app');function navd(){nav.innerHTML=st.map(s=>`<button class="${cur==s[0]?'on':''}" onclick="go('${s[0]}')">${s[1]}</button>`).join('')}function go(x){cur=x;navd();({logic,trans,ps,auto,debug,build}[x])()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function logic(){let q=pick([{q:'After the player chooses Rock, Paper, or Scissors, what should happen next?',a:'Generate the computer choice'},{q:'Why is “Play again?” a decision point?',a:'It branches based on Yes/No'},{q:'What can wrong sequence cause?',a:'Failure or incorrect output'}]);app.innerHTML=`<h2>🧠 Logic Lab</h2><div class=scenario>${q.q}</div><button class=choice onclick="ok(this,'${q.a}')">${q.a}</button><button class=choice onclick="no(this)">Skip directly to the end</button><button class=choice onclick="no(this)">Assume the computer fixes the logic</button><div id=fb class=fb>Use sequence, decisions, loops, and output.</div><button class=btn onclick=logic()>🔀 New Scenario</button>`}
function trans(){let x=pick([{t:'List files',b:'dir',p:'Get-ChildItem',y:'import os\nprint(os.listdir("."))'},{t:'Display a greeting',b:'echo Hello',p:'Write-Host "Hello"',y:'print("Hello")'},{t:'Store a name',b:'set name=Sam',p:'$name = "Sam"',y:'name = "Sam"'}]);app.innerHTML=`<h2>🔄 Script Translator</h2><div class=scenario><b>Task:</b> ${x.t}</div><h3>Batch</h3><div class=code>${x.b}</div><h3>PowerShell</h3><div class=code>${x.p}</div><h3>Python</h3><div class=code>${x.y}</div><button class=choice onclick="ok(this,'Correct: different environments can solve similar tasks with different syntax.')">Different scripting environments can solve similar tasks with different syntax.</button><button class=choice onclick="no(this)">Only one language can automate.</button><div id=fb class=fb>Compare intent, syntax, execution, and output.</div><button class=btn onclick=trans()>🔀 New Comparison</button>`}
const psc=[['List files in this folder.',['Get-ChildItem','dir','gci'],'Directory listing returned.'],['Show examples for Get-ChildItem.',['Get-Help Get-ChildItem -Examples'],'Help examples displayed.'],['Display environment variables.',['Get-ChildItem env:'],'Environment variables displayed.'],['Test 8.8.8.8.',['Test-Connection 8.8.8.8'],'Connectivity test successful.']];
function ps(){let x=pick(psc);window.psx=x;app.innerHTML=`<h2>💻 PowerShell Console</h2><div class=scenario>${x[0]}</div><div id=term class=terminal>PS C:\\Lab&gt;</div><div class=row><input id=cmd placeholder="Type command"><button class=btn onclick=run()>Run</button></div><div id=fb class=fb>Use an appropriate PowerShell cmdlet or accepted alias.</div><button class=btn onclick=ps()>🔀 New Command</button>`}
function run(){let v=cmd.value.trim(),x=psx,good=x[1].some(a=>a.toLowerCase()==v.toLowerCase());term.textContent=`PS C:\\Lab> ${v}\n${good?x[2]:'Command not accepted for this mission.'}`;fb.innerHTML=good?'✅ Correct. Explain what the command returned.':'❌ Check cmdlet spelling, Verb-Noun form, or parameters.'}
const autos=[['Network Recon','Collect IP, adapter, and route details, then export a report.','Get-NetIPAddress · Get-NetAdapter · Get-NetRoute · Out-File'],['Connectivity Troubleshooter','Loop through targets, test reachability, and summarize failures.','Test-Connection · foreach · Write-Warning'],['Local User Auditor','Collect local user data, flag risky accounts, export CSV.','Get-LocalUser · Export-Csv'],['Bulk File Organizer','Map extensions to folders, create folders, move files.','Get-ChildItem · New-Item · Move-Item']];
function auto(){let x=pick(autos);app.innerHTML=`<h2>⚙️ ${x[0]}</h2><div class=scenario>${x[1]}</div><p><b>Useful tools:</b> ${x[2]}</p><button class=choice onclick="ok(this,'Good plan: align the commands to the requested evidence and output.')">Build an evidence-based script and verify its output.</button><button class=choice onclick="no(this)">Run random commands until something changes.</button><div id=fb class=fb>Automation should reduce repetitive work and still be verifiable.</div><button class=btn onclick=auto()>🔀 New Mission</button>`}
const bugs=[['Get-ChildItem -Recurs','-Recurse'],['$name="Sam"\nWrite-Host $Namee','$name'],['Get-ChildItem | ForEach Object {$_.Name}','ForEach-Object'],['if ($age > 18) { Write-Host "Adult" }','-gt']];
function debug(){let x=pick(bugs);app.innerHTML=`<h2>🐞 Debug Lab</h2><div class=code>${x[0]}</div><h3>Which correction is needed?</h3><button class=choice onclick="ok(this,'Correct fix: ${x[1]}')">${x[1]}</button><button class=choice onclick="no(this)">Delete the whole script</button><div id=fb class=fb>Use syntax, variables, cmdlets, and parameters as evidence.</div><button class=btn onclick=debug()>🔀 New Bug</button>`}
const builds=[['Greeting Script','Store a name in $name and print a greeting.',['$name','Write-Host']],['Array Practice','Create $servers as a PowerShell array.',['$servers','@(']],['Pipeline Practice','List files and sort by Length.',['Get-ChildItem','Sort-Object','Length']],['Recursive Search','Use Get-ChildItem with recursive search.',['Get-ChildItem','-Recurse']]];
function build(){let x=pick(builds);window.bx=x;app.innerHTML=`<h2>🛠️ ${x[0]}</h2><div class=scenario>${x[1]}</div><textarea id=code placeholder="Write PowerShell here..."></textarea><button class=btn onclick=check()>Test My Script</button><button class=btn onclick=build()>🔀 New Build</button><div id=fb class=fb>Write, test, explain, and verify.</div>`}
function check(){let v=code.value.toLowerCase(),ok=bx[2].every(t=>v.includes(t.toLowerCase()));fb.innerHTML=ok?'✅ Core requirements detected. Now explain what output proves it worked.':'❌ One or more required ideas are missing.'}
function ok(b,m){b.classList.add('good');fb.innerHTML='✅ '+m}function no(b){b.classList.add('bad');fb.innerHTML='❌ Use the scenario evidence and Week 3 logic.'}
navd();logic();
</script></body></html>
