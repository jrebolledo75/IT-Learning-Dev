<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITT102 Week 3 Network Wall Challenge</title>
<style>
:root{--p:#4b3670;--b:#2456a6;--g:#14805e;--ink:#171334;--line:#ddd6eb;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:14px}.hero{background:linear-gradient(125deg,#173c70,#4b3670);color:white;padding:25px;border-radius:22px}.hero h1{margin:.2rem 0;font-size:clamp(2rem,5vw,3.4rem)}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.nav button,.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:12px;font-weight:850;cursor:pointer;min-height:48px}.nav button.on{background:var(--p);color:white}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:520px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tool,.node,.choice{border:2px solid var(--line);border-radius:15px;padding:15px;background:#fff;cursor:pointer;text-align:left}.tool.pick,.node.pick{border-color:var(--g);background:#edf9f5}.tool .ico{font-size:2.2rem}.bench{background:#e9edf3;border-radius:16px;padding:14px}.bag{border:2px dashed #8c7ba7;border-radius:16px;padding:14px;min-height:110px;background:#faf8fd}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.node{text-align:center;min-width:120px}.arrow{font-size:1.5rem}.tester,.terminal{font-family:ui-monospace,monospace;background:#182027;color:#8cffaa;border-radius:14px;padding:17px;white-space:pre-wrap}.wires{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.wire{min-height:95px;border-radius:12px;border:2px solid #aaa;display:grid;place-items:center;font-size:.75rem;font-weight:800;cursor:pointer;padding:4px}.wo{background:linear-gradient(90deg,#fff 50%,#f28c28 50%)}.o{background:#f28c28}.wg{background:linear-gradient(90deg,#fff 50%,#35a853 50%)}.b{background:#3478c8;color:#fff}.wb{background:linear-gradient(90deg,#fff 50%,#3478c8 50%)}.g{background:#35a853}.wbr{background:linear-gradient(90deg,#fff 50%,#8b5a2b 50%)}.br{background:#8b5a2b;color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-weight:800}.form input,.form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.ticket{border-left:6px solid #d6533c;background:#fff7f5;padding:16px;border-radius:12px}.feedback{margin-top:12px;padding:12px;border-radius:12px;background:#f2eef8}.bottom{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}.bottom a{text-decoration:none;color:var(--p);font-weight:850;background:white;border:1px solid var(--line);padding:11px 15px;border-radius:11px}.badge{display:inline-block;background:#fff3c4;color:#6c5100;border-radius:999px;padding:7px 11px;font-weight:850}.progress{height:10px;background:#ffffff44;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:#7dffad;width:0}.small{color:#6b6476}.keystone-ref{max-width:520px;width:100%;display:block;margin:14px auto;border-radius:18px;border:1px solid var(--line);box-shadow:0 8px 24px #0001}.guide{background:#eef7ff;border-left:5px solid var(--b);padding:14px;border-radius:12px;margin:12px 0}.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}@media(max-width:800px){.nav{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.wires{grid-template-columns:repeat(4,1fr)}.panel{padding:14px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class=wrap>
<header class=hero><div><b>NCC · ITT102 · WEEK 3</b></div><h1>🧱 Network Wall Challenge</h1><p>You are the network technician. Identify the tools, build the wall path, terminate the jack, bring the LAN online, then diagnose a real trouble ticket.</p><div class=progress><span id=bar></span></div><p><b id=pc>0 of 5 technician missions complete</b></p></header>
<nav class=nav id=nav></nav><main class=panel id=app></main>
<div class=bottom><a href="../../index.html">← Learning Hub</a><a href="review.html">🎯 Review Center</a></div></div>
<script>
const S=[['tools','🧰','Tool Crib'],['wall','🧱','Build Wall'],['term','🔧','Terminate'],['lan','🌐','LAN Online'],['ticket','🚨','Wall Is Dead']];let cur='tools',done=new Set(),app=document.getElementById('app');
function N(){nav.innerHTML=S.map(s=>`<button class="${cur==s[0]?'on':''}" onclick="go('${s[0]}')">${s[1]} ${s[2]}</button>`).join('')}function mark(x=cur){done.add(x);bar.style.width=(done.size*20)+'%';pc.textContent=`${done.size} of 5 technician missions complete`}function go(x){cur=x;N();({tools,wall,term,lan,ticket}[x])();scrollTo({top:130,behavior:'smooth'})}
const toolsData=[['🗜️','Punch-down tool','Seats conductors into IDC terminals on a keystone/patch panel',1],['🧪','Cable tester','Checks continuity and wire-map after termination',1],['✂️','Stripper/cutter','Prepares cable jacket and trims conductors',1],['🧩','Keystone jack','Terminates the horizontal cable at the wall outlet',1],['🧱','Wall plate','Mounts the keystone at the workstation',1],['🎛️','Patch panel','Organizes/terminates horizontal network runs in the closet',1],['🔀','Network switch','Connects devices within the LAN',1],['🌐','Router','Provides the LAN gateway and routes between networks',1],['🔗','Patch cable','Connects endpoint/wall or patch panel/switch',1],['🪛','Screwdriver','Mounts wall plate/hardware',1],['🔨','Hammer','Not a primary termination/testing tool for this mission',0],['🎨','Paint brush','Not needed to terminate or test the network run',0]];
let packed=new Set();function tools(){app.innerHTML=`<h2>🧰 Mission 1 · Pack Your Technician Bag</h2><p class=small>Work order: Install, terminate, connect, and verify a new Ethernet wall connection. Tap the tools/components you need. Tap again to remove.</p><div class=bench><div class=grid id=toolgrid></div></div><h3>Your Technician Bag</h3><div class=bag id=bag>Nothing packed yet.</div><div class=actions-row><button class=btn onclick=checkTools()>Check My Bag</button><button class=btn onclick="packed.clear();tools()">Reset Tool Crib</button></div><div id=fb class=feedback>Tip: select an item to see its purpose.</div>`;toolgrid.innerHTML=toolsData.map((t,i)=>`<button class="tool ${packed.has(i)?'pick':''}" onclick="pack(${i})"><div class=ico>${t[0]}</div><b>${t[1]}</b><br><small>${t[2]}</small></button>`).join('');drawBag()}
function pack(i){packed.has(i)?packed.delete(i):packed.add(i);tools()}function drawBag(){bag.innerHTML=packed.size?[...packed].map(i=>`${toolsData[i][0]} ${toolsData[i][1]}`).join(' · '):'Nothing packed yet.'}function checkTools(){let req=toolsData.map((x,i)=>x[3]?i:null).filter(x=>x!==null),bad=[...packed].filter(i=>!toolsData[i][3]),miss=req.filter(i=>!packed.has(i));if(!bad.length&&!miss.length){fb.innerHTML='✅ <b>Tool Crib cleared.</b> You can identify the equipment/components needed to install and verify the wall run.';mark()}else fb.innerHTML=`Keep checking the work order. ${miss.length} needed item(s) missing; ${bad.length} unnecessary item(s) packed.`}
const correct=['Laptop','Wall Jack / Keystone','In-wall Ethernet','Patch Panel','Patch Cable','Switch','Router'];let path=[];
function wall(){app.innerHTML=`<h2>🧱 Mission 2 · Build the Wall Path</h2><p>Tap components in the order a workstation connection travels from the endpoint through the structured cabling to the network.</p><div class=grid id=nodes></div><h3>Your path</h3><div class=flow id=flow></div><button class=btn onclick="path=[];wall()">Reset</button><button class=btn onclick=checkWall()>Test Link</button><div id=fb class=feedback>Think physical path first.</div>`;let shuffled=[...correct].sort(()=>Math.random()-.5);nodes.innerHTML=shuffled.map(n=>`<button class=node onclick="addNode('${n.replaceAll("'","")}')">${icon(n)}<br><b>${n}</b></button>`).join('');drawFlow()}
function icon(n){return n.includes('Laptop')?'💻':n.includes('Wall')?'🧩':n.includes('In-wall')?'〰️':n.includes('Panel')?'🎛️':n.includes('Patch Cable')?'🔗':n=='Switch'?'🔀':'🌐'}function addNode(n){if(!path.includes(n))path.push(n);drawFlow()}function drawFlow(){flow.innerHTML=path.length?path.map((n,i)=>`<span class=node>${icon(n)}<br>${n}</span>${i<path.length-1?'<span class=arrow>→</span>':''}`).join(''):'No components selected yet.'}function checkWall(){if(JSON.stringify(path)==JSON.stringify(correct)){fb.innerHTML='🟢 <b>LINK PATH VALID.</b> Laptop → wall jack → horizontal cable → patch panel → patch cable → switch → router.';mark()}else fb.innerHTML='🔴 Link path is not correct yet. Start at the workstation and trace each physical connection toward the gateway.'}
const order=['White/Orange','Orange','White/Green','Blue','White/Blue','Green','White/Brown','Brown'];let pins=[];
function term(){app.innerHTML=`<h2>🔧 Mission 3 · T568B Keystone Termination</h2><p>Use the real keystone reference below, then tap the conductors in <b>T568B pin order 1–8</b>. The simulator represents seating each conductor into the jack before testing the wire map.</p><img class=keystone-ref src="keystone-t568b-reference.png" alt="Ethernet keystone jack termination reference"><div class=guide><b>Technician sequence:</b> Strip only enough jacket to work safely → keep pair twists as close to the IDC slots as practical → follow the T568B color code printed on the jack → punch conductors fully into the IDC terminals → trim excess → test both ends before installing the faceplate.</div><div class=wires id=wirebank></div><h3>Simulated keystone pins 1–8</h3><div class=wires id=pins></div><div class=actions-row><button class=btn onclick="pins=[];term()">Reset Termination</button><button class=btn onclick=testCable()>🧪 Run Cable Tester</button></div><div class=tester id=tester>NETWORK CABLE TESTER\nMAIN:   1 2 3 4 5 6 7 8\nREMOTE: - - - - - - - -\nSTATUS: READY — terminate the jack, then test.</div>`;drawWires()}
function cls(n){return {'White/Orange':'wo','Orange':'o','White/Green':'wg','Blue':'b','White/Blue':'wb','Green':'g','White/Brown':'wbr','Brown':'br'}[n]}function drawWires(){wirebank.innerHTML=order.filter(x=>!pins.includes(x)).map(x=>`<button class="wire ${cls(x)}" onclick="pin('${x}')">${x}</button>`).join('')||'<b>All conductors placed.</b>';document.getElementById('pins').innerHTML=Array.from({length:8},(_,i)=>`<div class="wire ${pins[i]?cls(pins[i]):''}"><b>${i+1}</b><br>${pins[i]||'empty'}</div>`).join('')}function pin(x){if(pins.length<8){pins.push(x);drawWires()}}function testCable(){let ok=JSON.stringify(pins)==JSON.stringify(order);let map=Array.from({length:8},(_,i)=>pins[i]==order[i]?String(i+1):'X').join(' ');tester.textContent=ok?'NETWORK CABLE TESTER\nMAIN:   1 2 3 4 5 6 7 8\nREMOTE: 1 2 3 4 5 6 7 8\nSTATUS: PASS — straight-through T568B wire map verified.':'NETWORK CABLE TESTER\nMAIN:   1 2 3 4 5 6 7 8\nREMOTE: '+map+'\nSTATUS: FAIL — inspect the keystone color order and reseat incorrect conductors.';if(ok)mark()}
const lanScenarios=[
{title:'Front Office Expansion',story:'A new front-office wall drop must support a receptionist PC and secure staff Wi-Fi.',net:'192.168.10',gw:'192.168.10.1',mask:'255.255.255.0',start:'192.168.10.100',end:'192.168.10.150',stat:'192.168.10.50',ssid:'NCC-STAFF'},
{title:'Training Lab Pod',story:'A second training pod needs its own LAN. Keep the instructor test laptop outside the DHCP pool.',net:'192.168.20',gw:'192.168.20.1',mask:'255.255.255.0',start:'192.168.20.100',end:'192.168.20.150',stat:'192.168.20.50',ssid:'LAB-POD-B'},
{title:'Help Desk Bench',story:'The help-desk bench is isolated for troubleshooting practice. Configure addressing and secure wireless access.',net:'10.10.30',gw:'10.10.30.1',mask:'255.255.255.0',start:'10.10.30.100',end:'10.10.30.140',stat:'10.10.30.25',ssid:'HELPDESK-LAB'},
{title:'Small Branch Office',story:'A small branch has a new switch and router. Bring the wired clients and technician laptop online without conflicts.',net:'172.16.40',gw:'172.16.40.1',mask:'255.255.255.0',start:'172.16.40.100',end:'172.16.40.160',stat:'172.16.40.50',ssid:'BRANCH-STAFF'},
{title:'Student Practice LAN',story:'Build a clean practice LAN for a classroom pod. The router is the gateway and the test station remains static.',net:'192.168.50',gw:'192.168.50.1',mask:'255.255.255.0',start:'192.168.50.120',end:'192.168.50.180',stat:'192.168.50.40',ssid:'NET-PRACTICE'},
{title:'Admissions Office Upgrade',story:'Admissions added new workstations and a wireless printer. Configure a separate LAN and verify the gateway.',net:'192.168.60',gw:'192.168.60.1',mask:'255.255.255.0',start:'192.168.60.100',end:'192.168.60.170',stat:'192.168.60.30',ssid:'ADMISSIONS-NET'},
{title:'Faculty Workroom',story:'A faculty workroom needs secure Wi-Fi and DHCP for staff laptops while a support laptop keeps a static address.',net:'10.20.70',gw:'10.20.70.1',mask:'255.255.255.0',start:'10.20.70.80',end:'10.20.70.140',stat:'10.20.70.25',ssid:'FACULTY-SECURE'},
{title:'Skills Lab Expansion',story:'A new skills lab switch is connected to the router. Configure the LAN before students arrive.',net:'172.16.80',gw:'172.16.80.1',mask:'255.255.255.0',start:'172.16.80.100',end:'172.16.80.190',stat:'172.16.80.40',ssid:'SKILLS-LAB'},
{title:'Temporary Event Network',story:'A career event needs a temporary private LAN. DHCP serves guest devices while the technician station stays static.',net:'192.168.90',gw:'192.168.90.1',mask:'255.255.255.0',start:'192.168.90.110',end:'192.168.90.190',stat:'192.168.90.20',ssid:'NCC-EVENT'},
{title:'Network Closet Validation',story:'After recabling a closet, validate a fresh LAN before reconnecting production devices.',net:'10.30.100',gw:'10.30.100.1',mask:'255.255.255.0',start:'10.30.100.100',end:'10.30.100.160',stat:'10.30.100.35',ssid:'CLOSET-TEST'}];let li=-1,LS;
function newLan(){let n;do{n=Math.floor(Math.random()*lanScenarios.length)}while(n==li&&lanScenarios.length>1);li=n;LS=lanScenarios[n];lan()}
function lan(){if(!LS){li=Math.floor(Math.random()*lanScenarios.length);LS=lanScenarios[li]}app.innerHTML=`<h2>🌐 Mission 4 · Bring the LAN Online</h2><div class=guide><span class=badge>RANDOM NETWORK SCENARIO</span><h3>${LS.title}</h3><p>${LS.story}</p><b>Network:</b> ${LS.net}.0/24 &nbsp; | &nbsp; <b>SSID:</b> ${LS.ssid}<br><br><b>Technician objective:</b> Use the work order below to configure the router, DHCP service, technician laptop, and wireless security. Every time you choose <i>New Random Scenario</i>, you receive a different network ticket.</div><div class=guide><b>WORK ORDER</b><br>Gateway: <b>${LS.gw}</b><br>Subnet mask: <b>${LS.mask}</b><br>DHCP pool: <b>${LS.start} – ${LS.end}</b><br>Static technician laptop: <b>${LS.stat}</b><br>Wireless security requirement: <b>WPA2/WPA3</b></div><div class=form>
<label>Router / Default Gateway<input id=rip placeholder="Enter gateway"></label><label>Subnet Mask<input id=mask placeholder="Enter subnet mask"></label><label>DHCP Start<input id=ds placeholder="Enter first DHCP address"></label><label>DHCP End<input id=de placeholder="Enter last DHCP address"></label><label>Static Technician Laptop<input id=st placeholder="Enter assigned static address"></label><label>Wi-Fi Security<select id=sec><option>Choose</option><option>WEP</option><option>WPA2/WPA3</option><option>Open</option></select></label></div><div class=guide><b>Why these settings matter:</b><br>• <b>Gateway</b> is the router interface clients use to reach other networks.<br>• <b>Subnet mask</b> identifies which addresses belong to the local LAN.<br>• <b>DHCP</b> automatically leases addresses to clients.<br>• The <b>static technician address</b> is outside the DHCP pool to reduce address-conflict risk.<br>• <b>WPA2/WPA3</b> provides the secure wireless choice for this practice scenario.</div><div class=actions-row><button class=btn onclick=applyLan()>▶ Bring LAN Online</button><button class=btn onclick=resetLan()>↺ Reset Scenario</button><button class=btn onclick=newLan()>🔀 New Random Scenario</button></div><div class=terminal id=termout>NETWORK STATUS\nRouter LAN: 🔴 DOWN\nSwitch uplink: waiting\nDHCP: waiting\n${LS.ssid} Wi-Fi: waiting\n\nEnter the work-order values and bring the LAN online.</div>`}
function resetLan(){rip.value='';mask.value='';ds.value='';de.value='';st.value='';sec.value='Choose';termout.textContent=`NETWORK STATUS\nRouter LAN: 🔴 DOWN\nSwitch uplink: waiting\nDHCP: waiting\n${LS.ssid} Wi-Fi: waiting\n\nScenario reset. Reconfigure the same network ticket.`}
function applyLan(){let ok=rip.value.trim()==LS.gw&&mask.value.trim()==LS.mask&&ds.value.trim()==LS.start&&de.value.trim()==LS.end&&st.value.trim()==LS.stat&&sec.value=='WPA2/WPA3';termout.textContent=ok?`NETWORK STATUS\nRouter LAN: 🟢 UP\nSwitch uplink: 🟢 UP\nDHCP: ${LS.start} – ${LS.end} ACTIVE\nStatic technician: ${LS.stat}\n${LS.ssid} Wi-Fi: 🔒 SECURE\n\nPING ${LS.gw} ... Reply received.\nMISSION PASS — LAN ONLINE\n\nTry New Random Scenario to practice another network.`:`⚠ CONFIGURATION CHECK FAILED\n\nCompare your entries with the current work order.\nCheck: gateway → subnet mask → DHCP range → static address → WPA2/WPA3.`;if(ok)mark()}
function ticket(){ti=Math.floor(Math.random()*tickets.length);let t=tickets[ti];app.innerHTML=`<h2>🚨 Mission 5 · “The Wall Is Dead!”</h2><div class=ticket><b>TROUBLE TICKET #${1000+Math.floor(Math.random()*9000)}</b><p>${t[0]}</p></div><h3>What is your best first action?</h3><div id=choices>${t[1].map((x,i)=>`<button class=choice onclick="solve(${i},this)">${x}</button>`).join('')}</div><div id=fb class=feedback>Use evidence. Troubleshoot in order instead of changing random settings.</div><button class=btn onclick=ticket()>New Random Ticket</button>`}
function solve(i,b){let t=tickets[ti];[...choices.children].forEach(x=>x.disabled=true);if(i==t[2]){b.style.borderColor='#14805e';fb.innerHTML='✅ <b>Good diagnostic choice.</b> '+t[3]+'<br><br><b>Document:</b> Symptom → Evidence → Diagnosis → Repair → Verification.';mark()}else{b.style.borderColor='#b64040';fb.innerHTML='Not the best first step. '+t[3]}}
N();tools();
</script></body></html>
