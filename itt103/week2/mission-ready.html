<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ITT103 W2 Mission Ready</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f5f3f8;color:#17153d}.shell{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(125deg,#244f91,#56357e);color:white;border-radius:22px;padding:28px;margin:8px 0 18px}.hero h1{font-size:clamp(1.9rem,6vw,3.2rem);margin:.25rem 0}.eyebrow{text-transform:uppercase;font-size:.76rem;letter-spacing:.12em;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #ded8e8;border-radius:18px;padding:20px;box-shadow:0 8px 24px #2617440b}.btn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ded8e8;border-radius:12px;background:white;color:#17153d;padding:12px 15px;font-weight:800;cursor:pointer;text-decoration:none;min-height:46px}.primary{background:#51347f!important;color:white!important}.choices{display:grid;gap:10px;margin-top:14px}.choice{text-align:left;width:100%}.good{border-color:#157347!important;background:#eaf7f0!important}.bad{border-color:#b42318!important;background:#fff0ee!important}.feedback{padding:12px;border-radius:12px;margin-top:12px;background:#eeeaf6;line-height:1.5}.terminal{background:#111827;color:#d1fae5;border-radius:14px;padding:16px;font-family:monospace;white-space:pre-wrap}.nav,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.progress{height:9px;background:#e3deeb;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#078b98}.tab.active{background:#51347f;color:white}.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem}.jeo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.jeo button{background:#1d3d8f;color:white;border:0;min-height:60px}@media(max-width:650px){.jeo{grid-template-columns:repeat(2,1fr)}.btn,button{width:100%}.hero{padding:20px}}</style>
<main class=shell><section class=hero><div class=eyebrow>ITT103 WEEK 2 · MISSION READY</div><h1>🧰 “It’s Acting Weird”</h1><p>Gather evidence → diagnose the layer → choose the right tool → explain the next step.</p><b>Score: <span id=s>0</span>/5</b><div class=progress><span id=p></span></div></section><div class=card id=work><h2 id=t></h2><p id=q></p><div class=choices id=c></div><div class=feedback id=f hidden></div><pre class=terminal id=term hidden></pre><div class=nav><a class=btn href=index.html>← Home</a><button class=primary id=n disabled>Next Stage</button></div></div></main>
<script>
const data=[
{t:"Step 1 · Translate the Customer",items:[
["Everything was fine yesterday. Today it freezes and apps take forever to open.","Ask what changed since the last normal session and when the slowdown began.",["Immediately reinstall Windows.","Tell them to buy a new PC.","Say it is too old."],"Build a timeline and gather evidence before changing the system."],
["The internet is broken. Nothing works.","Clarify whether one app, one website, or the entire device has lost connectivity.",["Reset the PC.","Blame the ISP.","Disable security."],"Scope determines whether the issue is an app, service, or total connectivity problem."],
["I can't get into my account.","Ask what message appears and whether this is a password, lockout, or application-login problem.",["Ask them to tell you their password.","Create a new account.","Turn off security."],"Never request a user's password; identify the authentication symptom."],
["My files aren't where I left them.","Ask for the filename, expected folder, last known location, and whether cloud sync is involved.",["Assume disk failure.","Format the drive.","Delete temporary files."],"Trace the file before making destructive changes."],
["I can reach an IP address but not a website name.","Investigate name resolution and use nslookup to gather evidence.",["Replace the monitor.","Reinstall Windows.","Buy more RAM."],"IP reachability with failed names points toward DNS/name resolution."]
]},
{t:"Step 2 · OS Detective",items:[
["Microsoft desktop environment with Command Prompt, PowerShell and Task Manager.","Windows",["macOS","Linux","Solaris"],"Windows is the Microsoft desktop OS family."],
["Apple desktop computer environment.","macOS",["Windows","Linux","AIX"],"macOS is Apple's desktop operating system."],
["Environment using distributions such as Ubuntu or Mint.","Linux",["Windows","macOS","HP-UX"],"Mint and Ubuntu are Linux distributions."],
["A Unix-family example covered in the lesson.","Solaris",["Windows 11","Microsoft 365","Android app"],"Solaris is a Unix operating system."]
]},
{t:"Step 3 · Technician Command Console",items:[
["View Windows IP configuration.","ipconfig",["ping","hostname","netstat"],"ipconfig displays Windows IP configuration.","Ethernet adapter:\n IPv4 Address: 192.168.1.24\n Gateway: 192.168.1.1"],
["Test basic reachability to another host.","ping",["tracert","hostname","nslookup"],"ping is a quick reachability test.","Reply from 8.8.8.8: time=18ms TTL=116"],
["See the hop-by-hop route to a destination.","tracert",["ping","netstat","hostname"],"tracert reveals the route one hop at a time.","1  1ms 192.168.1.1\n2  8ms 10.20.0.1\n3 19ms destination"],
["Investigate hostname/DNS resolution.","nslookup",["netstat","hostname","ipconfig"],"nslookup queries name-resolution information.","Name: example.com\nAddress: 93.184.216.34"],
["Inspect active network connections.","netstat",["ping","hostname","tracert"],"netstat displays active network connections.","TCP 192.168.1.24:51542 ...:443 ESTABLISHED"],
["Identify the computer's host name.","hostname",["ping","nslookup","pathping"],"hostname displays the local host name.","LAB-PC-07"],
["Perform extended route and packet-loss analysis.","pathping",["hostname","ipconfig","netstat"],"pathping combines route discovery with longer statistical analysis.","Computing statistics...\nHop RTT Lost/Sent\n1 1ms 0/100\n2 15ms 4/100"]
]},
{t:"Step 4 · Find the Fault",items:[
["Only one application freezes; the desktop and other apps remain responsive.","Application",["Operating system","Network","File system"],"The symptom is isolated to one application."],
["Several apps freeze and the whole machine is sluggish.","Operating system",["Application","Network","File system"],"System-wide symptoms point more strongly toward the OS/system layer."],
["Websites fail and ping to the gateway fails.","Network",["Application","Operating system","File system"],"Failed gateway reachability is network evidence."],
["A user cannot find a file in the expected folder.","File system",["Application","Operating system","Network"],"Start with paths, folders, storage and file location."]
]},
{t:"Step 5 · Close the Ticket",items:[
["DNS lookup fails while IP connectivity works.","Your network connection is working, but the computer is having trouble translating website names. I'll check the name-resolution settings next.",["The recursive DNS pipeline is broken.","Your computer is ruined.","Restart repeatedly."],"Translate evidence into clear customer-facing language."],
["One application hangs while Windows remains responsive.","The computer itself is responding. The problem appears limited to this application, so I'll troubleshoot the app before changing Windows.",["Windows is definitely corrupt.","Delete everything.","It is the monitor."],"Explain scope and the next safe step."]
]}];
let stage=0,score=0,out="";
const rnd=a=>a[Math.floor(Math.random()*a.length)],sh=a=>[...a].sort(()=>Math.random()-.5);
function render(){if(stage===5){work.innerHTML=`<div class=eyebrow>MISSION COMPLETE</div><h2>🏆 ${score}/5</h2><p>${score==5?"Mastery — excellent evidence-based troubleshooting.":score>=4?"Near Mastery — strong work. Run another random mission.":"Review the missed concepts, then try again."}</p><button class=primary onclick=location.reload()>New Random Mission</button> <a class=btn href=review-interactive.html>Review Center</a>`;return}
let d=data[stage],x=rnd(d.items),ans=x[1];t.textContent=d.t;q.textContent=(stage===0?'Customer: “'+x[0]+'”':x[0]);f.hidden=true;term.hidden=true;n.disabled=true;n.textContent="Next Stage";out=x[4]||"";c.innerHTML="";
sh([ans,...x[2]]).forEach(v=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>{[...c.children].forEach(z=>{z.disabled=true;if(z.textContent===ans)z.classList.add("good")});if(v===ans){score++;b.classList.add("good")}else b.classList.add("bad");s.textContent=score;f.innerHTML=(v===ans?"✅ Correct. ":"❌ Best answer: <b>"+ans+"</b>. ")+x[3];f.hidden=false;n.disabled=false};c.appendChild(b)});p.style.width=(stage/5*100)+"%"}
n.onclick=()=>{if(stage===2&&out){term.textContent="$ simulated output\n"+out;term.hidden=false;out="";n.textContent="Continue";return}stage++;render()};render();
</script>
