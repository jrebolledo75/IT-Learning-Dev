<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ITT103 W2 Review</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f5f3f8;color:#17153d}.shell{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(125deg,#244f91,#56357e);color:white;border-radius:22px;padding:28px;margin:8px 0 18px}.hero h1{font-size:clamp(1.9rem,6vw,3.2rem);margin:.25rem 0}.eyebrow{text-transform:uppercase;font-size:.76rem;letter-spacing:.12em;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:white;border:1px solid #ded8e8;border-radius:18px;padding:20px;box-shadow:0 8px 24px #2617440b}.btn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ded8e8;border-radius:12px;background:white;color:#17153d;padding:12px 15px;font-weight:800;cursor:pointer;text-decoration:none;min-height:46px}.primary{background:#51347f!important;color:white!important}.choices{display:grid;gap:10px;margin-top:14px}.choice{text-align:left;width:100%}.good{border-color:#157347!important;background:#eaf7f0!important}.bad{border-color:#b42318!important;background:#fff0ee!important}.feedback{padding:12px;border-radius:12px;margin-top:12px;background:#eeeaf6;line-height:1.5}.terminal{background:#111827;color:#d1fae5;border-radius:14px;padding:16px;font-family:monospace;white-space:pre-wrap}.nav,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.progress{height:9px;background:#e3deeb;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#078b98}.tab.active{background:#51347f;color:white}.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem}.jeo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.jeo button{background:#1d3d8f;color:white;border:0;min-height:60px}@media(max-width:650px){.jeo{grid-template-columns:repeat(2,1fr)}.btn,button{width:100%}.hero{padding:20px}}</style>
<main class=shell><section class=hero><div class=eyebrow>ITT103 WEEK 2</div><h1>🎯 Review Center</h1><p>Operating systems · applications · file systems · Windows network commands · troubleshooting communication</p></section>
<div class=tabs><button class="tab active" onclick="show('study',this)">📖 Study Guide</button><button class=tab onclick="show('flash',this)">🃏 Flashcards</button><button class=tab onclick="show('jeo',this)">🎮 Jeopardy</button><button class=tab onclick="show('quiz',this)">📝 Practice Quiz</button><button class=tab onclick="show('ready',this)">🏆 Readiness</button></div><div id=a></div><div class=nav><a class=btn href=index.html>← Home</a><a class="btn primary" href=mission-ready.html>Mission Ready →</a></div></main>
<script>
const cards=[["Operating system","Manages computer resources and provides the environment for applications."],["Windows","Microsoft desktop operating-system family."],["macOS","Apple desktop operating system."],["Linux","Unix-like OS family distributed in versions called distributions."],["Application","Software that performs a user task."],["File system","Structure used to organize and locate files and folders."],["ipconfig","Displays Windows IP configuration."],["ipconfig /all","Displays expanded Windows adapter/configuration details."],["ping","Tests basic reachability."],["tracert","Shows a hop-by-hop route."],["netstat","Displays network connections/statistics."],["nslookup","Queries DNS/name-resolution information."],["hostname","Displays the computer's host name."],["pathping","Performs extended route/loss analysis."]];
const quiz=[
["Which command is the best quick reachability test?",["ping","hostname","netstat","ipconfig /all"],0,"ping tests basic reachability."],
["Which command shows a hop-by-hop route?",["nslookup","tracert","hostname","ipconfig"],1,"tracert traces the path."],
["Which command is most directly associated with DNS?",["netstat","pathping","nslookup","hostname"],2,"nslookup queries name resolution."],
["One app freezes while everything else works. First focus?",["Application","Replace PC","Monitor","Format disk"],0,"The symptom is scoped to one application."],
["Best first response to 'the internet is broken'?",["Reinstall Windows","Clarify what does and does not work","Replace router","Disable security"],1,"First narrow the scope."],
["Linux Mint is what?",["Windows version","Linux distribution","macOS tool","Network protocol"],1,"Mint is a Linux distribution."],
["Which command gives expanded Windows adapter details?",["ipconfig /all","hostname","ping","tracert"],0,"ipconfig /all provides expanded details."],
["Which command identifies the local computer name?",["hostname","nslookup","netstat","pathping"],0,"hostname displays the host name."],
["Which command helps inspect active network connections?",["netstat","hostname","ipconfig","tracert"],0,"netstat displays network connections."],
["Why gather evidence before reinstalling an OS?",["Reinstalling is illegal","To avoid unnecessary disruptive changes","OS never fails","Users prefer slowness"],1,"Evidence-based troubleshooting minimizes unnecessary changes."],
["Browser works but email app is offline. First focus?",["Application/service","Monitor","Keyboard","CPU"],0,"General connectivity works, so investigate the app/service."],
["What is distinctive about pathping?",["Changes passwords","Extended path/loss analysis that takes longer","Installs drivers","Only shows hostname"],1,"pathping performs longer route/statistical analysis."]
];
let mode="study",ci=0,qi=0,score=0,answered=false;
function show(m,b){mode=m;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function render(){if(mode==="study")a.innerHTML=`<div class=grid><div class=card><h3>1 · Diagnose by scope</h3><p>Ask what changed, when it began, and whether one app, the OS, network, or files are affected.</p></div><div class=card><h3>2 · Know the OS families</h3><p>Review Windows, macOS, Linux distributions, and Unix-family systems.</p></div><div class=card><h3>3 · Match tool to evidence</h3><p><b>ipconfig</b> configuration · <b>ping</b> reachability · <b>tracert</b> route · <b>netstat</b> connections · <b>nslookup</b> names · <b>hostname</b> computer name · <b>pathping</b> extended path/loss.</p></div><div class=card><h3>4 · Communicate professionally</h3><p>Turn evidence into clear language. Ask precise questions and never ask the user to reveal a password.</p></div></div>`;
if(mode==="flash"){let c=cards[ci];a.innerHTML=`<div class="card flash" onclick="document.getElementById('ans').hidden=!document.getElementById('ans').hidden"><div><div class=eyebrow>CARD ${ci+1}/${cards.length}</div><h2>${c[0]}</h2><p id=ans hidden>${c[1]}</p><small>Tap to reveal</small></div></div><div class=nav><button onclick="ci=(ci-1+cards.length)%cards.length;render()">← Previous</button><button class=primary onclick="ci=(ci+1)%cards.length;render()">Next →</button></div>`}
if(mode==="quiz"){let q=quiz[qi];a.innerHTML=`<div class=card><div class=eyebrow>QUESTION ${qi+1}/${quiz.length}</div><h2>${q[0]}</h2><div class=choices>${q[1].map((x,i)=>`<button class=choice onclick="answer(${i})">${x}</button>`).join("")}</div><div id=fb></div><div class=nav><b>Score ${score}</b><button id=next class=primary onclick=nextQ() disabled>Next</button></div></div>`;answered=false}
if(mode==="jeo"){let cats=["OS","Apps","Files","Commands","Troubleshoot"];a.innerHTML=`<div class=card><h2>Jeopardy Review Board</h2><p>Tap a value, answer as a team, then reveal.</p><div class=jeo>${cats.map(x=>`<button>${x}</button>`).join("")}${[200,400,600,800,1000].flatMap((v,r)=>cats.map((x,k)=>`<button onclick="j(${r},${k},this)">$${v}</button>`)).join("")}</div><div id=jf class=feedback hidden></div></div>`}
if(mode==="ready"){let best=+(localStorage.getItem("itt103w2best")||0);a.innerHTML=`<div class=card><div class=eyebrow>READINESS</div><h2>🏆 Best Practice Score: ${best}/${quiz.length}</h2><p>${best>=10?"Mission Ready — strong Week 2 command.":best>=8?"Near Mastery — review missed concepts and retry.":"Use Study Guide + Flashcards, then retake the quiz."}</p></div>`}}
function answer(i){if(answered)return;answered=true;let q=quiz[qi],bs=document.querySelectorAll(".choice");bs.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add("good")});if(i===q[2])score++;else bs[i].classList.add("bad");fb.innerHTML=`<div class=feedback>${i===q[2]?"✅ Correct.":"❌ Correct: <b>"+q[1][q[2]]+"</b>."} ${q[3]}</div>`;next.disabled=false}
function nextQ(){qi++;if(qi>=quiz.length){localStorage.setItem("itt103w2best",Math.max(score,+(localStorage.getItem("itt103w2best")||0)));mode="ready";document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab")[4].classList.add("active");render()}else render()}
const jd=[[["Microsoft desktop OS family?","Windows"],["Software for a user task?","Application"],["Organizes stored files/folders?","File system"],["Quick reachability command?","ping"],["First move with a vague complaint?","Clarify symptom and scope."]],[["Apple desktop OS?","macOS"],["One app hangs, OS works: focus?","Application"],["Before deleting for low storage?","Inspect usage first."],["Windows IP config command?","ipconfig"],["Why build a timeline?","Identify changes and narrow causes."]],[["Mint is what?","Linux distribution"],["Browser works, email app offline: focus?","Email app/service"],["Missing file: confirm what?","Name, expected folder, last location, sync context."],["Hop-by-hop route?","tracert"],["Why avoid immediate reinstall?","Gather evidence; reinstall is disruptive."]],[["Solaris belongs to what family?","Unix"],["Single app vs system-wide symptoms help determine what?","Problem scope/layer"],["Files and folders are organized by?","File system"],["DNS query command?","nslookup"],["Never ask user to reveal?","Password"]],[["Whole system freezes: likely layer?","Operating system/system"],["Program won't launch but Windows works?","Application"],["What command shows active connections?","netstat"],["Extended route/loss command?","pathping"],["Best ticket closeout?","Clear evidence + next step in customer-friendly language."]]];
function j(r,k,b){let d=jd[r][k];jf.hidden=false;jf.innerHTML=`<b>${d[0]}</b><br><button onclick="this.outerHTML='<p><b>Answer:</b> ${d[1]}</p>'">Reveal Answer</button>`;b.disabled=true;b.textContent="✓"}render();
</script>
