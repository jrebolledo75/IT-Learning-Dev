<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT103 Week 2 Adventure</title><style>
:root{--ink:#17153d;--purple:#51347f;--blue:#2856a6;--teal:#078b98;--orange:#f27516;--bg:#f5f3f8;--card:#fff;--muted:#6d6878;--line:#ded8e8;--good:#157347;--bad:#b42318;--term:#101827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}.shell{max-width:1120px;margin:auto;padding:14px}.hero{background:linear-gradient(125deg,#244f91,#56357e);color:white;border-radius:24px;padding:28px;margin:8px 0 16px}.hero h1{font-size:clamp(2rem,6vw,3.35rem);margin:.25rem 0}.hero p{max-width:850px;line-height:1.55}.eyebrow{text-transform:uppercase;font-size:.76rem;letter-spacing:.12em;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 8px 24px #2617440b}.card h2,.card h3{margin-top:0}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:12px 15px;font-weight:800;cursor:pointer;text-decoration:none;min-height:46px}.primary{background:var(--purple)!important;color:white!important;border-color:var(--purple)!important}.muted{color:var(--muted)}.choices{display:grid;gap:9px;margin-top:12px}.choice{text-align:left;width:100%}.good{border-color:var(--good)!important;background:#eaf7f0!important}.bad{border-color:var(--bad)!important;background:#fff0ee!important}.feedback{padding:12px;border-radius:12px;margin-top:12px;background:#eeeaf6;line-height:1.5}.terminal{background:var(--term);color:#d1fae5;border-radius:14px;padding:16px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;min-height:120px}.nav,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.progress{height:10px;background:#e3deeb;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--teal);transition:.3s}.station{position:relative;overflow:hidden}.station .num{font-size:2.4rem;font-weight:950;opacity:.12;position:absolute;right:15px;top:8px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eee9f7;font-size:.78rem;font-weight:800}.dirgrid,.permgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.dir{min-height:90px}.permrow{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:7px;align-items:center;margin:7px 0}.toggle.on{background:#51347f;color:white}.ai{border-left:5px solid var(--teal)}.warning{background:#fff4e8;border:1px solid #f5c38e;padding:12px;border-radius:12px}.score{font-weight:900}.tiny{font-size:.85rem}.hidden{display:none!important}
@media(max-width:650px){.shell{padding:9px}.hero{padding:20px}.btn,button{width:100%;font-size:1rem}.permrow{grid-template-columns:1fr 1fr 1fr 1fr}.grid{grid-template-columns:1fr}.nav>*{flex:1 1 100%}}
</style></head><body><main class="shell"><section class="hero"><div class="eyebrow">ITT103 WEEK 2 · HANDS-ON PRACTICE</div><h1>🐧 Systems Administrator Adventure</h1><p>Five core stations + one optional AI bonus. Every station can be replayed for a new scenario.</p><div class="progress"><span id="prog" style="width:0%"></span></div><b>Stations completed: <span id="done">0</span>/5</b></section>
<div class="tabs"><button onclick="go('commands')">🐧 Commands</button><button onclick="go('filesystems')">💾 File Systems</button><button onclick="go('directories')">🗂️ Directories</button><button onclick="go('permissions')">🔐 Permissions</button><button onclick="go('admin')">🛡️ Admin</button><button onclick="go('ai')">🤖 AI Bonus</button></div><section id="app"></section><div class="nav"><a class="btn" href="index.html">← Week 2 Home</a><a class="btn" href="review-interactive.html">Review Center</a></div></main>
<script>
const S=JSON.parse(localStorage.getItem('itt103w2stations')||'{}');const rnd=a=>a[Math.floor(Math.random()*a.length)],sh=a=>[...a].sort(()=>Math.random()-.5);function save(k){S[k]=1;localStorage.setItem('itt103w2stations',JSON.stringify(S));status()}function status(){let n=['commands','filesystems','directories','permissions','admin'].filter(x=>S[x]).length;done.textContent=n;prog.style.width=(n/5*100)+'%'}function pick(title,prompt,ans,wrong,why,onok){app.innerHTML=`<div class=card><div class=eyebrow>${title}</div><h2>${prompt}</h2><div class=choices id=ch></div><div class=feedback id=fb hidden></div><div class=nav><button onclick="render(location.hash.slice(1)||'commands')">🔄 New Random Scenario</button></div></div>`;sh([ans,...wrong]).forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{[...ch.children].forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add('good')});if(v===ans){b.classList.add('good');if(onok)onok()}else b.classList.add('bad');fb.hidden=false;fb.innerHTML=(v===ans?'✅ Correct. ':'❌ Best answer: <b>'+ans+'</b>. ')+why};ch.appendChild(b)})}
const commands=[
['Create a practice directory named linux_lab.','mkdir linux_lab',['cd linux_lab','ls linux_lab','rm linux_lab'],'mkdir creates a new directory.'],['Move into the linux_lab directory.','cd linux_lab',['mkdir linux_lab','pwd linux_lab','cat linux_lab'],'cd changes the current working directory.'],['Display the current directory contents.','ls',['cd','mkdir','rm'],'ls lists directory contents.'],['Write “This is file one.” into file1.txt.','echo "This is file one." > file1.txt',['cat file1.txt','mkdir file1.txt','cd file1.txt'],'The echo command with > writes output into the file.'],['Display the contents of file1.txt.','cat file1.txt',['mv file1.txt','rm file1.txt','cd file1.txt'],'cat displays file contents.'],['Rename file3.txt to final.txt.','mv file3.txt final.txt',['cp final.txt file3.txt','rm file3.txt','mkdir final.txt'],'mv is used to move or rename files.'],['Create an archive subdirectory.','mkdir archive',['mv archive','cat archive','rm archive'],'mkdir creates the archive directory.'],['Move file2.txt and final.txt into archive/.','mv file2.txt final.txt archive/',['cp archive/ file2.txt','cd file2.txt final.txt','rm archive/'],'mv can move multiple named files into a directory.'],['After leaving linux_lab, remove the lab directory and its contents.','rm -r linux_lab',['rm linux_lab','cat linux_lab','mv -r linux_lab'],'rm -r recursively removes a directory tree; use carefully and verify location first.']];
const fs=[
['A Windows workstation needs permissions, security features, and journaling on its main drive.','NTFS',['FAT32','APFS','ext4'],'NTFS is the primary Windows-oriented choice here; Week 2 material specifically emphasizes NTFS journaling as a protection against corruption.'],['A modern Mac needs its native Apple file system.','APFS',['NTFS','FAT32','ext4'],'APFS is Apple's modern file system. This is a comparison/enrichment item.'],['A Linux system needs a common native Linux file system.','ext4',['NTFS','APFS','FAT32'],'ext4 is a common Linux file system. This is a comparison/enrichment item.'],['A small removable device needs broad legacy compatibility and no single file above 4 GB.','FAT32',['NTFS','APFS','ext4'],'FAT32 is widely compatible but has a 4 GB single-file limit. This is comparison/enrichment.'],['A removable drive must move large files between current Windows and macOS systems.','exFAT',['FAT32','ext4','APFS'],'exFAT is commonly used for cross-platform removable storage with large files. This is comparison/enrichment.']];
const dirs=[
['Where do normal users typically keep personal home directories?','/home',['/etc','/var','/boot'],'/home contains normal users' home directories.'],['Where would you look first for system-wide configuration files?','/etc',['/home','/tmp','/boot'],'/etc commonly stores system configuration.'],['Which directory commonly contains changing data such as logs?','/var',['/boot','/home','/root'],'/var contains variable data such as logs.'],['Which directory is the root user's home?','/root',['/home','/usr','/tmp'],'/root is the root account's home directory.'],['Which directory is used for temporary files?','/tmp',['/etc','/boot','/root'],'/tmp is used for temporary files.'],['Which directory contains files used during boot?','/boot',['/var','/home','/tmp'],'/boot contains boot-related files.'],['Which path is a common location for user commands/programs?','/usr/bin',['/home/bin','/var/bin','/boot/bin'],'/usr/bin is a common executable location and appears in Unix/Linux PATH examples.']];
const admin=[
['A new employee needs a Linux account. What should the administrator do conceptually first?','Verify current identity/privilege, then create the account with the minimum required access.',['Give everyone administrator access.','Share an existing account.','Disable passwords for convenience.'],'Week 2 emphasizes checking identity/privilege and treating accounts as security identities.'],['An employee is on extended leave and access should temporarily stop without losing account information.','Lock/disable the account and verify its state.',['Immediately delete all data.','Give the password to a manager.','Add the account to an admin group.'],'Locking can preserve the identity while preventing access; removal is appropriate when the account is no longer needed.'],['A user needs access provided by a group. What principle should guide the change?','Add only the group membership/privilege required for the job.',['Make the user root.','Give all users the same access.','Disable file permissions.'],'Apply least privilege and verify the account state after modification.'],['A password must be managed for a user account. What is the safe administrator habit?','Use the account-management process, protect the password, and verify account state.',['Ask the user to email the password.','Store passwords in a shared text file.','Reuse one password for all users.'],'Passwords are part of identity and access security; do not expose or share them.'],['A former employee account is no longer needed.','Confirm the account/data requirements, remove the account appropriately, and verify.',['Leave unused privileged accounts forever.','Convert it to a shared login.','Give it a simple password.'],'Unused or over-privileged accounts increase risk.']];
function command(){let x=rnd(commands);pick('STATION 1 · COMMAND QUEST',x[0],x[1],x[2],x[3],()=>save('commands'))}
function filesystems(){let x=rnd(fs);pick('STATION 2 · FILE SYSTEM ARENA',x[0],x[1],x[2],x[3],()=>save('filesystems'))}
function directories(){let x=rnd(dirs);pick('STATION 3 · DIRECTORY EXPEDITION',x[0],x[1],x[2],x[3],()=>save('directories'))}
function permissions(){let qs=[['Current: -rw-r--r--. Give the user execute permission.','chmod u+x text1.txt',['chmod o-w text1.txt','chmod a+r text1.txt','rm text1.txt'],'The expected user bits become rwx: -rwxr--r--.'],['Remove write permission from others on final.txt.','chmod o-w final.txt',['chmod u+x final.txt','chmod a+r final.txt','chmod o+w final.txt'],'o-w removes write permission from others.'],['Give everyone read permission on text1.txt.','chmod a+r text1.txt',['chmod u+x text1.txt','chmod o-w text1.txt','chmod a-r text1.txt'],'a+r adds read permission for all classes.'],['Before running chmod, what should a technician do?','Read the current permission string, predict the change, then verify afterward with ls -l.',['Change permissions until the error disappears.','Give everyone rwx.','Always run sudo first.'],'Week 2 explicitly uses predict → change → verify and asks who actually needs access.']];let x=rnd(qs);pick('STATION 4 · PERMISSIONS VAULT',x[0],x[1],x[2],x[3],()=>save('permissions'))}
function adminmission(){let x=rnd(admin);pick('STATION 5 · ADMINISTRATOR MISSION',x[0],x[1],x[2],x[3],()=>save('admin'))}
function ai(){let qs=[['A Linux script returns Permission denied. Which AI prompt best supports safe troubleshooting?','“I am on Linux. backup.sh returns Permission denied. ls -l shows -rw-r--r--. Explain the likely cause, suggest a low-risk check/change, and explain it before I execute anything.”',['“Fix Linux.”','“Give me a sudo command that fixes everything.”','“Run whatever commands you want.”'],'Good AI use supplies evidence and asks for explanation before action.'],['An AI assistant says: “Use sudo for every command so permissions never block you.” What should you do?','Reject it; elevated privilege should be used only when required, and the recommendation violates least privilege.',['Accept it because AI is faster.','Make every user an administrator.','Disable permissions.'],'The technician remains responsible for validating AI output and applying least privilege.'],['AI suggests deleting a directory with rm -r, but you are unsure of your current location.','Do not execute yet; verify pwd/ls and confirm the target first.',['Execute immediately.','Add sudo to make it safer.','Ignore the target path.'],'Destructive commands require context and verification.']];let x=rnd(qs);pick('BONUS · AI TECHNICIAN COPILOT',x[0],x[1],x[2],x[3]+' <div class="warning"><b>AI workflow:</b> Ask → Verify → Decide → Execute → Observe. AI is assistance, not authority.</div>')}
function render(k){({commands:command,filesystems, directories,permissions,admin:adminmission,ai}[k]||command)()}function go(k){location.hash=k;render(k)}window.onhashchange=()=>render(location.hash.slice(1)||'commands');status();render(location.hash.slice(1)||'commands');
</script></body></html>
