<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ITT103 Week 3 Review Arena</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f1f8;color:#17132f}.wrap{max-width:950px;margin:auto;padding:25px}.hero{background:linear-gradient(120deg,#2856a6,#4b3670);color:#fff;padding:28px;border-radius:22px}.top{display:flex;justify-content:space-between;gap:10px}.q{background:white;border-radius:18px;padding:24px;margin-top:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.a{padding:18px;border:0;border-radius:14px;font-size:16px;font-weight:800;color:white;cursor:pointer}.a:nth-child(1){background:#b52c37}.a:nth-child(2){background:#2263aa}.a:nth-child(3){background:#b48313}.a:nth-child(4){background:#278050}.feedback{padding:15px;border-radius:12px;margin-top:15px;background:#eee}.btn{background:#4b3670;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:650px){.answers{grid-template-columns:1fr}}</style></head><body><div class='wrap'><div class='hero'><div class='top'><strong>🎯 ITT103 WEEK 3 • REVIEW ARENA</strong><button class='btn' onclick="location.href='index.html'">Home</button></div><h1>Kahoot-Style Mastery Challenge</h1><p>10 randomized questions • balanced across software, support, prompting, machine learning, and responsible AI.</p><div class='top'><span id='progress'>Question 1/10</span><span>Score: <b id='score'>0</b> • Streak: <b id='streak'>0</b></span></div></div><div class='q'><h2 id='question'></h2><div id='answers' class='answers'></div><div id='feedback' class='feedback' style='display:none'></div><button id='next' class='btn' style='display:none;margin-top:14px' onclick='nextQ()'>Next Question →</button></div></div><script>
const bank={software:[['Which term describes a small code release intended to fix an immediate problem?','Patch',['Patch','Major release','Beta test','Firmware'],'A patch alters existing installed code to fix an immediate issue.'],['Why can software compiled for Windows fail on Linux even on a similar processor?','OS compatibility',['OS compatibility','Screen size','File name','Keyboard layout'],'Software compilation can target a specific operating system.'],['Which is application software?','Spreadsheet program',['Spreadsheet program','RAM module','SSD','Motherboard firmware'],'Application software helps users perform tasks.']],support:[['An app requires more RAM than the PC has. What should you check?','Hardware requirements',['Hardware requirements','Wallpaper','Printer paper','Browser favorites'],'Software compatibility includes hardware/resource requirements.'],['A required background service is stopped. What should a technician inspect?','System services',['System services','Mouse sensitivity','Desktop theme','Recycle Bin'],'Services can be dependencies for applications.']],prompt:[['Which change usually makes a prompt more useful?','Add context and a specific goal',['Add context and a specific goal','Remove all details','Use fewer meaningful words','Avoid stating the desired result'],'Clear context and goals help guide the response.'],['“My computer won’t work” is primarily what kind of prompt?','Vague',['Vague','Detailed','Labeled dataset','Firmware'],'It lacks context, symptoms, constraints, and a desired output.']],ml:[['In supervised learning, what is a label?','The known category/output for a training example',['The known category/output for a training example','A physical cable','A software license','A BIOS password'],'Labels tell the model the intended class/output during training.'],['Why can an unbalanced dataset be a problem?','It can distort model predictions',['It can distort model predictions','It increases monitor brightness','It patches Windows','It upgrades RAM'],'Training data influences model behavior and can introduce bias.']],ai:[['AI gives a confident diagnosis without evidence. Best technician response?','Verify with real system evidence',['Verify with real system evidence','Accept automatically','Replace random hardware','Ignore the user'],'AI output should be evaluated and verified.'],['Why does human verification matter when using AI for IT support?','AI can be incomplete, wrong, or biased',['AI can be incomplete, wrong, or biased','AI always deletes files','Humans cannot use software','AI has physical tools'],'Technicians remain responsible for evidence-based decisions.']]};
let qs=[],i=0,score=0,streak=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function build(){qs=[...shuffle(bank.software).slice(0,2),...shuffle(bank.support).slice(0,2),...shuffle(bank.prompt).slice(0,2),...shuffle(bank.ml).slice(0,2),...shuffle(bank.ai).slice(0,2)];qs=shuffle(qs)}function render(){locked=false;let q=qs[i];progress.textContent=`Question ${i+1}/10`;question.textContent=q[0];answers.innerHTML='';shuffle(q[2]).forEach(x=>{let b=document.createElement('button');b.className='a';b.textContent=x;b.onclick=()=>answer(x);answers.appendChild(b)});feedback.style.display='none';next.style.display='none'}function answer(x){if(locked)return;locked=true;let q=qs[i],ok=x===q[1];if(ok){score+=100+streak*20;streak++}else streak=0;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;feedback.style.display='block';feedback.innerHTML=(ok?'✅ <b>Correct!</b> ':'❌ <b>Not quite.</b> ')+q[3];next.style.display='inline-block'}function nextQ(){i++;if(i<10)render();else{question.textContent='Mission complete!';answers.innerHTML='';feedback.style.display='block';feedback.innerHTML=`Final score: <b>${score}</b>. Replay for a newly randomized balanced round.`;next.textContent='↻ Play Again';next.style.display='inline-block';next.onclick=()=>location.reload()}}build();render();</script></body></html>
