<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT101 Week 3 Review Center</title>
<style>
:root{--ink:#171334;--p:#4b3670;--line:#ddd6eb;--bg:#f4f3f8}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--ink)}.w{max-width:1080px;margin:auto;padding:14px}.hero{padding:24px;background:linear-gradient(120deg,#2856a6,#4b3670);color:#fff;border-radius:20px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.tabs button,.btn{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:900;cursor:pointer}.tabs .on{background:var(--p);color:#fff}.panel{background:#fff;border:1px solid var(--line);padding:20px;min-height:560px;border-radius:20px}.flash{min-height:320px;border-radius:22px;background:linear-gradient(145deg,#fff,#f2edfa);border:2px solid #d7cce8;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer}.flash .ico{font-size:4rem}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{color:white;border:0;border-radius:16px;padding:18px;min-height:92px;font-size:1.05rem;font-weight:900;cursor:pointer}.a0{background:#d44343}.a1{background:#1689c9}.a2{background:#d9a520}.a3{background:#159466}.feedback{padding:14px;margin-top:12px;border-radius:12px;background:#f0edf7}.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);border-radius:14px;padding:15px}.pill{padding:8px 11px;border-radius:999px;background:#eee9f6;font-weight:900}.gamebar{display:flex;gap:8px;flex-wrap:wrap}.bottom{margin:17px 0}.bottom a{text-decoration:none;color:var(--p);font-weight:900;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-right:8px}@media(max-width:720px){.tabs,.answers,.guide{grid-template-columns:1fr 1fr}.answers,.guide{grid-template-columns:1fr}}</style></head><body><div class=w>
<header class=hero><b>NCC · ITT101 · WEEK 3</b><h1>🎮 Help Desk Review Arena</h1><p>Fast retrieval practice for troubleshooting, ticketing, customer service, and Week 2 number-system recall.</p></header><nav class=tabs id=tabs></nav><main class=panel id=app></main><div class=bottom><a href='mission-ready.html'>← Help Desk Command Center</a><a href='../../index.html'>Learning Hub</a></div></div>
<script>
const sections=[['study','📘','Rapid Guide'],['flash','🧠','Flashcards'],['game','⚡','Challenge'],['ready','🚀','Readiness']];let current='study',app=document.getElementById('app');
function navDraw(){tabs.innerHTML=sections.map(s=>`<button class="${current===s[0]?'on':''}" onclick="show('${s[0]}')">${s[1]} ${s[2]}</button>`).join('')}function show(x){current=x;navDraw();({study,flash,game,ready}[x])()}
function study(){app.innerHTML=`<h2>📘 Rapid Study Guide</h2><div class=guide><div class=card><h3>7-Step Troubleshooting Flow</h3><p>Identify → Theory → Test → Plan → Implement → Verify → Document.</p></div><div class=card><h3>Identify</h3><p>Gather information, reproduce if possible, observe symptoms, check common issues, document, use tools, confirm the problem.</p></div><div class=card><h3>Testing</h3><p>Use safe, simple, least-invasive tests first and document expected versus actual results.</p></div><div class=card><h3>Ticketing</h3><p>Organized issue tracking, accountability, documentation, communication, prioritization, and knowledge reuse.</p></div><div class=card><h3>Soft Skills</h3><p>Active listening, professional speaking, empathy, calmness under pressure, and problem-solving.</p></div><div class=card><h3>Week 2 Retrieval</h3><p>Decimal 93 = binary 01011101 = hexadecimal 5D = octal 135.</p></div></div>`}
const cards=[['🎧','Active Listening','Ask clarifying/open-ended questions and do not jump to a fix.'],['🔎','Identify the Problem','Gather facts and confirm what is actually wrong.'],['🧠','Theory of Probable Cause','A testable explanation based on evidence.'],['🧪','Test the Theory','Use safe, simple, targeted tests and document results.'],['✅','Verify Full Functionality','Prove the issue is resolved and check for additional problems.'],['📝','Documentation','Record problem, tests, solution, verification, and feedback.'],['🎫','Ticketing System','Organizes support work, priority, accountability, communication, and knowledge.'],['💬','Empathy','Acknowledge user impact while staying professional.'],['🔢','Binary 93','01011101'],['#️⃣','Hexadecimal 93','5D'],['8️⃣','Octal 93','135']];let fi=0,reveal=false;
function flash(){reveal=false;drawFlash()}function drawFlash(){let c=cards[fi];app.innerHTML=`<h2>🧠 Flashcard Power Round</h2><div class=flash onclick="reveal=!reveal;drawFlash()"><div>${reveal?`<div class=ico>✅</div><h2>${c[2]}</h2>`:`<div class=ico>${c[0]}</div><h2>${c[1]}</h2><p>Tap to reveal</p>`}</div></div><p style='text-align:center'><b>${fi+1}/${cards.length}</b></p><div style='text-align:center'><button class=btn onclick="fi=(fi+cards.length-1)%cards.length;reveal=false;drawFlash()">←</button><button class=btn onclick="cards.sort(()=>Math.random()-.5);fi=0;reveal=false;drawFlash()">🔀 Shuffle</button><button class=btn onclick="fi=(fi+1)%cards.length;reveal=false;drawFlash()">→</button></div>`}
const bank=[
['What is the first troubleshooting step?',['Implement a solution','Identify the problem','Document the solution','Replace hardware'],1,'Troubleshooting begins by identifying and confirming the problem.'],
['After establishing a theory of probable cause, what comes next?',['Test the theory','Close the ticket','Buy hardware','Escalate automatically'],0,'The theory must be tested before choosing a solution.'],
['Which test should usually be attempted first?',['Most invasive','Simplest useful test','Full reinstall','Random changes'],1,'Start with the simplest, least invasive useful test.'],
['Why verify full system functionality?',['Make ticket longer','Prove issue is resolved and no new issue exists','Avoid documentation','Blame user'],1,'Verification confirms the fix and system function.'],
['Which is a major ticketing-system benefit?',['No communication needed','Organized issue tracking and documentation','Automatic hardware repair','No incidents'],1,'Ticketing supports tracking, accountability, prioritization, and communication.'],
['Which response best demonstrates active listening?',['Restart it.','What happened, when did it start, and did anything change?','You caused this.','I know the problem.'],1,'Open-ended questions gather facts professionally.'],
['Binary 11010110 equals which hexadecimal value?',['D5','B6','D6','A6'],2,'1101 = D and 0110 = 6, so D6.'],
['1010 0011 in hexadecimal is…',['A2','A3','B3','B4'],1,'1010 = A and 0011 = 3.'],
['Hexadecimal 1C equals which binary value?',['00011100','00110000','00001111','00001100'],0,'1 = 0001 and C = 1100.'],
['Decimal 45 in binary is…',['101101','100101','110101','101011'],0,'32 + 8 + 4 + 1 = 45.'],
['Decimal 156 in binary is…',['10011100','10101100','10010100','11001100'],0,'The supplied quiz answer is 10011100.'],
['Binary 0101 1110 in hexadecimal is…',['4E','5E','4F','5F'],1,'0101 = 5 and 1110 = E.']
];let qs=[],qi=0,score=0,streak=0;
function game(){qs=[...bank].sort(()=>Math.random()-.5).slice(0,10);qi=0;score=0;streak=0;drawQ()}function drawQ(){if(qi>=qs.length){app.innerHTML=`<h2>🏁 Challenge Complete</h2><div class=flash><div><div class=ico>${score>=8?'🏆':'🔁'}</div><h2>${score}/10</h2><button class=btn onclick=game()>Replay Random Challenge</button></div></div>`;return}let q=qs[qi];app.innerHTML=`<div class=gamebar><span class=pill>Question ${qi+1}/10</span><span class=pill>Score ${score}</span><span class=pill>🔥 Streak ${streak}</span></div><h2 style='text-align:center'>${q[0]}</h2><div class=answers>${q[1].map((x,i)=>`<button class="answer a${i}" onclick="ans(${i},this)">${['▲','◆','●','■'][i]} ${x}</button>`).join('')}</div><div id=fb class=feedback>Choose your answer.</div>`}
function ans(i,b){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);let q=qs[qi];if(i===q[2]){score++;streak++;fb.innerHTML='✅ '+q[3]}else{streak=0;fb.innerHTML='❌ '+q[3]}setTimeout(()=>{qi++;drawQ()},1000)}
function ready(){app.innerHTML=`<h2>🚀 Mission Readiness</h2><div class=guide><div class=card><h3>Explain</h3><p>Can you explain the seven troubleshooting stages in order?</p></div><div class=card><h3>Demonstrate</h3><p>Can you separate symptom from theory, choose a safe test, implement a targeted fix, and verify it?</p></div><div class=card><h3>Communicate</h3><p>Can you use active listening, professional speaking, empathy, calmness, and problem-solving?</p></div><div class=card><h3>Document</h3><p>Can another technician understand your ticket notes?</p></div></div>`}
navDraw();study();
</script></body></html>
