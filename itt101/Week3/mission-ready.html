<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITT101 Week 3 Help Desk Command Center</title>
<style>
:root{--ink:#171334;--purple:#4b3670;--blue:#2856a6;--green:#14805e;--red:#b64040;--line:#ded8ea;--bg:#f6f7fb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:14px}.hero{background:linear-gradient(125deg,#173c70,#4b3670);color:#fff;padding:26px;border-radius:22px}.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);margin:.2rem 0}.progress{height:12px;background:#ffffff35;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#85ffc0}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.nav button,.btn{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:850;cursor:pointer;padding:11px}.nav button.active{background:var(--purple);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:22px;min-height:560px}.eyebrow{font-size:.78rem;letter-spacing:.1em;font-weight:900;color:#6c5298}.customer{display:grid;grid-template-columns:90px 1fr;gap:14px}.avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;background:#efe8f8}.dialog{background:#f2eef9;border-radius:16px;padding:16px}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:2px solid var(--line);border-radius:12px;background:white;cursor:pointer;font-weight:750}.choice.good{border-color:var(--green);background:#effaf6}.choice.bad{border-color:var(--red);background:#fff1f1}.ticket{border-left:6px solid var(--blue);background:#f7f9ff;padding:16px;border-radius:12px}.evidence{font-family:monospace;background:#182027;color:#8cffaa;border-radius:14px;padding:16px;white-space:pre-wrap}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.step{padding:11px 7px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:.78rem;font-weight:850;background:#faf9fd}.step.current{background:#4b3670;color:#fff}.feedback{padding:13px;margin-top:12px;border-radius:12px;background:#f2eef8}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.bottom{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:17px 0}.bottom a{text-decoration:none;color:var(--purple);background:#fff;border:1px solid var(--line);padding:11px 15px;border-radius:11px;font-weight:850}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#fff4c7;color:#604900;font-weight:900}
@media(max-width:850px){.nav{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.customer{grid-template-columns:1fr}}
</style></head><body><div class=wrap>
<header class=hero><b>NCC · ITT101 · WEEK 3</b><h1>🎧 Help Desk Command Center</h1><p>Listen to the customer, identify the problem, build and test a theory, implement a safe solution, verify the system, and document the result.</p><div class=progress><span id=bar></span></div><p><b id=count>0 of 5 missions complete</b></p></header>
<nav class=nav id=nav></nav><main class=panel id=app></main><div class=bottom><a href="../../index.html">← Learning Hub</a><a href="review.html">🎮 Week 3 Review Center</a></div></div>
<script>
const stations=[['call','🎧','Take the Call'],['diagnose','🧠','Diagnose'],['test','🧪','Test Theory'],['fix','🛠️','Fix Ticket'],['close','📝','Close Like a Pro']];let current='call',done=new Set(),soft=0,tech=0,app=document.getElementById('app');
function navDraw(){nav.innerHTML=stations.map(s=>`<button class="${current===s[0]?'active':''}" onclick="go('${s[0]}')">${s[1]} ${s[2]}</button>`).join('')}
function mark(x=current){done.add(x);bar.style.width=(done.size*20)+'%';count.textContent=`${done.size} of 5 missions complete`}
function go(x){current=x;navDraw();if(x==='call')call();if(x==='diagnose')diagnose();if(x==='test')testTheory();if(x==='fix')fix();if(x==='close')closeTicket();scrollTo({top:140,behavior:'smooth'})}
const customers=[
['👩‍💼','Maria','My computer says it has no internet. I have a presentation in 20 minutes!','Ask when it started, what changed, and whether other sites/devices work.'],
['👨‍🏫','Andre','The printer is broken again. It refuses to print anything.','Ask what happens when he prints and whether there is an error or offline message.'],
['👩‍⚕️','Leah','My laptop is unbelievably slow today.','Ask what feels slow, when it started, what apps are open, and whether anything changed recently.'],
['👨‍💼','Omar','I clicked something in an email and now weird pop-ups keep appearing.','Acknowledge the concern, ask what was clicked and what changed, and avoid blaming the user.']
];let ci=0;
function call(){ci=Math.floor(Math.random()*customers.length);let c=customers[ci];app.innerHTML=`<div class=eyebrow>MISSION 1</div><h2>🎧 Take the Call</h2><div class=customer><div class=avatar>${c[0]}</div><div class=dialog><b>${c[1]}:</b><p>“${c[2]}”</p></div></div><h3>What should you say first?</h3><button class=choice onclick="callAns(0,this)">“I know the problem. Let me fix it.”</button><button class=choice onclick="callAns(1,this)">${c[3]}</button><button class=choice onclick="callAns(2,this)">“Did you break something?”</button><button class=choice onclick="callAns(3,this)">“Restart it and call back.”</button><div id=fb class=feedback>Practice active listening, professional speaking, empathy, calmness, and problem-solving.</div><button class=btn onclick=call()>🔀 New Customer</button>`}
function callAns(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(i===1){b.classList.add('good');soft++;tech++;fb.innerHTML='✅ Strong opening. Gather facts before proposing a fix.';mark()}else{b.classList.add('bad');fb.innerHTML='Not the best first response. Start by identifying the problem without blaming the user.'}}
const diag=[
['No Internet','User reports “no internet.” Ethernet icon shows disconnected.',['DNS server failure','Disconnected/failed physical network connection','Corrupted boot loader','Muted audio'],1],
['Printer Offline','Print jobs remain queued. Windows shows the printer as Offline.',['Printer/connection state issue','Failed RAM','Phishing attack','BIOS boot order'],0],
['Application Crashes','An application began crashing immediately after a software update.',['Update compatibility/corrupted installation','Network cable','Muted volume','Monitor failure'],0],
['Pop-ups After Email Click','Unexpected pop-ups started after an email link was clicked.',['Possible malware/security issue','Printer offline','Failed SSD only','Wrong boot sequence'],0],
['No Boot','The computer powers on but does not load the operating system.',['Boot configuration/loader/storage issue','Browser blocks websites','Muted audio','Printer queue'],0]
];let di=0;
function diagnose(){di=Math.floor(Math.random()*diag.length);let d=diag[di];app.innerHTML=`<div class=eyebrow>MISSION 2</div><h2>🧠 Diagnose the Ticket</h2><div class=steps>${['Identify','Theory','Test','Plan','Implement','Verify','Document'].map((s,i)=>`<div class="step ${i===1?'current':''}">${i+1}<br>${s}</div>`).join('')}</div><div class=ticket><b>${d[0]}</b><p>${d[1]}</p></div><h3>Which theory is most supported?</h3>${d[2].map((o,i)=>`<button class=choice onclick="diagAns(${i},this)">${o}</button>`).join('')}<div id=fb class=feedback>Use symptoms and recent changes. A theory should be testable.</div><button class=btn onclick=diagnose()>🔀 New Ticket</button>`}
function diagAns(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);let d=diag[di];if(i===d[3]){b.classList.add('good');tech++;fb.innerHTML='✅ This theory best matches the evidence and can be tested.';mark()}else{b.classList.add('bad');fb.innerHTML='That theory is not best supported by the current evidence.'}}
const tests=[
['The workstation has no network because the Ethernet cable is disconnected.',['Check the physical cable/link state','Reinstall the operating system','Replace the hard drive immediately','Delete the user account'],0,'TEST RESULT: Cable is disconnected at the wall jack. Theory CONFIRMED.'],
['The printer cannot print because it is offline.',['Check printer status and connection','Reset BIOS','Run malware removal first','Replace RAM'],0,'TEST RESULT: Printer is set to Offline. Theory CONFIRMED.'],
['The application crashes because of the recent update.',['Reproduce the crash and check update/app behavior','Replace the network switch','Change monitor cable','Reformat without testing'],0,'TEST RESULT: Crash reproduces only after the update. Theory supported.'],
['Unexpected pop-ups may be related to malware.',['Use approved security/diagnostic tools and inspect symptoms','Turn the monitor off','Replace keyboard','Ignore it'],0,'TEST RESULT: Security scan detects an unwanted program. Theory CONFIRMED.']
];let ti=0;
function testTheory(){ti=Math.floor(Math.random()*tests.length);let t=tests[ti];app.innerHTML=`<div class=eyebrow>MISSION 3</div><h2>🧪 Test the Theory</h2><div class=steps>${['Identify','Theory','Test','Plan','Implement','Verify','Document'].map((s,i)=>`<div class="step ${i===2?'current':''}">${i+1}<br>${s}</div>`).join('')}</div><div class=ticket><b>Current theory</b><p>${t[0]}</p></div>${t[1].map((o,i)=>`<button class=choice onclick="testAns(${i},this)">${o}</button>`).join('')}<div id=out class=evidence>Awaiting test selection...</div><button class=btn onclick=testTheory()>🔀 New Theory</button>`}
function testAns(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);let t=tests[ti];if(i===t[2]){b.classList.add('good');out.textContent=t[3];tech++;mark()}else{b.classList.add('bad');out.textContent='TEST NOT APPROPRIATE: unrelated, too invasive, or not a direct test of the current theory.'}}
const fixes=[
['Disconnected network cable','Cable is visibly unplugged. No link.',['Reconnect the cable, confirm link, then test connectivity','Reinstall Windows','Replace CPU'],0,'Link returns and network access is tested successfully.'],
['Printer set to Offline','Printer status shows Offline.',['Return printer to online/connected state, then send a test print','Replace SSD','Change BIOS boot order'],0,'Test page prints and queued job completes.'],
['Application crashes after update','Crash reproduces after the update.',['Use an approved repair/rollback/reinstall plan for the affected application, then retest','Replace router','Disable antivirus permanently'],0,'Application completes the affected workflow without crashing.'],
['Possible malware after phishing click','Approved security scan identifies unwanted software.',['Follow approved malware-removal/security procedure, then verify','Ignore pop-ups','Delete random system files'],0,'Security scan is clean and unwanted behavior no longer occurs.']
];let fi=0;
function fix(){fi=Math.floor(Math.random()*fixes.length);let f=fixes[fi];app.innerHTML=`<div class=eyebrow>MISSION 4</div><h2>🛠️ Fix the Ticket</h2><div class=ticket><b>${f[0]}</b><p><b>Confirmed evidence:</b> ${f[1]}</p></div>${f[2].map((o,i)=>`<button class=choice onclick="fixAns(${i},this)">${o}</button>`).join('')}<div id=fb class=feedback>Choose a targeted, safe solution based on the confirmed cause.</div><button class=btn onclick=fix()>🔀 New Fault</button>`}
function fixAns(i,b){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);let f=fixes[fi];if(i===f[3]){b.classList.add('good');tech+=2;fb.innerHTML=`✅ Solution implemented.<br><b>Verification:</b> ${f[4]}<br>Do not close until full functionality is verified.`;mark()}else{b.classList.add('bad');fb.innerHTML='That action is not supported by the confirmed cause.'}}
function closeTicket(){app.innerHTML=`<div class=eyebrow>MISSION 5</div><h2>📝 Close Like a Pro</h2><div class=formgrid><label><b>Problem / symptoms</b><textarea id=p rows=4></textarea></label><label><b>Confirmed cause</b><textarea id=c rows=4></textarea></label><label><b>Tests performed</b><textarea id=t rows=4></textarea></label><label><b>Solution implemented</b><textarea id=s rows=4></textarea></label><label><b>Verification</b><textarea id=v rows=4></textarea></label><label><b>Customer follow-up</b><textarea id=f rows=4></textarea></label></div><button class=btn onclick=checkClose()>Close Ticket</button><button class=btn onclick="document.querySelectorAll('textarea').forEach(x=>x.value='')">Reset</button><div id=fb class=feedback>Complete all six fields before closing.</div>`}
function checkClose(){let ids=['p','c','t','s','v','f'];let ok=ids.every(id=>document.getElementById(id).value.trim().length>=12);if(ok){soft+=2;tech+=2;fb.innerHTML=`✅ <b>TICKET CLOSED.</b><br><span class=badge>🏆 HELP DESK MISSION READY</span><br><br>Technical score: ${tech} · Soft-skills score: ${soft}`;mark('close')}else fb.innerHTML='Add meaningful notes to every field so another technician can understand the ticket.'}
navDraw();call();
</script></body></html>
